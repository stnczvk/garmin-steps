<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Łysy z siłowni · linki</title>
<meta name="description" content="Redukcja dzień po dniu – vlogi, trening i jedzenie. YouTube, Instagram, TikTok.">
<meta property="og:title" content="Łysy z siłowni"><meta property="og:description" content="Redukcja dzień po dniu – vlogi, trening i jedzenie."><meta property="og:image" content="/bio/avatar.jpg">
<meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0e0f13" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/bio/avatar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Lora:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#141414;--mu:#6b6b72;--ln:rgba(0,0,0,.07);--red:#e5232f;--sh:0 1px 2px rgba(0,0,0,.04),0 10px 30px -16px rgba(0,0,0,.22)}
@media (prefers-color-scheme:dark){:root{--bg:#0e0f13;--card:#17181e;--tx:#f3f3f5;--mu:#9a9aa5;--ln:rgba(255,255,255,.08);--sh:0 1px 0 rgba(255,255,255,.04) inset,0 14px 34px -18px rgba(0,0,0,.8)}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;
 background-image:radial-gradient(70% 40% at 50% 0%,rgba(229,35,47,.10),transparent 70%)}
.w{max-width:460px;margin:0 auto;padding:44px 16px calc(32px + env(safe-area-inset-bottom))}
.in{opacity:0;transform:translateY(14px);animation:up .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1;transform:none}}
.top{text-align:center}
.av{width:104px;height:104px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;box-shadow:0 0 0 4px var(--bg),0 0 0 6px var(--red),0 18px 40px -16px rgba(229,35,47,.6)}
h1{font:800 28px/1.1 Inter;letter-spacing:-.03em;margin:18px 0 4px}
.nick{color:var(--mu);font-weight:600;font-size:14px}
.tag{font:600 italic 19px Lora,serif;margin:12px auto 0;max-width:320px;line-height:1.35}
.st{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.st span{display:inline-flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--ln);border-radius:30px;padding:7px 14px;font-weight:700;font-size:13px;box-shadow:var(--sh)}
.st span i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(229,35,47,.6);animation:pl 2s infinite}
@keyframes pl{70%{box-shadow:0 0 0 7px rgba(229,35,47,0)}100%{box-shadow:0 0 0 0 rgba(229,35,47,0)}}
.lbl{font-size:11.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:30px 4px 10px}
a{color:inherit;text-decoration:none}
.vid{display:block;background:var(--card);border:1px solid var(--ln);border-radius:20px;overflow:hidden;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.vid:hover{transform:translateY(-3px)}
.th{position:relative;aspect-ratio:16/9;background:#000}.th img{width:100%;height:100%;object-fit:cover;display:block}
.th b{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;background:var(--red);display:grid;place-items:center;box-shadow:0 10px 30px rgba(0,0,0,.4);transition:transform .25s}
.vid:hover .th b{transform:scale(1.08)}
.vt{padding:13px 16px 15px;font-weight:700;font-size:15px;line-height:1.35}.vt small{display:block;color:var(--mu);font-weight:600;font-size:12.5px;margin-top:3px}
.ls{display:flex;flex-direction:column;gap:10px}
.bt{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:12px 16px 12px 12px;box-shadow:var(--sh);transition:transform .2s,border-color .2s}
.bt:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--red) 35%,var(--ln))}.bt:active{transform:scale(.98)}
.ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff}
.bt div{flex:1;min-width:0}.bt b{display:block;font-size:15.5px;font-weight:700}.bt small{color:var(--mu);font-weight:600;font-size:12.5px}
.ar{color:var(--mu);transition:transform .2s}.bt:hover .ar{transform:translateX(3px);color:var(--red)}
.ft{text-align:center;color:var(--mu);font-size:12px;margin-top:34px}
</style></head><body>
<div class="w">
 <div class="top">
  <img class="av in" src="/bio/avatar.jpg" alt="Bartłomiej" style="animation-delay:.02s">
  <h1 class="in" style="animation-delay:.08s">Łysy z siłowni</h1>
  <div class="nick in" style="animation-delay:.12s">@lysyzsilowni · Bartłomiej</div>
  <p class="tag in" style="animation-delay:.16s">Redukcja dzień po dniu – trening, jedzenie i życie bez filtra.</p>
  <div class="st in" id="st" style="animation-delay:.2s"></div>
 </div>
 <div id="vbox"></div>
 <div class="lbl in" style="animation-delay:.32s">Znajdziesz mnie tu</div>
 <div class="ls">
  <a class="bt in" id="l-yt" target="_blank" rel="noopener" style="animation-delay:.36s"><span class="ic" style="background:#e5232f"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="4.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 9.3l5 2.7-5 2.7z" fill="#fff"/></svg></span><div><b>YouTube</b><small>Vlogi z całego tygodnia</small></div><svg class="ar" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
  <a class="bt in" id="l-ig" target="_blank" rel="noopener" style="animation-delay:.41s"><span class="ic" style="background:linear-gradient(45deg,#f9a72b,#e1306c,#833ab4)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff"/></svg></span><div><b>Instagram</b><small>@st4nczuk_ · codzienne jedzenie</small></div><svg class="ar" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
  <a class="bt in" id="l-tt" target="_blank" rel="noopener" style="animation-delay:.46s"><span class="ic" style="background:#141414"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.5 2.7 2.3 4.5 5 5"/></svg></span><div><b>TikTok</b><small>@lysyzsilowni · krótkie filmy</small></div><svg class="ar" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></a>
 </div>
 <div class="ft">© Łysy z siłowni</div>
</div>
<script>
(async()=>{const $=id=>document.getElementById(id);let d=null;try{d=await (await fetch('/bio/data')).json()}catch(e){}
 const L=(d&&d.links)||{youtube:'https://www.youtube.com/@lysyzsilowni',instagram:'https://www.instagram.com/st4nczuk_/',tiktok:'https://www.tiktok.com/@lysyzsilowni'};
 $('l-yt').href=L.youtube;$('l-ig').href=L.instagram;$('l-tt').href=L.tiktok;
 const s=[];if(d&&d.day)s.push(`<span><i></i>Dzień ${d.day} redukcji</span>`);if(d&&d.followers)s.push(`<span>${d.followers.toLocaleString('pl-PL')} obserwujących</span>`);$('st').innerHTML=s.join('');
 const v=d&&d.latest;if(v&&v.id){const e=t=>String(t||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  $('vbox').innerHTML=`<div class="lbl in" style="animation-delay:.24s">Najnowszy vlog</div><a class="vid in" style="animation-delay:.28s" href="${e(v.url)}" target="_blank" rel="noopener"><div class="th"><img src="https://i.ytimg.com/vi/${e(v.id)}/hqdefault.jpg" alt=""><b><svg width="26" height="26" viewBox="0 0 24 24"><path d="M8 5.5l11 6.5-11 6.5z" fill="#fff"/></svg></b></div><div class="vt">${e(v.title)}<small>Obejrzyj na YouTube</small></div></a>`}
})();
</script>
</body></html>
