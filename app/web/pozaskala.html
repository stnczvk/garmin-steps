<!doctype html>
<html lang="pl" class="lg-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipeline PozaSkala</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap">
<style>
button,input,select,textarea{font-family:inherit}

:root{--bg:#08090A;--card:rgba(255,255,255,.03);--line:rgba(255,255,255,.08);--ink:#F4F4F5;--soft:#A1A1AA;--faint:#6B6B75;
 --ok:#4ADE80;--err:#FF7B70;--run:#6E8BFF;--wait:#F5B25A;--off:#52525B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;color:var(--ink);font:14px/1.45 Geist,system-ui,sans-serif}
body{background:transparent;min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1 small{font:12px Geist,system-ui,sans-serif;color:var(--faint);font-weight:400}
.mono{font-family:Geist,system-ui,sans-serif}
#msg{margin:14px 0;padding:12px 14px;border:1px solid rgba(245,178,90,.35);background:rgba(245,178,90,.07);border-radius:12px;color:#f6d7a8;display:none}
#msg code{background:rgba(0,0,0,.35);padding:1px 6px;border-radius:5px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{color:var(--faint);font-size:12px}
.kpi b{display:block;font-size:24px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--soft)}
.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow-x:auto;position:relative}
svg{display:block;min-width:960px;width:100%;height:auto}
.node rect{fill:#121318;stroke:rgba(255,255,255,.1);transition:stroke .3s}
.node text{fill:var(--ink)}
.node .sub{fill:var(--faint);font:10px Geist,system-ui,sans-serif}
.lane.running .node rect{animation:pulse 2.4s ease-in-out infinite;animation-delay:calc(var(--i)*.3s)}
@keyframes pulse{0%,100%{stroke:rgba(255,255,255,.1)}40%{stroke:var(--c);filter:drop-shadow(0 0 8px var(--c))}}
.edge{fill:none;stroke:rgba(255,255,255,.12);stroke-width:2}
.flow{fill:none;stroke:var(--c);stroke-width:2;stroke-dasharray:6 10;animation:dash 1.2s linear infinite;opacity:.55}
.lane.off .flow,.lane.off circle.pk{opacity:.08}
.lane.error .flow{stroke:var(--err)}
@keyframes dash{to{stroke-dashoffset:-32}}
.loop{fill:none;stroke:#14A898;stroke-width:1.6;stroke-dasharray:3 7;animation:dash 2s linear infinite;opacity:.6}
.lhead{cursor:pointer}
.lhead rect{fill:rgba(255,255,255,.025);stroke:var(--line)}
.lhead:hover rect,.lhead.sel rect{stroke:var(--c)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:14px;font-weight:650;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.card h2 button{font:12px Geist,system-ui,sans-serif;color:var(--soft);background:none;border:1px solid var(--line);border-radius:7px;padding:3px 8px;cursor:pointer}
.ex{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--line);font-size:13px}
.ex:first-of-type{border-top:0}
.ex time,.ex .d{font:11.5px Geist,system-ui,sans-serif;color:var(--faint)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--off)}
.success{--s:var(--ok)}.error{--s:var(--err)}.running{--s:var(--run)}.waiting{--s:var(--wait)}
.dot.success,.dot.error,.dot.running,.dot.waiting{background:var(--s);box-shadow:0 0 8px var(--s)}
.dot.running{animation:blink 1s infinite}@keyframes blink{50%{opacity:.3}}
.wf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:9px 4px;border-top:1px solid var(--line);font-size:13px}
.wf:first-of-type{border-top:0}
.acts{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button{font:12px Geist,system-ui;color:inherit;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.acts button.go{border-color:#6E8BFF;color:#AFC0FF}.acts button:disabled{opacity:.5;cursor:wait}
.ex.click{cursor:pointer}.ex.click:hover{background:rgba(255,255,255,.04)}
.exd{grid-column:1/-1;font-size:12.5px;line-height:1.45;background:rgba(255,123,112,.08);border:1px solid rgba(255,123,112,.3);border-radius:10px;padding:9px 11px;margin:4px 0 6px;overflow-wrap:anywhere}
.exd b{color:#FF9C93}.exd .acts{margin-top:8px}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--sab,0px));transform:translateX(-50%);background:#16171f;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;z-index:9;display:none;max-width:90vw}
.wf small{grid-column:1/3;color:var(--faint);font:11px Geist,system-ui,sans-serif}
.tag{font:11px Geist,system-ui,sans-serif;padding:2px 7px;border-radius:6px;background:rgba(74,222,128,.1);color:var(--ok)}
.tag.no{background:rgba(255,255,255,.05);color:var(--faint)}
.tg{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;font:650 14px Geist,system-ui,sans-serif;color:var(--ink)}
.tg i{font-style:normal;color:var(--faint);transition:transform .25s;display:inline-block}
.fold.closed .tg i{transform:rotate(-90deg)}.fold.closed .body{display:none}.fold.closed h2{margin-bottom:0}
.grid2{align-items:start}
.empty{color:var(--faint);font-size:13px;padding:10px 4px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:minmax(0,1fr)}}
@media(prefers-reduced-motion:reduce){.flow,.loop,.lane.running .node rect,.dot.running{animation:none}}
html{background:#06070c}html[data-theme=light]:not(.lg-dark){background:#eef0f8}
.lanes{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.ln{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px 12px 17px;overflow:hidden}
.ln:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.ln.sel{border-color:var(--c)}.ln.off{opacity:.6}
.ln.running:after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,transparent,var(--c),transparent);animation:sweep 1.4s linear infinite}
@keyframes sweep{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.lnh{display:flex;align-items:center;justify-content:space-between;gap:8px}.lnh b{font-size:16px}
.lnw{font:12px Geist,system-ui,sans-serif;color:var(--soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lnm{font-size:12.5px;color:var(--faint);margin-top:4px}
.steps{display:flex;flex-wrap:wrap;gap:4px 3px;align-items:center;margin-top:10px;font-size:11.5px}
.steps span{padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.05);color:var(--soft);white-space:nowrap}.steps i{font-style:normal;color:var(--faint)}
.lna{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.lna button{font:12px Geist,system-ui;color:inherit;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:6px 11px;cursor:pointer}
.lna button.go{border-color:var(--c);color:#fff;background:color-mix(in oklab,var(--c) 30%,transparent)}
.pill{font:600 11px Geist,system-ui;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);color:var(--soft);white-space:nowrap}
.pill.success{background:rgba(74,222,128,.14);color:var(--ok)}.pill.error,.pill.crashed{background:rgba(255,123,112,.14);color:var(--err)}.pill.running{background:rgba(110,139,255,.16);color:#AFC0FF}.pill.waiting{background:rgba(245,178,90,.14);color:var(--wait)}
.stage-d{margin-top:10px}.stage-d summary{cursor:pointer;color:var(--faint);font-size:12.5px;padding:4px}
.ex{grid-template-columns:10px minmax(0,1fr) auto 12px!important;padding:10px 4px!important}
.exn b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.exn small{color:var(--faint);font:11.5px Geist,system-ui,sans-serif}
.chev{color:var(--faint);font-size:18px}
.exd{background:rgba(255,255,255,.04)!important;border-color:var(--line)!important}
.wf .acts .more{display:contents}.wf details.mo{grid-column:1/3}.wf details.mo summary{cursor:pointer;color:var(--faint);font-size:12px;margin-top:6px}
.trs{display:flex;flex-direction:column;gap:4px;margin-top:6px}.tr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:12.5px;padding:5px 8px;border-radius:8px;background:rgba(255,255,255,.04)}.tr small{grid-column:1/-1;color:var(--faint);font:11px Geist,system-ui,sans-serif;overflow-wrap:anywhere}.tr.zero b{color:#F5B25A}.tr.bad b{color:#FF5C6C}
.now:empty{display:none!important}
.now{display:flex;align-items:center;gap:14px;margin:14px 0 12px;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:var(--card)}
.now .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:rgba(255,255,255,.06)}
.now b{display:block;font-size:17px}.now.run{flex-direction:column;align-items:stretch}.nrow{display:flex;align-items:center;gap:14px}.nrow>div:nth-child(2){flex:1;min-width:0}.nrow .r{margin-left:auto}
.prog{height:3px;border-radius:3px;background:rgba(110,139,255,.2);overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;width:35%;background:#6E8BFF;border-radius:3px;animation:indet 1.4s ease-in-out infinite}@keyframes indet{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.flash{animation:fl 2.4s ease-out}@keyframes fl{0%{background:rgba(74,222,128,.25)}100%{background:transparent}}.now span{color:var(--soft);font-size:13px}.now .r{margin-left:auto;text-align:right}
.now.run{border-color:rgba(110,139,255,.5);background:linear-gradient(90deg,rgba(110,139,255,.16),rgba(110,139,255,.03))}.now.run .ic{background:rgba(110,139,255,.25);animation:blink 1.4s infinite}
.now.bad{border-color:rgba(255,123,112,.45);background:linear-gradient(90deg,rgba(255,123,112,.14),rgba(255,123,112,.02))}
.sech{font-size:14px;font-weight:650;margin:16px 2px 8px;color:var(--soft)}
.td{display:grid;grid-template-columns:58px 24px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);font-size:13.5px}
.td:first-child{border-top:0}.td time{font:600 14px Geist,system-ui,sans-serif}.td.past time{color:var(--faint)}.td .em{font-size:16px;text-align:center}
.td small{display:block;color:var(--faint);font-size:12px}.td.next{background:rgba(110,139,255,.08);border-radius:10px}
.lane-ic{font-size:18px;margin-right:6px}
.ln .steps{display:none}
.kpis[hidden]{display:none!important}
.sum{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}.sum span{font:600 12.5px Geist,system-ui;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--soft)}.sum b{color:var(--ink)}.sum .bad b{color:var(--err)}.sum .ok b{color:var(--ok)}
.ptabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line);margin:4px 0 12px;position:sticky;top:0;z-index:5;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.ptabs button{flex:1;border:0;background:transparent;color:var(--soft);font:600 13px Geist,system-ui;padding:9px 6px;border-radius:10px;cursor:pointer;white-space:nowrap}
.ptabs button.on{background:linear-gradient(145deg,rgba(255,255,255,.18),rgba(255,255,255,.06));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
body:not(.t-long) .pt-long,body:not(.t-today) .pt-today,body:not(.t-lanes) .pt-lanes,body:not(.t-hist) .pt-hist,body:not(.t-wf) .pt-wf{display:none!important}
.grid2{display:block!important;margin-top:0}.grid2>.card{margin-top:0}
.fold .tg i{display:none}.fold.closed .body{display:block!important}
.lanes{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.ln .lnw{display:none}.ln .lnm{font-size:13px;color:var(--soft)}
@media(max-width:600px){.ptabs button{font-size:12px;padding:8px 4px}.td{grid-template-columns:50px 22px minmax(0,1fr) 10px}}
.dlc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:2px 0 12px;font-size:13px;color:var(--soft)}
.dlc label{display:flex;gap:6px;align-items:center;background:var(--v3-s3,#242536);border-radius:10px;padding:6px 10px;cursor:pointer}
.dli{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}.dli:first-child{border:0}
.dli .h{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.dli b{font-size:14px}.dli small{color:var(--faint)}
.dli video{width:100%;max-width:640px;border-radius:12px;background:#000;aspect-ratio:16/9}
.st{font:600 11.5px Geist,system-ui;padding:3px 8px;border-radius:8px;background:var(--v3-s3,#242536)}.st.ok{color:var(--ok);background:rgba(61,220,132,.12)}.st.wr{color:var(--warn);background:rgba(255,194,75,.12)}.st.bad{color:var(--bad);background:rgba(255,107,122,.12)}
</style>

</head>
<body class="lg">
<div class="lg-bg" aria-hidden="true"></div>
<div class="wrap">
 <h1>Pipeline PozaSkala <small id="upd">łączę z n8n…</small></h1>
 <div id="msg"></div>
 <div class="sum" id="sum"></div>
 <div class="kpis" hidden>
  <div class="kpi"><small>Aktywne workflow</small><b id="k1">–</b><span id="k1s"></span></div>
  <div class="kpi"><small>Uruchomienia 24h</small><b id="k2">–</b><span id="k2s"></span></div>
  <div class="kpi"><small>Błędy 24h</small><b id="k3">–</b><span id="k3s"></span></div>
  <div class="kpi"><small>Następny start</small><b id="k4">–</b><span id="k4s"></span></div>
 </div>
 <div class="now" id="now"></div>
 <div class="ptabs" id="ptabs"><button data-t="today" class="on">📅 Dziś</button><button data-t="lanes">🧩 Etapy</button><button data-t="hist">🕘 Historia</button><button data-t="long">🎬 Długie</button><button data-t="wf">⚙️ Zarządzaj</button></div>
 <div class="card pt-today" id="c-today"><h2><span>📅 Dziś według harmonogramu</span><small id="tdd" class="mono" style="color:var(--faint);font-weight:400"></small></h2><div id="today"></div></div>
 <div class="card pt-long" id="c-long"><h2><span>🎬 Długie filmy YouTube – „What If?” ze stickmanem</span><button class="btn" id="dlRun">Zrób teraz</button></h2>
  <div class="dlc" id="dlCfg"></div><div id="dlList"><div class="empty">Ładuję…</div></div></div>
 <div class="lanes pt-lanes" id="lanes"></div>
 <details class="stage-d" hidden><summary>Schemat przepływu</summary><div class="stage"><svg id="svg" viewBox="0 0 1200 640" role="img" aria-label="Schemat pipeline'u PozaSkala"></svg></div></details>
 <div class="grid2">
  <div class="card fold pt-hist" id="c-ex"><h2><button class="tg" aria-expanded="true"><i>▾</i><span id="exT">Ostatnie uruchomienia</span></button><button id="all" hidden>pokaż wszystkie</button></h2><div class="body" id="exl"><div class="empty">Ładuję…</div></div></div>
  <div class="card fold pt-wf" id="c-wf"><h2><button class="tg" aria-expanded="true"><i>▾</i><span>Workflow w n8n</span></button></h2><div class="body" id="wfl"><div class="empty">Ładuję…</div></div></div>
 </div>
</div>
<div id="toast" role="status"></div>
<script>
const LANES=[
 {key:'gen',match:/generator/i,title:'Generator',color:'#6E8BFF',nodes:[['⏰','Start','harmonogram'],['🧠','Temat','insights + AI'],['✍️','Scenariusz','OpenAI'],['🎙️','Lektor','TTS'],['🖼️','Kadry','OpenAI img'],['🎬','Scena','Kling / fal.ai'],['🏷️','SEO + okładka','seo.json'],['☁️','Drive','folder filmu']]},
 {key:'mont',match:/monta/i,title:'Montaż film',color:'#9E8CFC',nodes:[['📥','Pobranie','z Drive'],['🎞️','Render','FFmpeg 1080×1920'],['💬','Napisy','Whisper karaoke'],['🎵','Muzyka','pod lektorem'],['✅','final.mp4','gotowy film'],['📦','Kolejka','_queue']]},
 {key:'pub',match:/publish/i,title:'Publisher',color:'#E8504A',nodes:[['⏰','Start','harmonogram'],['📦','Z kolejki','_queue'],['▶️','YouTube','publishAt'],['📸','Instagram','Reels'],['📨','Telegram','powiadomienie']]},
 {key:'ana',match:/analytic/i,title:'Analityka',color:'#14A898',nodes:[['⏰','Start','niedziela'],['📊','Statystyki','YT + IG'],['⚖️','Scoring','po kategoriach'],['📝','Insights','FAVOR / REDUCE']]}
];
const NW=122,NH=58,X0=250,X1=1140,Y0=95,DY=145,$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
LANES.forEach((L,li)=>{const n=L.nodes.length,step=(X1-X0)/(n-1);L.y=Y0+li*DY;L.pts=L.nodes.map((_,i)=>[X0+i*step,L.y])});
let state=null,sel=null;

function laneStatus(L){
 if(!state||!state.ok)return{st:'off',wf:null,last:null};
 const wfs=state.workflows.filter(w=>L.match.test(w.name)&&!/error/i.test(w.name));
 const wf=wfs.find(w=>w.active)||wfs[0];if(!wf)return{st:'off',wf:null,last:null};
 const ids=new Set(wfs.map(w=>w.id)),last=state.executions.find(e=>ids.has(e.workflowId));
 const man=(state.started||[]).some(m=>ids.has(m.workflowId));
 return{st:man?'running':!wf.active?'off':last?last.status:'idle',wf,wfs,last};
}
const ago=t=>{if(!t)return'–';const s=(Date.now()-new Date(t))/1000;if(s<90)return'przed chwilą';if(s<3600)return Math.round(s/60)+' min temu';if(s<86400)return Math.round(s/3600)+' godz. temu';return Math.round(s/86400)+' dni temu'};
const ST={success:'sukces',error:'błąd',running:'działa',waiting:'czeka',off:'wyłączony',idle:'bez uruchomień',canceled:'przerwany',crashed:'awaria'};

function draw(){
 let h=`<defs><filter id="gl"><feGaussianBlur stdDeviation="3"/></filter></defs>`;
 // przejścia między etapami
 const link=(a,b,c)=>`<path class="edge" d="M${a[0]},${a[1]+NH/2} C${a[0]},${a[1]+DY/2+10} ${b[0]},${b[1]-DY/2-10} ${b[0]},${b[1]-NH/2}"/><path class="flow" style="--c:${c}" d="M${a[0]},${a[1]+NH/2} C${a[0]},${a[1]+DY/2+10} ${b[0]},${b[1]-DY/2-10} ${b[0]},${b[1]-NH/2}"/>`;
 h+=link(LANES[0].pts.at(-1),LANES[1].pts[0],LANES[1].color);
 h+=link(LANES[1].pts.at(-1),LANES[2].pts[1],LANES[2].color);
 // pętla zwrotna: Insights -> Temat
 const a=LANES[3].pts.at(-1),b=LANES[0].pts[1];
 h+=`<path class="loop" d="M${a[0]+NW/2},${a[1]} H1185 V28 H${b[0]} V${b[1]-NH/2}"/><text x="1178" y="300" fill="#14A898" font-size="11" font-family=Geist transform="rotate(90 1178 300)" text-anchor="middle">pętla zwrotna: co działa → nowe tematy</text>`;
 LANES.forEach((L,li)=>{
  const s=laneStatus(L),c=L.color,d=`M${L.pts.map(p=>p.join(',')).join(' L')}`;
  const cls=s.st==='running'?'running':s.st==='error'?'error':s.st==='off'?'off':'';
  h+=`<g class="lane ${cls}" style="--c:${c}">`;
  h+=`<path class="edge" d="${d}"/><path class="flow" d="${d}"/>`;
  const dur=s.st==='running'?3:8;
  for(let k=0;k<3;k++)h+=`<circle class="pk" r="3.5" fill="${c}" filter="url(#gl)"><animateMotion dur="${dur}s" begin="${-k*dur/3}s" repeatCount="indefinite" path="${d}"/></circle><circle class="pk" r="2" fill="#fff"><animateMotion dur="${dur}s" begin="${-k*dur/3}s" repeatCount="indefinite" path="${d}"/></circle>`;
  L.nodes.forEach(([ic,t,sub],i)=>{const [x,y]=L.pts[i];

// ---- czytelny widok: co działa teraz i co dziś startuje ----
const LIC={gen:'🎬',mont:'🎞️',pub:'🚀',ana:'📊'};
function laneOf(name){return LANES.find(L=>L.match.test(name||''))}
function nice(name){const L=laneOf(name);return L?`${LIC[L.key]} ${L.title}`:'⚙️ '+(name||'?')}
function actives(){if(!state||!state.ok)return[];
 const run=state.executions.filter(e=>e.status==='running'||e.status==='waiting').map(e=>({wid:e.workflowId,name:e.workflow,since:new Date(e.startedAt).getTime(),id:e.id}));
 (state.started||[]).forEach(m=>{if(!run.some(r=>r.wid===m.workflowId))run.push({wid:m.workflowId,name:m.workflow,since:m.t*1000,manual:1})});return run}
const fmtDur=s=>s==null?'':s<120?s+' s':Math.round(s/60)+' min';
function nowCard(){const el=$('now');if(!state||!state.ok){el.innerHTML='';return}
 const run=actives();
 const bad=state.executions.find(e=>['error','crashed'].includes(e.status)&&Date.now()-new Date(e.startedAt)<6*3600e3);
 const n=nextStart();
 if(run.length){
  el.className='now run';el.innerHTML=run.map((e,i)=>{const s=Math.round((Date.now()-e.since)/1000);
   return`<div class="nrow"><div class="ic">▶</div><div><b>Teraz działa: ${esc(nice(e.name))}</b><span>${esc(e.name)} · od ${fmtDur(Math.max(1,s))}${e.manual?' · uruchomione z centrum, n8n pracuje':''}</span><div class="prog"><i></i></div></div>${e.id?`<div class="r"><button class="pill running" data-nex="${esc(e.id)}">Przebieg ›</button></div>`:''}</div>`}).join('')}
 else if(bad){el.className='now bad';el.innerHTML=`<div class="ic">⚠️</div><div><b>Błąd: ${esc(nice(bad.workflow))}</b><span>${ago(bad.startedAt)} · kliknij, żeby zobaczyć co poszło nie tak</span></div><div class="r"><button class="pill error" data-nex="${esc(bad.id)}">Szczegóły ›</button></div>`}
 else{el.className='now';el.innerHTML=`<div class="ic">✓</div><div><b>Nic teraz nie działa</b><span>${n?`następny start: ${esc(nice(n.w))} o ${n.d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})}`:'brak zaplanowanych startów'}</span></div>`}
 el.querySelectorAll('[data-nex]').forEach(b=>b.onclick=()=>{setTab('hist');sel=null;list();setTimeout(()=>{detail(b.dataset.nex);$('d'+b.dataset.nex)?.scrollIntoView({behavior:'smooth',block:'center'})},50)})}
function today(){const el=$('today');if(!state||!state.ok){el.innerHTML='';return}
 const now=new Date(),rows=[];
 state.workflows.filter(w=>w.active).forEach(w=>(w.schedules||[]).forEach(sc=>{if(!sc.time)return;
  if(sc.every==='weeks'&&sc.days&&!sc.days.includes(now.getDay()))return;
  const [hh,mm]=sc.time.split(':').map(Number),d=new Date(now);d.setHours(hh,mm,0,0);
  const ex=state.executions.find(e=>e.workflowId===w.id&&Math.abs(new Date(e.startedAt)-d)<45*60e3);
  rows.push({d,w,ex})}));
 rows.sort((a,b)=>a.d-b.d);const nx=rows.find(r=>r.d>now&&!r.ex);
 const ICO={success:'✅',error:'❌',crashed:'❌',running:'⏳',waiting:'⏳'};
 el.innerHTML=rows.map(r=>{const past=r.d<=now,st=r.ex?r.ex.status:past?'missed':'plan';
  const dur=r.ex&&r.ex.stoppedAt?Math.round((new Date(r.ex.stoppedAt)-new Date(r.ex.startedAt))/1000):null;
  return`<div class="td ${past?'past':''} ${r===nx?'next':''}" ${r.ex?`data-tex="${esc(r.ex.id)}" style="cursor:pointer"`:''}><time>${r.d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})}</time><span class="em">${ICO[st]||(st==='missed'?'⚠️':'🕒')}</span>
   <div><b>${esc(nice(r.w.name))}</b><small>${esc(r.w.name)}${r.ex?' · '+(ST[st]||st)+(dur!=null?' · '+fmtDur(dur):''):st==='missed'?' · nie wystartował':r===nx?' · następny':''}</small></div><span class="chev">${r.ex?'›':''}</span></div>`}).join('')||'<div class="empty">Brak startów zaplanowanych na dziś.</div>';
 $('tdd').textContent=now.toLocaleDateString('pl',{weekday:'long',day:'numeric',month:'long'});
 el.querySelectorAll('[data-tex]').forEach(r=>r.onclick=()=>{setTab('hist');sel=null;list();setTimeout(()=>{detail(r.dataset.tex);$('d'+r.dataset.tex)?.scrollIntoView({behavior:'smooth',block:'center'})},50)})}

function nextStart(){
 const now=new Date();let best=null;
 (state?.workflows||[]).filter(w=>w.active).forEach(w=>w.schedules.forEach(s=>{if(!s.time||s.every==='weeks')return;
  const [hh,mm]=s.time.split(':').map(Number),d=new Date(now);d.setHours(hh,mm,0,0);if(d<=now)d.setDate(d.getDate()+1);
  if(!best||d<best.d)best={d,w:w.name}}));
 return best;
}

  <details class="mo"><summary>⋯ Edycja (pobierz, wgraj nową wersję, nazwa)</summary><div class="acts">
  <button data-exp="${esc(w.id)}" title="Pobierz plik .json (kopia / do edycji w n8n)">⬇ Pobierz</button><button data-imp="${esc(w.id)}" title="Podmień na plik wyeksportowany z n8n – stara wersja trafi do kopii">⬆ Wgraj nową wersję</button><button data-ren="${esc(w.id)}">✎ Nazwa</button></div></details></div>`).join('')+
  `<div class="acts" style="margin-top:12px"><button class="go" data-imp="">⬆ Wgraj nowy workflow</button><button id="bkb">🗂 Kopie i przywracanie</button></div><div id="bkl"></div>`;

   const n=prompt('Nowa nazwa workflow (uwaga: Pipeline rozpoznaje etapy po nazwach: generator, Montaż, Publisher, Analytics):',w.name);if(!n||n===w.name)return;
   const r=await (await fetch('/api/n8n/rename/'+w.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})})).json();toast(r.ok?'Zmieniono nazwę.':'Nie wyszło: '+r.error);load(true)});
 $('bkb').onclick=backups;
 $('wfl').querySelectorAll('[data-run]').forEach(b=>b.onclick=()=>act(b,'/api/n8n/run/'+b.dataset.run+(b.dataset.trig?'?trigger='+encodeURIComponent(b.dataset.trig):''),'▶ Uruchomiono – widać to na górze w „Teraz działa”.',
   'Uruchomić teraz „'+(state.workflows.find(w=>w.id===b.dataset.run)||{}).name+'”'+(b.dataset.trig?' tak, jakby wystartował harmonogram „'+b.dataset.trig+'”':'')+'?'));
 $('wfl').querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>act(b,`/api/agency/n8n/${b.dataset.tog}/${b.dataset.on==='1'?'deactivate':'activate'}`,b.dataset.on==='1'?'Wyłączono.':'Włączono.'));

function pickFile(target){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
 i.onchange=async()=>{const f=i.files[0];if(!f)return;let wf;try{wf=JSON.parse(await f.text())}catch(e){toast('To nie jest plik JSON.');return}
  const w=target&&state.workflows.find(x=>x.id===target);
  if(!confirm(w?`Podmienić „${w.name}” na „${f.name}”? Obecna wersja zostanie zapisana w kopiach (możesz ją przywrócić).`:`Dodać nowy workflow z „${f.name}”?`))return;
  toast('Wgrywam…');const r=await (await fetch('/api/n8n/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({workflow:wf,target})})).json();
  toast(r.ok?(w?'Wgrano nową wersję. '+(r.note||''):'Dodano nowy workflow (wyłączony – włącz go, gdy będzie gotowy).'):'Nie wyszło: '+r.error);load(true)};

async function detail(id){
 const d=$('d'+id);if(!d)return;if(!d.hidden){d.hidden=true;return}
 d.hidden=false;d.textContent='Pobieram przebieg…';
 try{const r=await (await fetch('/api/n8n/execution/'+id)).json();
  if(!r.ok){d.textContent='Nie da się pobrać szczegółów: '+(r.error||'');return}
  const hint=/quota|insufficient|billing|429|rate limit/i.test(r.message+r.description)?'<br>💡 Wygląda na brak środków / limit w API – po doładowaniu kliknij „Ponów”.':'';
  const tr=(r.trace||[]).map(t=>`<div class="tr ${t.error?'bad':t.items?'':'zero'}"><span>${esc(t.node)}</span><b>${t.error?'błąd':t.items+' el.'}</b>${t.error?`<small>${esc(t.error)}</small>`:t.sample?`<small>${esc(t.sample)}</small>`:''}</div>`).join('');
  const z=(r.trace||[]).find(t=>!t.items&&!t.error);
  d.innerHTML=(r.message?`<b>${esc(r.node||'Błąd')}</b>: ${esc(r.message)}${r.description?'<br>'+esc(r.description):''}${hint}`:(z?`💡 Dane kończą się na <b>${esc(z.node)}</b> – ten krok nic nie przekazał dalej.`:'✓ Wszystkie kroki przekazały dane.'))+
   `<details ${r.message?'':'open'} style="margin-top:8px"><summary>Przebieg krok po kroku (${(r.trace||[]).length})</summary><div class="trs">${tr}</div></details>
   <div class="acts">${r.message?`<button class="go" data-retry="${esc(id)}">↻ Ponów od miejsca błędu</button>`:''}${r.workflowId?`<button data-rerun="${esc(r.workflowId)}">▶ Uruchom od nowa</button>`:''}</div>`;
  const rt=d.querySelector('[data-retry]');if(rt)rt.onclick=e=>{e.stopPropagation();act(e.target,'/api/n8n/retry/'+id,'Ponowiono – sprawdź uruchomienia za chwilę.')};

 }catch(e){d.textContent='Brak połączenia z centrum.'}
}

async function dlLoad(){let r;try{r=await (await fetch('/api/dlugi')).json()}catch(e){return}
 const c=r.cfg,D=['pn','wt','śr','cz','pt','sb','nd'];
 $('dlCfg').innerHTML=`<label><input type="checkbox" id="dlEn" ${c.enabled?'checked':''}>automatycznie</label>`+D.map((d,i)=>`<label><input type="checkbox" data-dd="${i}" ${c.days.includes(i)?'checked':''}>${d}</label>`).join('')+
  `<label><input type="checkbox" id="dlAp" ${c.auto_publish?'checked':''}>publikuj bez zatwierdzania</label>`;
 const save=()=>fetch('/api/dlugi-cfg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled:$('dlEn').checked,auto_publish:$('dlAp').checked,days:[...document.querySelectorAll('[data-dd]')].filter(x=>x.checked).map(x=>+x.dataset.dd)})});
 $('dlCfg').querySelectorAll('input').forEach(i=>i.onchange=save);
 $('dlRun').disabled=r.busy;$('dlRun').textContent=r.busy?'Robi film…':'Zrób teraz';
 const S={working:['w trakcie','wr'],review:['do zatwierdzenia','ok'],uploading:['wysyłam','wr'],published:['opublikowany','ok'],error:['błąd','bad'],rejected:['odrzucony','']};
 $('dlList').innerHTML=r.items.length?r.items.map(x=>{const s=S[x.status]||[x.status,''];return `<div class="dli"><div class="h"><span class="st ${s[1]}">${s[0]}</span><b>${esc(x.title||'(scenariusz w drodze)')}</b><small>${new Date(x.at*1000).toLocaleString('pl',{weekday:'short',day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}${x.length?` · ${Math.floor(x.length/60)}:${String(x.length%60).padStart(2,'0')} min`:''}${x.images?` · ${x.images} kadrów`:''}</small></div>
  <small>${esc(x.step||'')}</small>${x.status==='review'?`<video src="/api/dlugi/${x.id}/final.mp4" controls preload="none" poster="/api/dlugi/${x.id}/thumb.png"></video><div class="h"><button class="btn pri" data-dp="${x.id}">Publikuj na YouTube</button><button class="btn" data-dr="${x.id}">Odrzuć</button></div>`:''}${x.yt?`<a href="https://youtu.be/${x.yt}" target="_blank" rel="noopener">Zobacz na YouTube →</a>`:''}</div>`}).join(''):'<div class="empty">Pierwszy film powstanie w najbliższy wtorek albo piątek – albo kliknij „Zrób teraz” (ok. 10–20 min).</div>';
 $('dlList').querySelectorAll('[data-dp]').forEach(b=>b.onclick=async()=>{b.disabled=true;await fetch(`/api/dlugi/${b.dataset.dp}/publish`,{method:'POST'});setTimeout(dlLoad,1500)});
 $('dlList').querySelectorAll('[data-dr]').forEach(b=>b.onclick=async()=>{if(!confirm('Odrzucić ten film?'))return;await fetch(`/api/dlugi/${b.dataset.dr}/reject`,{method:'POST'});dlLoad()})}
$('dlRun').onclick=async()=>{$('dlRun').disabled=true;await fetch('/api/dlugi/run',{method:'POST'});setTimeout(dlLoad,1500)};
dlLoad();setInterval(dlLoad,30000);

// zakładki strony (zapamiętane)
(function(){let t='today';try{t=localStorage.getItem('pz-tab')||'today'}catch(e){}
 window.setTab=x=>{t=x;['today','lanes','hist','wf','long'].forEach(k=>document.body.classList.toggle('t-'+k,k===x));
  document.querySelectorAll('#ptabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===x));try{localStorage.setItem('pz-tab',x)}catch(e){}};
 document.querySelectorAll('#ptabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));setTab(t)})();
function summary(){const el=$('sum');if(!state||!state.ok){el.innerHTML='';return}
 const W=state.workflows,E=state.executions,day=Date.now()-864e5,e24=E.filter(e=>new Date(e.startedAt)>day),er=e24.filter(e=>['error','crashed'].includes(e.status)).length,n=nextStart();
 el.innerHTML=`<span><b>${W.filter(w=>w.active).length}/${W.length}</b> włączone</span><span><b>${e24.length}</b> uruchomień / 24h</span><span class="${er?'bad':'ok'}"><b>${er}</b> błędów</span>${n?`<span>następny <b>${n.d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})}</b> ${esc(nice(n.w))}</span>`:''}`}
let prevAct=new Set(),lt=null;
function watchDone(){const now=new Set(actives().map(a=>a.wid));
 prevAct.forEach(wid=>{if(!now.has(wid)){const e=state.executions.find(x=>x.workflowId===wid);
  if(e){toast(`${['error','crashed'].includes(e.status)?'❌':'✅'} ${nice(e.workflow)} – ${ST[e.status]||e.status}${e.stoppedAt?' · '+fmtDur(Math.round((new Date(e.stoppedAt)-new Date(e.startedAt))/1000)):''}`);
   setTimeout(()=>{document.querySelector(`.ex[data-e="${e.id}"]`)?.classList.add('flash')},50)}}});prevAct=now}
async function tick(){await load();if(state&&state.ok)watchDone();clearTimeout(lt);lt=setTimeout(tick,actives().length?5000:30000)}
tick();
</script>
