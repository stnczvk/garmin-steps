<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Powiadomienia</title>
<script>let t='dark';try{t=localStorage.getItem('motyw')||'dark'}catch(e){}if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/glass.css"><script src="/glass.js"></script>
<style>
:root{--ink:#F4F4F5;--soft:#B4B4BE;--faint:#7A7A86;--ok:#3DDC84;--bad:#FF5C6C;--acc:#9E8CFC;--line:rgba(255,255,255,.08)}
:root[data-theme=light]{--ink:#0B0B12;--soft:#4A4A57;--faint:#80808C;--ok:#16A34A;--bad:#DC2F45;--acc:#6E56CF;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#06070c}html[data-theme=light]{background:#eef0f8}
html,body{min-height:100%;color:var(--ink);font:14px/1.45 Geist,system-ui,sans-serif}
body{background:transparent}
.wrap{max-width:900px;margin:0 auto;padding:22px 20px 60px}
.glass{position:relative;border-radius:20px;padding:14px 16px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em}
.top p{color:var(--soft);margin-top:2px}
.top .r{margin-left:auto}
.btn{border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:var(--ink);font:600 13px Geist,system-ui;padding:8px 13px;border-radius:999px;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chips button{border:1px solid var(--line);background:transparent;color:var(--soft);font:500 13px Geist,system-ui;padding:6px 12px;border-radius:999px;cursor:pointer}
.chips button.on{background:rgba(255,255,255,.14);color:var(--ink);border-color:rgba(255,255,255,.2)}
.chips b{font-weight:600;color:var(--acc);margin-left:4px}
.day{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:600;margin:18px 4px 8px}
.n{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:start;margin-bottom:8px;cursor:pointer}
.n .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.07)}
.n h3{font-size:14.5px;font-weight:600;line-height:1.3}
.n p{color:var(--soft);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.n time{font:11.5px 'JetBrains Mono',monospace;color:var(--faint);white-space:nowrap}
.n.unread h3:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:7px;vertical-align:1px;box-shadow:0 0 8px var(--acc)}
.n .more{grid-column:2/4;display:none}
.n.open .more{display:block}
.sig{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px}
.sig div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.sig small{display:block;color:var(--faint);font-size:11.5px}
.sig b{font:600 14px 'JetBrains Mono',monospace;overflow-wrap:anywhere}
.why{margin-top:10px;font-size:13px;color:var(--soft);line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.go{display:inline-block;margin-top:10px;font-size:13px;color:var(--acc);text-decoration:none}
.up{color:var(--ok)}.down{color:var(--bad)}
.empty{color:var(--faint);padding:30px 4px;text-align:center}
.n{position:relative}.n .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:var(--faint);font-size:18px;line-height:1;cursor:pointer;opacity:.55}.n:hover .x,.n.open .x{opacity:1}.n .x:hover{background:rgba(255,92,108,.2);color:#ff8a95}
.n time{margin-right:30px}.n.gone{opacity:0;transform:translateX(30px);transition:.2s}
.top .r{display:flex;gap:6px;flex-wrap:wrap}.btn.danger{border-color:rgba(255,92,108,.4);color:#ff8a95}
@media(max-width:600px){.n .x{opacity:1}.n time{margin-right:0}.top .r .btn{font-size:12px;padding:7px 10px}.wrap{padding:16px 14px 50px}.n{grid-template-columns:34px minmax(0,1fr)}.n time{grid-column:2;order:3}}
</style>
</head>
<body class="lg">
<div class="lg-bg" aria-hidden="true"></div>
<div class="wrap">
 <div class="top"><div><h1>Powiadomienia</h1><p id="sub">Wszystko, co centrum wysłało na telefon – także gdy push nie doszedł.</p></div>
  <div class="r"><button class="btn" id="all">✓ Przeczytane</button><button class="btn" id="delr">🗑 Usuń przeczytane</button><button class="btn danger" id="dela">Usuń wszystkie</button></div></div>
 <div class="chips" id="chips"></div>
 <div id="list"><div class="empty">Ładuję…</div></div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K={'':['Wszystkie','🔔'],skaner:['Skaner','📡'],pozaskala:['PozaSkala','🎬'],agencja:['Agencja','🤖'],straznicy:['Strażnicy','🛡️'],social:['Social','📱'],montaz:['Montaż','✂️'],inne:['Inne','💬']};
const VIEW={skaner:'skaner',pozaskala:'pozaskala',agencja:'agencja',straznicy:'straznicy',social:'stats',montaz:'montazownia'};
let D=null,F='',OPEN=null;
try{F=localStorage.getItem('notif-f')||''}catch(e){}
const fmt=(v,d=4)=>v==null||v===''?'–':typeof v==='number'?(+v).toLocaleString('pl',{maximumFractionDigits:d}):esc(v);
async function load(){try{D=await (await fetch('/api/notifs?limit=300')).json()}catch(e){D={items:[],unread:0}}render();badge()}
function badge(){try{parent.postMessage({notifs:D.unread},location.origin)}catch(e){}}
function render(){
 const counts={};D.items.forEach(n=>{if(!n.read)counts[n.kind]=(counts[n.kind]||0)+1});
 $('chips').innerHTML=Object.entries(K).filter(([k])=>!k||D.items.some(n=>n.kind===k)).map(([k,[l,i]])=>`<button data-k="${k}" class="${k===F?'on':''}">${i} ${l}${(k?counts[k]:D.unread)?`<b>${k?counts[k]:D.unread}</b>`:''}</button>`).join('');
 $('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{F=b.dataset.k;try{localStorage.setItem('notif-f',F)}catch(e){}render()});
 const L=D.items.filter(n=>!F||n.kind===F);
 if(!L.length){$('list').innerHTML='<div class="empty">Brak powiadomień.</div>';return}
 let last='',h='';
 L.forEach(n=>{const d=new Date(n.t*1000),day=d.toLocaleDateString('pl',{weekday:'long',day:'numeric',month:'long'});
  if(day!==last){h+=`<div class="day">${day===new Date().toLocaleDateString('pl',{weekday:'long',day:'numeric',month:'long'})?'Dziś':esc(day)}</div>`;last=day}
  h+=`<div class="n glass ${n.read?'':'unread'} ${OPEN===n.id?'open':''}" data-id="${n.id}"><span class="ic">${(K[n.kind]||K.inne)[1]}</span>
   <div><h3>${esc(n.title)}</h3><p>${esc(n.body)}</p></div><time>${d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})}</time>
   <button class="x" data-del="${n.id}" title="Usuń" aria-label="Usuń powiadomienie">×</button>
   <div class="more" id="m${n.id}"></div></div>`});
 $('list').innerHTML=h;
 $('list').querySelectorAll('.n').forEach(el=>el.onclick=e=>{if(e.target.closest('a'))return;const x=e.target.closest('[data-del]');if(x){del(+x.dataset.del,el);return}toggle(+el.dataset.id)});
 if(OPEN)fill(OPEN);
}
async function toggle(id,force){
 OPEN=OPEN===id&&!force?null:id;
 const n=D.items.find(x=>x.id===id);
 if(n&&!n.read){n.read=true;D.unread=Math.max(0,D.unread-1);fetch('/api/notifs/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})}).catch(()=>{});badge()}
 render();if(OPEN){const el=document.querySelector(`.n[data-id="${id}"]`);el&&el.scrollIntoView({block:'nearest',behavior:'smooth'})}
}
async function fill(id){
 const n=D.items.find(x=>x.id===id),m=$('m'+id);if(!n||!m)return;
 const link=VIEW[n.kind]?`<a class="go" href="#" onclick="parent.postMessage({go:'${VIEW[n.kind]}'},location.origin);return false">Przejdź do zakładki →</a>`:'';
 if(n.data?.signal){m.innerHTML='<p class="why">Ładuję sygnał…</p>';
  let r;try{r=await (await fetch('/api/scanner/signal/'+n.data.signal)).json()}catch(e){r={ok:false,error:'brak połączenia'}}
  if(!r.ok){m.innerHTML=`<p class="why">Nie da się wczytać sygnału: ${esc(r.error||'')}</p>${link}`;return}
  const s=r.signal,pick=['symbol','direction','entry_min','entry_max','entry','stop_loss','tp1','tp2','tp3','elite_score','score','position_size_percent','leverage','timeframe','result','pnl','created_at','closed_at'];
  const lab={symbol:'Para',direction:'Kierunek',entry_min:'Strefa od',entry_max:'Strefa do',entry:'Entry (środek)',stop_loss:'Stop loss',tp1:'TP1',tp2:'TP2',tp3:'TP3',elite_score:'Elite score',score:'Score',position_size_percent:'Wielkość pozycji %',leverage:'Dźwignia',timeframe:'Interwał',result:'Wynik',pnl:'PnL %',created_at:'Utworzony',closed_at:'Zamknięty'};
  const cells=pick.filter(k=>s[k]!=null&&s[k]!=='').map(k=>`<div><small>${lab[k]}</small><b class="${k==='pnl'?(s.pnl>=0?'up':'down'):k==='direction'?(s.direction==='LONG'?'up':'down'):''}">${fmt(s[k],k==='pnl'?2:6)}</b></div>`).join('');
  const txt=Object.entries(s).filter(([k,v])=>typeof v==='string'&&v.length>40&&!pick.includes(k)).map(([k,v])=>`<b>${esc(k)}</b>\n${esc(v.slice(0,1500))}`).join('\n\n');
  m.innerHTML=`<div class="sig">${cells}</div>${txt?`<div class="why">${txt}</div>`:''}${link}`;return}
 m.innerHTML=link;
}
addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.open){F='';const id=+e.data.open;const go=()=>toggle(id,true);D?go():load().then(go)}});
async function del(id,el){el.classList.add('gone');await post('/api/notifs/delete',{id});setTimeout(load,220)}
async function post(u,b){try{return await (await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json()}catch(e){return{}}}
const scope=()=>F?` z kategorii „${K[F][0]}”`:'';
$('delr').onclick=async()=>{const n=D.items.filter(x=>x.read&&(!F||x.kind===F)).length;if(!n)return;if(!confirm(`Usunąć ${n} przeczytanych powiadomień${scope()}?`))return;await post('/api/notifs/delete',{read:true,kind:F});load()};
$('dela').onclick=async()=>{const n=D.items.filter(x=>!F||x.kind===F).length;if(!n)return;if(!confirm(`Usunąć wszystkie (${n}) powiadomienia${scope()}? Tego nie da się cofnąć.`))return;await post('/api/notifs/delete',{all:true,kind:F});OPEN=null;load()};
$('all').onclick=async()=>{await fetch('/api/notifs/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({all:true})});load()};
load();setInterval(load,30000);
</script>
</body>
</html>
