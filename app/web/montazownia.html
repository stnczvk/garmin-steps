<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Montażownia</title>
<script>let t='dark';try{t=localStorage.getItem('motyw')||'dark'}catch(e){}if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/glass.css"><script src="/glass.js"></script>
<style>
:root{--ink:#F4F4F5;--soft:#B4B4BE;--faint:#7A7A86;--ok:#3DDC84;--warn:#F5B25A;--bad:#FF5C6C;--acc:#9E8CFC;--line:rgba(255,255,255,.08)}
:root[data-theme=light]{--ink:#0B0B12;--soft:#4A4A57;--faint:#80808C;--ok:#16A34A;--warn:#B26A00;--bad:#DC2F45;--acc:#6E56CF;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#06070c}html[data-theme=light]{background:#eef0f8}
html,body{min-height:100%;color:var(--ink);font:14px/1.45 Geist,system-ui,sans-serif}
body{background:transparent}
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px}
.glass{position:relative;border-radius:20px;padding:16px 18px}
.top{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em}
.top p{color:var(--soft);margin-top:2px}
.top .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:var(--ink);font:600 13px Geist,system-ui;padding:9px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.btn.pri{background:linear-gradient(145deg,#8f7bff,#5b8cff);border-color:transparent;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.list .j{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 6px;border-top:1px solid var(--line);cursor:pointer;border-radius:10px}
.list .j:first-of-type{border-top:0}.list .j:hover{background:rgba(255,255,255,.04)}.list .j.on{background:rgba(158,140,252,.14)}
.list .j b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.list .j small{color:var(--faint);font-size:12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--faint)}.dot.done{background:var(--ok)}.dot.error{background:var(--bad)}.dot.working,.dot.uploading{background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.tag{font:600 11px 'JetBrains Mono',monospace;padding:2px 7px;border-radius:99px}.tag.ok{background:rgba(61,220,132,.16);color:var(--ok)}.tag.bad{background:rgba(255,92,108,.16);color:var(--bad)}
h2{font-size:15px;font-weight:650;margin-bottom:10px}
video{width:100%;max-height:62vh;border-radius:14px;background:#000;display:block}
.vid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.g{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:13.5px;line-height:1.5}
.g.ok{background:rgba(61,220,132,.10);border:1px solid rgba(61,220,132,.3)}.g.bad{background:rgba(255,92,108,.08);border:1px solid rgba(255,92,108,.3)}.g.wait{background:rgba(158,140,252,.08);border:1px solid rgba(158,140,252,.25)}
.g ul{margin:6px 0 0 18px}
textarea{width:100%;min-height:76px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.2);color:var(--ink);font:13.5px Geist,system-ui;padding:10px;resize:vertical}
details{margin-top:12px}summary{cursor:pointer;color:var(--soft);font-size:13px}
pre{white-space:pre-wrap;font:12px/1.5 'JetBrains Mono',monospace;color:var(--soft);margin-top:8px;max-height:280px;overflow:auto}
.mut{color:var(--faint);font-size:13px}
.vlog{margin-top:14px}
.stage3d{padding:0!important;overflow:hidden;margin-bottom:14px;position:relative}
#c3{display:block;width:100%;height:min(46vh,420px);min-height:280px;cursor:grab;touch-action:none}
.h3d{position:absolute;top:10px;right:14px;font:11px 'JetBrains Mono',monospace;color:var(--faint)}
.nf{display:grid;grid-template-columns:160px repeat(3,minmax(0,1fr));gap:10px}
.nf2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:10px}
.nf label,.nf2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--faint)}
.nf input{border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink);border-radius:10px;padding:9px 10px;font:14px Geist,system-ui}
.drop{border:1.5px dashed rgba(255,255,255,.18);border-radius:14px;padding:14px;cursor:pointer;min-width:0}
.drop b{color:var(--ink);font-size:14px}.drop span{overflow-wrap:anywhere}.drop.has{border-color:var(--acc);background:rgba(158,140,252,.08)}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#8f7bff,#5b8cff);width:0}
@media(max-width:900px){.nf,.nf2{grid-template-columns:minmax(0,1fr)}}
.vt{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:14px}
.vt button{border:0;background:transparent;color:var(--soft);font:600 12.5px Geist,system-ui;padding:6px 12px;border-radius:8px;cursor:pointer}
.vt button.on{background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
body.m-office .dash-only{display:none!important}body.m-dash .office-only{display:none!important}
body.m-office #c3{height:calc(100vh - 230px);max-height:none;min-height:340px}
.wsst{position:absolute;left:14px;bottom:12px;font:600 12.5px Geist,system-ui;padding:7px 12px;border-radius:999px;background:rgba(10,10,16,.72);color:#eee;border:1px solid rgba(255,255,255,.12)}
.hk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.hko{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.hko video{width:100%;aspect-ratio:9/16;max-height:300px;object-fit:cover;border-radius:10px;background:#000}.hko p{font-size:13px;flex:1}
.msg{position:fixed;left:50%;bottom:calc(20px + var(--sab,0px));transform:translateX(-50%);background:#16171f;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;z-index:9;display:none;max-width:90vw}
@media(max-width:900px){.grid,.vid{grid-template-columns:minmax(0,1fr)}.wrap{padding:16px 14px 50px}}
</style>
</head>
<body class="lg">
<div class="lg-bg" aria-hidden="true"></div>
<div class="wrap">
 <div class="top"><div><h1>Montażownia</h1><p>Filmy montowane automatycznie. Strażnik montażu sprawdza każdy film, zanim go wrzucisz.</p></div>
  <div class="r"><button class="btn pri" id="food">🍽 Zmontuj jedzenie</button><button class="btn pri" id="vlogb">🎥 Zmontuj vloga</button></div></div>
 <div class="vt" id="vt"><button data-m="office">🏢 Biuro</button><button data-m="dash">▦ Dashboard</button></div>
 <div class="stage3d glass office-only"><canvas id="c3" aria-label="Warsztat twórcy – biuro Montażowni"></canvas><span class="h3d">przeciągnij · obróć</span><span class="wsst" id="wsst"></span></div>
 <section class="glass dash-only" id="newp" hidden style="margin-bottom:14px">
  <h2>Nowy montaż: daily jedzenie</h2>
  <div class="nf">
   <label>Data nagrania<input type="date" id="nd"></label>
   <label>Tytuł – linia 1<input id="t1"></label><label>Linia 2 (opis dnia)<input id="t2" placeholder="np. Cheat day"></label><label>Linia 3<input id="t3"></label>
  </div>
  <div class="nf2">
   <label class="drop" id="dropc"><input type="file" id="fc" accept="video/*,.mov,.mp4,.m4v" multiple hidden><b>🎞 Wybierz klipy</b><span id="fcl">każdy posiłek = osobny klip, kolejność ustali się po godzinie nagrania</span></label>
   <label class="drop has"><input type="checkbox" id="kd" checked style="accent-color:#8f7bff;width:18px;height:18px"><b>🖼 Karty posiłków z Dziennika</b><span>Jak dotąd: karty z posiłków wpisanych w dzienniku i tytuł z Twoim celem kcal. Po wysłaniu klipów otworzy się na chwilę Dziennik, zrobi karty i sam uruchomi montaż.</span></label>
  </div>
  <div class="row"><button class="btn pri" id="go" disabled>✂️ Zmontuj</button><button class="btn" id="cancel">Anuluj</button><span class="mut" id="up"></span></div>
 </section>
 <section class="glass dash-only" id="vnew" hidden style="margin-bottom:14px">
  <h2>Nowy montaż: vlog WNBF</h2>
  <div id="vform">
   <div class="nf" style="grid-template-columns:120px 160px minmax(0,1fr)"><label>Odcinek nr<input id="vep" type="number" min="1"></label><label>Data nagrania<input id="vd" type="date"></label>
    <label>Klipy<span id="vsrc" class="mut" style="font-size:13px;padding-top:9px"></span></label></div>
   <div class="nf2"><label class="drop" id="vdrop"><input type="file" id="vf" accept="video/*,image/*,.mov,.mp4,.m4v,.png,.jpg,.jpeg" multiple hidden><b>📤 Wyślij klipy z telefonu (opcjonalnie)</b><span id="vfl">albo wrzuć je na Macu do _SUROWE/vlog – tak jak dotąd</span></label>
    <label class="drop"><span style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="vvo" style="accent-color:#8f7bff;width:18px;height:18px"><b>Dogrywam dziś głos do klipów bez mowy</b></span><span>Tak – klipy bez mowy w normalnej prędkości, do 8 s, każdy na cały ekran. Nie – jak zwykle (przyspieszone, w parach).</span></label></div>
   <div class="row"><button class="btn pri" id="vgo">🎥 Zmontuj odcinek</button><button class="btn" id="vcancel">Anuluj</button><span class="mut" id="vup"></span></div>
  </div>
 </section>
 <div class="grid dash-only">
  <section class="glass list"><h2>Montaże</h2><div id="jl"><p class="mut">Ładuję…</p></div></section>
  <section class="glass" id="det"><p class="mut">Wybierz film z listy.</p></section>
 </div>
 <section class="glass vlog dash-only" id="vsec"><h2>🎥 Vlog WNBF <span class="mut" id="vmac" style="font-weight:500;font-size:13px"></span></h2>
  <div id="vjobs"><p class="mut">Ładuję…</p></div>
 </section>
</div>
<div class="msg" id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/biuro3d_montaz.js" defer></script>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={done:'gotowy',error:'błąd',working:'montuje się',uploading:'wysyłanie klipów'};
let D=null,SEL=null,J=null;
try{SEL=localStorage.getItem('mont-sel')}catch(e){}
const toast=t=>{const m=$('msg');m.textContent=t;m.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>m.style.display='none',5000)};
const ttl=j=>(j.title||[]).join(' · ')||j.id;
const when=j=>{const m=j.id.match(/^(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})/);return m?`${m[3]}.${m[2]} ${m[4]}:${m[5]}`:''};
async function load(){
 try{D=await (await fetch('/api/mont/jobs')).json()}catch(e){D={ok:false,error:'Brak połączenia z centrum.',jobs:[]}}
 if(!D.ok&&!D.jobs.length){$('jl').innerHTML=`<p class="mut">${esc(D.error)}</p>`;return}
 if(!SEL&&D.jobs[0])SEL=D.jobs[0].id;
 {const w=D.jobs.find(j=>j.state==='working');window.WS_STATUS=w?('Montuję: '+ttl(w)):D.jobs[0]?('Ostatni: '+ttl(D.jobs[0])):'Montażownia';$('wsst').textContent=(w?'⏳ ':'🎬 ')+window.WS_STATUS}
 $('jl').innerHTML=D.jobs.map(j=>`<div class="j ${j.id===SEL?'on':''}" data-id="${j.id}"><span class="dot ${j.state||''}"></span>
  <div><b>${esc(ttl(j))}</b><small>${when(j)} · ${ST[j.state]||j.state||'?'}${j.step&&j.state==='working'?' · '+esc(j.step):''}</small></div>
  ${j.check?`<span class="tag ${j.check.ok?'ok':'bad'}">${j.check.ok?'OK':'uwagi'}</span>`:''}</div>`).join('')||'<p class="mut">Brak montaży.</p>';
 $('jl').querySelectorAll('.j').forEach(el=>el.onclick=()=>{SEL=el.dataset.id;try{localStorage.setItem('mont-sel',SEL)}catch(e){}load()});
 if(SEL)detail(SEL);
}
async function detail(id,force){
 let j;try{j=await (await fetch('/api/mont/'+id)).json()}catch(e){return}
 if(j.error){$('det').innerHTML=`<p class="mut">${esc(j.error)}</p>`;return}
 const same=J&&J.id===j.id&&J.state===j.state&&JSON.stringify(J.check)===JSON.stringify(j.check);J=j;if(same&&!force)return;
 const c=j.check,act=D.can_act;
 let g='';
 if(j.state==='done'){
  if(!c)g=`<div class="g wait">🛡️ Strażnik montażu sprawdza film…</div>`;
  else g=`<div class="g ${c.ok?'ok':'bad'}"><b>🛡️ Strażnik montażu: ${c.ok?'film OK':'są uwagi'}</b> · ${c.duration} s
   ${(c.problems.length||c.warnings.length)?`<ul>${c.problems.map(p=>`<li><b>${esc(p)}</b></li>`).join('')}${c.warnings.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}
   ${c.review?`<p style="margin-top:6px">${esc(c.review)}</p>`:''}
   <textarea id="fx" placeholder="Co poprawić? (np. wytnij drugie podejście w klipie 2)">${esc(c.fix||'')}</textarea>
   <div class="row"><button class="btn pri" id="fixb" ${act?'':'disabled title="Dopisz DZIENNIK_PASS do .env"'}>✂️ Popraw montaż</button><button class="btn" id="chk">🔁 Sprawdź jeszcze raz</button></div>
   ${act?'':'<p class="mut" style="margin-top:6px">Żeby centrum mogło poprawiać i ponawiać montaż, dopisz do /root/social/.env linię <code>DZIENNIK_PASS=…</code> (hasło do dziennika) i zrób social-update.</p>'}</div>`}
 $('det').innerHTML=`<h2>${esc(ttl(j))}</h2>
  ${j.state==='done'?`<div class="vid"><video src="/api/mont/${j.id}/film" controls playsinline preload="metadata"></video><div>
   <div class="row" style="margin-top:0"><a class="btn pri" href="/api/mont/${j.id}/film?dl=1">⬇ Pobierz film</a><button class="btn" id="redo">↻ Zmontuj ponownie</button><a class="btn" href="/api/mont/${j.id}/capcut" title="Klipy w kolejności montażu + karty, muzyka, plan cięć – do ręcznej poprawki w CapCut">📦 Paczka do CapCut</a></div>${g}</div></div>`
  :j.state==='error'?`<div class="g bad"><b>Montaż nie wyszedł</b><p>${esc(j.error)}</p></div><div class="row"><button class="btn" id="redo">↻ Spróbuj ponownie</button><a class="btn" href="/api/mont/${j.id}/capcut">📦 Paczka do CapCut</a></div>`
  :`<div class="g wait">⏳ ${esc(j.step||ST[j.state]||'czekam…')}</div>`}
  ${j.raport?`<details><summary>Raport cięć</summary><pre>${esc(j.raport)}</pre></details>`:''}
  ${j.transkrypcja?`<details><summary>Transkrypcja klipów</summary><pre>${esc(j.transkrypcja)}</pre></details>`:''}`;
 const post=async(a,body)=>{const r=await (await fetch(`/api/mont/${j.id}/${a}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})})).json();return r};
 $('redo')&&($('redo').onclick=async()=>{const r=await post('redo');toast(r.ok?'Montaż ruszył od nowa.':'Nie wyszło: '+r.error);J=null;load()});
 $('fixb')&&($('fixb').onclick=async()=>{const t=$('fx').value.trim();if(!t)return toast('Wpisz, co poprawić.');const r=await post('fix',{comment:t});toast(r.ok?'Poprawka wysłana – film montuje się ponownie.':'Nie wyszło: '+r.error);J=null;load()});
 $('chk')&&($('chk').onclick=async e=>{e.target.disabled=true;e.target.textContent='Sprawdzam…';await post('check');J=null;load()});
}
// ---- nowy montaż: wybór plików → wysyłka → montaż na serwerze ----
let FC=[],FK=[];
async function sug(){try{const r=await (await fetch('/api/mont-suggest?d='+($('nd').value||''))).json();DZU=r.dziennik;$('nd').value=r.date;$('nd').dataset.n=r.n;if(!DIRTY){$('t1').value=r.title[0];$('t2').value=r.title[1];$('t3').value=r.title[2]}}catch(e){}}
$('food').onclick=()=>{setMode('dash');$('vnew').hidden=true;$('newp').hidden=!$('newp').hidden;scrollTo({top:0,behavior:'smooth'});if(!$('newp').hidden&&!$('t1').value)sug()};
$('cancel').onclick=()=>{$('newp').hidden=true};
$('nd').onchange=sug;
const mb=n=>(n/1048576).toFixed(n>1e8?0:1)+' MB';
$('fc').onchange=e=>{FC=[...e.target.files];$('fcl').textContent=FC.length?`${FC.length} klip(y) · ${mb(FC.reduce((s,f)=>s+f.size,0))}`:'';$('dropc').classList.toggle('has',!!FC.length);$('go').disabled=!FC.length};
let DZU='',DIRTY=false;['t1','t2','t3'].forEach(id=>$(id).addEventListener('input',()=>DIRTY=true));
function put(url,file,onp){return new Promise((ok,bad)=>{const x=new XMLHttpRequest();x.open('PUT',url);x.upload.onprogress=e=>onp(e.loaded/e.total);x.onload=()=>x.status<300?ok(JSON.parse(x.responseText)):bad(new Error((JSON.parse(x.responseText||'{}').error)||('HTTP '+x.status)));x.onerror=()=>bad(new Error('przerwane połączenie'));x.send(file)})}
$('go').onclick=async()=>{const title=[$('t1').value,$('t2').value,$('t3').value].map(x=>x.trim()).filter(Boolean);if(!title.length)return toast('Wpisz tytuł.');
 const kd=$('kd').checked;let win=null;if(kd){try{win=window.open('','_blank')}catch(e){}}
 window.BUSY=true;$('go').disabled=true;const all=FC.map(f=>['clip',f]),tot=all.reduce((s,[,f])=>s+f.size,0);let done=0;
 $('up').innerHTML='Zakładam montaż…<div class="bar"><i id="pb"></i></div>';
 try{const r=await (await fetch('/api/mont-new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,n:+($('nd').dataset.n||0),date:$('nd').value,autotitle:kd&&!DIRTY})})).json();if(!r.id)throw new Error(r.error||'nie wyszło');
  for(let i=0;i<all.length;i++){const [k,f]=all[i];$('up').firstChild.textContent=`Wysyłam ${k==='clip'?'klip':'kartę'} ${i+1}/${all.length}: ${f.name}`;
   await put(`/api/mont/${r.id}/file?kind=${k}&i=${i+1}&name=${encodeURIComponent(f.name)}`,f,p=>{$('pb').style.width=((done+p*f.size)/tot*100)+'%'});done+=f.size}
  if(kd){const url=`${DZU}/#karty-${r.id}-${$('nd').value}`;if(win){win.location=url}else{$('up').innerHTML=`Klipy wysłane. <a class="btn pri" href="${url}" target="_blank" rel="noopener">Dodaj karty z Dziennika i zmontuj</a>`;SEL=r.id;load();return}
   toast('Klipy wysłane – Dziennik robi karty i uruchamia montaż (2–4 min).')}
  else{const s=await (await fetch(`/api/mont/${r.id}/start`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();if(!s.ok)throw new Error(s.error);
  toast('Montaż ruszył – zwykle 2–4 minuty. Dam znać powiadomieniem.')}$('newp').hidden=true;FC=[];DIRTY=false;$('fc').value='';$('fcl').textContent='';$('dropc').classList.remove('has');$('t2').value='';$('up').textContent='';SEL=r.id;J=null;load()}
 catch(e){$('up').textContent='Nie wyszło: '+e.message;if(win)try{win.close()}catch(x){}}
 window.BUSY=false;$('go').disabled=!FC.length};
// ---- vlog: zlecenie dla Maca (montaż w CapCut robi niezmieniony automat WNBF) ----
let V=null,VF=[];
const ago=t=>{const s=Date.now()/1000-t;return s<90?'przed chwilą':s<3600?Math.round(s/60)+' min temu':Math.round(s/3600)+' h temu'};
async function vload(){try{V=await (await fetch('/api/mont-vlog/state')).json()}catch(e){return}
 $('vmac').innerHTML=!V.configured?'· brak MONT_TOKEN w .env':V.online?'· <span style="color:var(--ok)">● Mac online</span>':'· <span style="color:var(--warn)">● Mac offline</span>'+(V.seen?' ('+ago(V.seen)+')':'');
 $('vsrc').textContent=V.loose?`na Macu w _SUROWE/vlog czeka ${V.loose} plików`:'na Macu w _SUROWE/vlog nie ma nowych plików';
 if(!$('vep').value)$('vep').value=V.next_ep||'';if(!$('vd').value)$('vd').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
 const ST2={queued:'czeka na Maca',uploading:'wysyłanie klipów',claimed:'Mac otwiera montaż',working:'montuje się',ask:'czeka na Twój wybór',done:'gotowy w CapCut',error:'błąd'};
 const vh=(V.jobs.length?V.jobs:[]).map(j=>`<div class="g ${j.state==='done'?'ok':j.state==='error'?'bad':'wait'}"><b>Odcinek #${j.ep}</b> · ${esc(j.date)} · ${ST2[j.state]||j.state}${j.step&&j.state!=='done'?' – '+esc(j.step):''}
  ${j.state==='ask'&&j.ask?`<div style="margin-top:8px">Które zdanie dać na początek jako zapowiedź?</div><div class="hk">${j.ask.map((t,i)=>`<div class="hko">${(j.previews||[]).includes(i)?`<video src="/api/mont-vlog/${j.id}/preview/${i}" controls playsinline preload="metadata"></video>`:''}<p>${i+1}. ${esc(t)}</p><button class="btn pri" data-ans="${i}" data-j="${j.id}">Wybieram</button></div>`).join('')}</div><div class="row"><button class="btn" data-ans="none" data-j="${j.id}">— bez zapowiedzi —</button></div>`:''}
  ${j.state==='done'?`<pre>${esc((j.lines||[]).filter(l=>/GOTOWE|grafika|wycięte|nie dopasowano|plansza|zapowiedź/.test(l)).join('\n'))}</pre><p class="mut">Otwórz CapCut na Macu – projekt „WNBF AUTO #${j.ep}” czeka. Przejrzyj napisy i liczby na planszy, popraw i wyeksportuj.</p>`:''}
  ${['working','ask','claimed','error'].includes(j.state)&&(j.lines||[]).length?`<details ${j.state==='error'?'open':''}><summary>Postęp (${j.lines.length} linii)</summary><pre>${esc(j.lines.slice(-30).join('\n'))}</pre></details>`:''}
  ${['queued','uploading'].includes(j.state)?`<div class="row"><button class="btn" data-vc="${j.id}">Anuluj</button></div>`:''}</div>`).join('')||'<p class="mut">Jeszcze nie zlecałeś montażu vloga z centrum.</p>';
 if(vh===vload.h)return;vload.h=vh;$('vjobs').innerHTML=vh;
 if(V.jobs.some(j=>j.state==='ask')&&!vload.sc){vload.sc=1;window.setMode&&setMode('dash');setTimeout(()=>$('vsec').scrollIntoView({behavior:'smooth',block:'start'}),300)}
 document.querySelectorAll('[data-ans]').forEach(b=>b.onclick=async()=>{await fetch(`/api/mont-vlog/${b.dataset.j}/answer`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({choice:b.dataset.ans==='none'?null:+b.dataset.ans})});toast('Wybór wysłany do Maca.');vload()});
 document.querySelectorAll('[data-vc]').forEach(b=>b.onclick=async()=>{await fetch(`/api/mont-vlog/${b.dataset.vc}/cancel`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});vload()})}
$('vlogb').onclick=()=>{setMode('dash');$('newp').hidden=true;$('vnew').hidden=!$('vnew').hidden;scrollTo({top:0,behavior:'smooth'})};
$('vcancel').onclick=()=>{$('vnew').hidden=true};
$('vf').onchange=e=>{VF=[...e.target.files];$('vfl').textContent=VF.length?`${VF.length} plików · ${mb(VF.reduce((s,f)=>s+f.size,0))}`:'albo wrzuć je na Macu do _SUROWE/vlog – tak jak dotąd';$('vdrop').classList.toggle('has',!!VF.length)};
$('vgo').onclick=async()=>{const ep=+$('vep').value,date=$('vd').value;if(!ep||!date)return toast('Podaj numer odcinka i datę.');
 if(!VF.length&&!V?.loose&&!confirm('Na Macu w _SUROWE/vlog nie widzę nowych klipów. Montować mimo to (np. klipy są już w „odc '+ep+'”)?'))return;
 window.BUSY=true;$('vgo').disabled=true;try{const r=await (await fetch('/api/mont-vlog/new',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ep,date,voiceover:$('vvo').checked,upload:VF.length>0})})).json();if(!r.ok)throw new Error(r.error);
  if(VF.length){const tot=VF.reduce((s,f)=>s+f.size,0);let done=0;$('vup').innerHTML='Wysyłam…<div class="bar"><i id="vpb"></i></div>';
   for(let i=0;i<VF.length;i++){const f=VF[i];$('vup').firstChild.textContent=`Wysyłam ${i+1}/${VF.length}: ${f.name}`;await put(`/api/mont-vlog/${r.id}/file?name=${encodeURIComponent(f.name)}`,f,p=>{$('vpb').style.width=((done+p*f.size)/tot*100)+'%'});done+=f.size}
   await fetch(`/api/mont-vlog/${r.id}/go`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}
  toast(V?.online?'Zlecone – Mac zaczyna montaż.':'Zlecone – Mac zacznie, gdy będzie włączony.');$('vnew').hidden=true;VF=[];$('vf').value='';$('vup').textContent='';$('vep').value='';vload()}
 catch(e){$('vup').textContent='Nie wyszło: '+e.message}$('vgo').disabled=false;window.BUSY=false};

// ---- zakładki Biuro / Dashboard (jak w Agencji) ----
(function(){let m='office';try{m=localStorage.getItem('view-'+location.pathname)||'office'}catch(e){}
 window.setMode=x=>{m=x;document.body.classList.toggle('m-office',x==='office');document.body.classList.toggle('m-dash',x==='dash');
  document.querySelectorAll('#vt button').forEach(b=>b.classList.toggle('on',b.dataset.m===x));try{localStorage.setItem('view-'+location.pathname,x)}catch(e){}
  setTimeout(()=>dispatchEvent(new Event('resize')),30)};
 document.querySelectorAll('#vt button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(m)})();
vload();setInterval(vload,8000);
load();setInterval(load,15000);
</script>
</body>
</html>
