<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centrum dowodzenia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap">
<style>
:root{
  --paper:#EDEFF3; --card:#FFFFFF; --ink:#141821; --soft:#5B6474; --faint:#8C94A3; --rule:#DCE0E7;
  --cobalt:#2346D6; --cobalt-soft:#E6EBFC; --up:#13804B; --down:#C62E22; --warn:#A35A00;
  --yt:#E5322D; --ig:#C13584; --tt:#0FA596;
  --r-lg:20px; --r-md:12px; --r-sm:8px;
  --shadow:0 1px 0 rgba(20,24,33,.04), 0 8px 24px -12px rgba(20,24,33,.18);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.5 "Archivo",system-ui,sans-serif;font-stretch:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:28px 16px 80px}

/* nagłówek */
.top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.top h1{flex:1;min-width:240px;margin:0;font-weight:800;font-stretch:125%;font-size:clamp(30px,5vw,46px);line-height:1;letter-spacing:-.02em}
.top .when{color:var(--faint);font-size:13px}
button,.btn{font:600 14px "Archivo",sans-serif;border:1px solid var(--rule);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
button:hover{border-color:#C3C9D4}
button.main{background:var(--ink);color:#fff;border-color:var(--ink)}
button.main:hover{background:#2A3040}
button:disabled{opacity:.55;cursor:default}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:none}
.busy .spin{display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* przełącznik grup */
.tabs{display:inline-flex;gap:4px;padding:4px;background:#E1E5EC;border-radius:999px;margin-bottom:18px}
.tabs button{border:0;background:transparent;color:var(--soft);padding:7px 16px}
.tabs button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(20,24,33,.12)}

/* podsumowanie */
.total{display:grid;grid-template-columns:1.3fr 1fr 1fr;background:var(--ink);color:#fff;border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px}
.total > div{padding:22px 24px}
.total > div + div{border-left:1px solid rgba(255,255,255,.12)}
.total .k{font-size:13px;color:#AAB2C2}
.total .v{font-weight:800;font-stretch:125%;font-size:clamp(30px,4.6vw,48px);line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:6px}
.total .d{font-size:13px;margin-top:4px;color:#AAB2C2}
.total .d b{color:#7EE2A8;font-weight:600}
.total .d b.neg{color:#FF9C92}

/* konta */
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:34px}
.acc{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px 16px;position:relative;overflow:hidden;min-width:0}
.acc:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:var(--pc)}
.acc[data-p=youtube]{--pc:var(--yt)} .acc[data-p=instagram]{--pc:var(--ig)} .acc[data-p=tiktok]{--pc:var(--tt)}
.acc-h{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--pc);display:grid;place-items:center;flex:none}
.logo svg{width:17px;height:17px;fill:#fff}
.acc-n{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip{font-size:12px;color:var(--soft);background:var(--paper);border-radius:999px;padding:2px 9px;white-space:nowrap}
.big{font-weight:800;font-stretch:125%;font-size:40px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--soft);margin-top:4px}
.sub b{font-weight:600}
.up{color:var(--up)} .down{color:var(--down)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule)}
.mini .v{font-weight:700;font-stretch:112%;font-size:21px;font-variant-numeric:tabular-nums}
.mini .l{font-size:12px;color:var(--faint)}
.spark{display:block;width:100%;height:46px;margin-top:12px}
.warn{margin-top:12px;font-size:13px;color:var(--warn);background:#FFF4E5;border-radius:var(--r-sm);padding:8px 10px}
.empty{background:var(--card);border-radius:var(--r-lg);padding:28px;color:var(--soft);box-shadow:var(--shadow)}

/* posty */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h2{margin:0;font-weight:800;font-stretch:112%;font-size:24px;letter-spacing:-.01em}
.posts{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.plist{display:grid;transition:grid-template-rows .35s ease}
.plist > div{overflow:hidden}
.post{display:grid;grid-template-columns:28px 60px 1fr auto;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--rule);text-decoration:none}
.post:first-child{border-top:0}
.post:hover{background:#F6F7FA}
.rank{font-weight:800;font-stretch:125%;font-size:18px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.thumb{width:60px;height:60px;border-radius:var(--r-md);object-fit:cover;background:var(--paper)}
.pt{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.pm{font-size:12px;color:var(--soft);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--pc)}
.pv{text-align:right}
.pv .v{font-weight:800;font-stretch:112%;font-size:20px;font-variant-numeric:tabular-nums}
.pv .l{font-size:12px;color:var(--faint)}
.more{display:flex;justify-content:center;padding:12px;border-top:1px solid var(--rule)}
.more button{border:0;background:transparent;color:var(--cobalt)}
.more button:hover{background:var(--cobalt-soft)}

/* ustawienia */
details.set{margin-top:34px;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow)}
details.set summary{cursor:pointer;list-style:none;padding:18px 22px;font-weight:700;display:flex;align-items:center;gap:10px}
details.set summary::-webkit-details-marker{display:none}
details.set summary .chev{transition:transform .2s;color:var(--faint)}
details.set[open] summary .chev{transform:rotate(90deg)}
.set-body{padding:0 22px 22px}
.set-body h3{font-size:15px;margin:18px 0 8px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--rule);flex-wrap:wrap}
.line .acc-n{min-width:140px}
.line .logo{width:24px;height:24px;border-radius:7px}
.line .logo svg{width:13px;height:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:13px;color:var(--soft);margin-bottom:5px}
input,select{width:100%;font:15px "Archivo",sans-serif;background:#fff;color:var(--ink);border:1px solid var(--rule);border-radius:var(--r-sm);padding:9px 11px}
select{width:auto;padding-right:28px}
input:focus,select:focus{outline:2px solid var(--cobalt);outline-offset:0;border-color:transparent}
.hint{font-size:13px;color:var(--soft);background:var(--paper);border-radius:var(--r-md);padding:12px 14px;margin-top:14px;line-height:1.6}
code{font-size:12px;background:#fff;border:1px solid var(--rule);border-radius:6px;padding:1px 6px;word-break:break-all}
.note{border-radius:var(--r-md);padding:12px 16px;margin-bottom:16px;font-size:14px}
.note.bad{background:#FDECEA;color:#8E1F16} .note.good{background:#E7F6EE;color:#0E5E37}
.login{max-width:380px;margin:12vh auto 0;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:28px}
.login h1{margin:0 0 18px;font-weight:800;font-stretch:125%;font-size:30px;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:720px){
  .total{grid-template-columns:1fr 1fr}
  .total > div:first-child{grid-column:1/-1}
  .total > div + div{border-left:0;border-top:1px solid rgba(255,255,255,.12)}
  .total > div:nth-child(3){border-left:1px solid rgba(255,255,255,.12)}
  .grid2{grid-template-columns:1fr}
  .post{grid-template-columns:48px 1fr auto;padding:12px 14px}
  .rank{display:none}
  .thumb{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="wrap" id="app" hidden>
  <div class="top">
    <h1>Centrum dowodzenia</h1>
    <span class="when" id="when"></span>
    <button class="main" id="refresh"><span class="spin"></span><span>Odśwież</span></button>
  </div>
  <div id="msg"></div>
  <div class="tabs" role="group" aria-label="Grupa kont" id="tabs">
    <button data-g="" aria-pressed="true">Wszystko</button>
    <button data-g="pozaskala" aria-pressed="false">PozaSkala</button>
    <button data-g="prywatne" aria-pressed="false">Prywatne</button>
  </div>
  <section class="total" id="total" aria-label="Podsumowanie"></section>
  <section class="accs" id="accs" aria-label="Konta"></section>

  <div class="sec-h">
    <h2>Najlepsze posty</h2>
    <div class="tabs" role="group" aria-label="Okres" id="range" style="margin:0">
      <button data-r="28" aria-pressed="true">28 dni</button>
      <button data-r="0" aria-pressed="false">Wszystkie</button>
    </div>
  </div>
  <section class="posts" id="posts"></section>

  <details class="set" id="settings">
    <summary><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>Konta i ustawienia</summary>
    <div class="set-body">
      <h3>Połączone konta</h3>
      <div id="list"></div>
      <div class="line" style="border-top:1px solid var(--rule)">
        <label class="sr" for="grp">Grupa nowego konta</label>
        <select id="grp"><option value="pozaskala">PozaSkala</option><option value="prywatne">Prywatne</option></select>
        <button id="add-yt">Dodaj kanał YouTube</button>
        <button id="add-ig">Dodaj konto Instagram</button>
      </div>
      <h3>Klucze</h3>
      <div class="grid2">
        <div><label for="GOOGLE_CLIENT_ID">Google Client ID</label><input id="GOOGLE_CLIENT_ID" autocomplete="off"></div>
        <div><label for="GOOGLE_CLIENT_SECRET">Google Client Secret</label><input id="GOOGLE_CLIENT_SECRET" autocomplete="off"></div>
        <div><label for="IG_APP_ID">Instagram App ID</label><input id="IG_APP_ID" autocomplete="off"></div>
        <div><label for="IG_APP_SECRET">Instagram App Secret</label><input id="IG_APP_SECRET" autocomplete="off"></div>
        <div><label for="APIFY_TOKEN">Token Apify</label><input id="APIFY_TOKEN" autocomplete="off"></div>
        <div><label for="TIKTOK_PROFILES">Profile TikTok, po przecinku</label><input id="TIKTOK_PROFILES" autocomplete="off" placeholder="np. st4nczuk_"></div>
      </div>
      <div class="line" style="border:0;padding-bottom:0"><button class="main" id="save">Zapisz klucze</button><span id="saved" class="when"></span></div>
      <div class="hint">Adresy przekierowania do wklejenia w Google Cloud i w aplikacji Meta:<br>
        Google: <code id="r-g"></code><br>Instagram: <code id="r-i"></code></div>
    </div>
  </details>
</main>

<script>
const $ = s => document.querySelector(s);
const NAMES = {youtube: 'YouTube', instagram: 'Instagram', tiktok: 'TikTok'};
const ICON = {
  youtube: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24"><path d="M7 3h10a4 4 0 014 4v10a4 4 0 01-4 4H7a4 4 0 01-4-4V7a4 4 0 014-4zm5 5a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4zm5-3.2a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24"><path d="M15 3c.4 2.3 1.9 3.9 4.5 4.1v3.1c-1.6 0-3.1-.5-4.4-1.4v6.4A5.7 5.7 0 119.4 9.5v3.2a2.6 2.6 0 102.5 2.6V3H15z"/></svg>'
};
let data = null, group = '', range = 28, showAll = false, first = true;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = n => n == null ? '–' : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' mln' : Math.round(n).toLocaleString('pl-PL');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (r.status === 401) { showLogin(); throw new Error('auth'); }
  return r.json();
}

function showLogin() {
  if ($('.login')) return;
  $('#app').hidden = true;
  document.body.insertAdjacentHTML('beforeend', `<form class="login"><h1>Centrum dowodzenia</h1>
    <label for="pw">Hasło</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="line" style="border:0;padding-bottom:0"><button class="main" type="submit">Zaloguj się</button><span id="lerr" class="when" style="color:var(--down)"></span></div></form>`);
  $('.login').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: $('#pw').value})});
    if (r.ok) location.reload(); else $('#lerr').textContent = (await r.json()).error || 'Nie udało się zalogować.';
  };
  $('#pw').focus();
}

// liczby nabijają się raz, przy pierwszym wczytaniu strony
function countUp(root) {
  root.querySelectorAll('[data-n]').forEach(el => {
    const target = +el.dataset.n;
    if (!first || reduce || !isFinite(target)) { el.textContent = fmt(target); return; }
    const t0 = performance.now(), dur = 900;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      el.textContent = fmt(target * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function weekDelta(a) {
  const h = a.history || [];
  if (h.length < 2) return null;
  const last = h[h.length - 1];
  const ref = h.find(x => (new Date(last.date) - new Date(x.date)) / 864e5 <= 7) || h[0];
  return last.followers - ref.followers;
}

function spark(daily) {
  if (!daily || daily.length < 2) return '';
  const v = daily.map(d => d.views), mx = Math.max(...v, 1), w = 300, h = 46;
  const pts = v.map((y, i) => [i / (v.length - 1) * w, h - 4 - y / mx * (h - 8)]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polygon points="0,${h} ${line} ${w},${h}" fill="var(--pc)" opacity=".1"/>
    <polyline points="${line}" fill="none" stroke="var(--pc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}

function render() {
  const accs = Object.entries(data?.accounts || {}).filter(([, a]) => !group || a.group === group);
  // podsumowanie
  const fol = accs.reduce((s, [, a]) => s + (a.followers || 0), 0);
  const deltas = accs.map(([, a]) => weekDelta(a)).filter(d => d != null);
  const dsum = deltas.reduce((s, d) => s + d, 0);
  const views = accs.reduce((s, [, a]) => s + (a.views_28d || 0), 0);
  const posts28 = accs.flatMap(([, a]) => a.posts || []).filter(p => p.date >= new Date(Date.now() - 28 * 864e5).toISOString().slice(0, 10)).length;
  $('#total').innerHTML = `
    <div><div class="k">Obserwujący i subskrybenci łącznie</div><div class="v" data-n="${fol}"></div>
      <div class="d">${deltas.length ? `<b class="${dsum < 0 ? 'neg' : ''}">${dsum > 0 ? '+' : ''}${fmt(dsum)}</b> w ostatnim tygodniu` : 'przyrost pokaże się po kilku dniach zbierania danych'}</div></div>
    <div><div class="k">Wyświetlenia, 28 dni</div><div class="v" data-n="${views}"></div><div class="d">${accs.length} ${accs.length === 1 ? 'konto' : accs.length < 5 ? 'konta' : 'kont'}</div></div>
    <div><div class="k">Nowe posty, 28 dni</div><div class="v" data-n="${posts28}"></div><div class="d">na wszystkich platformach</div></div>`;

  $('#accs').innerHTML = accs.length ? accs.map(([, a]) => {
    const d = weekDelta(a);
    const second = a.platform === 'youtube'
      ? `<div><div class="v" data-n="${a.minutes_28d != null ? Math.round(a.minutes_28d / 60) : ''}"></div><div class="l">godzin oglądania, 28 dni</div></div>`
      : `<div><div class="v" data-n="${a.media_count ?? ''}"></div><div class="l">postów łącznie</div></div>`;
    return `<article class="acc" data-p="${a.platform}">
      <div class="acc-h"><span class="logo" title="${NAMES[a.platform]}">${ICON[a.platform]}</span><span class="acc-n">${esc(a.name)}</span><span class="chip">${esc(data.groups?.[a.group] || '')}</span></div>
      <div class="big" data-n="${a.followers ?? 0}"></div>
      <div class="sub">${a.followers_label || 'obserwujący'}${d ? ` · <b class="${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${fmt(d)} w tydzień</b>` : ''}</div>
      <div class="mini"><div><div class="v" data-n="${a.views_28d ?? ''}"></div><div class="l">wyświetleń, 28 dni</div></div>${second}</div>
      ${spark(a.daily)}
      ${a.error ? `<div class="warn">${esc(a.error)}</div>` : ''}
    </article>`;
  }).join('') : `<div class="empty">Nie masz jeszcze podpiętych kont${group ? ' w tej grupie' : ''}. Dodasz je w „Konta i ustawienia” na dole strony.</div>`;

  const cut = new Date(Date.now() - range * 864e5).toISOString().slice(0, 10);
  const all = accs.flatMap(([, a]) => (a.posts || []).map(p => ({...p, platform: a.platform, acc: a.name})))
    .filter(p => !range || p.date >= cut).sort((x, y) => (y.views || 0) - (x.views || 0)).slice(0, 30);
  const row = (p, i) => `<a class="post" href="${esc(p.url)}" target="_blank" rel="noopener" data-p="${p.platform}" style="--pc:var(--${p.platform === 'youtube' ? 'yt' : p.platform === 'instagram' ? 'ig' : 'tt'})">
      <span class="rank">${i + 1}</span>
      ${p.thumb ? `<img class="thumb" src="${esc(p.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.removeAttribute('src')">` : '<span class="thumb"></span>'}
      <span style="min-width:0"><span class="pt">${esc(p.title) || 'Bez opisu'}</span>
        <span class="pm"><span><i class="dot"></i>${esc(p.acc)}</span><span>${esc(p.date)}</span><span>${fmt(p.likes)} polubień</span><span>${fmt(p.comments)} komentarzy</span></span></span>
      <span class="pv"><span class="v" style="display:block">${fmt(p.views)}</span><span class="l">wyświetleń</span></span></a>`;
  const TOP = 5;
  $('#posts').innerHTML = all.length ? `
    <div>${all.slice(0, TOP).map(row).join('')}</div>
    ${all.length > TOP ? `<div class="plist" id="plist" style="grid-template-rows:${showAll ? '1fr' : '0fr'}"><div>${all.slice(TOP).map((p, i) => row(p, i + TOP)).join('')}</div></div>
      <div class="more"><button id="tog" aria-expanded="${showAll}">${showAll ? 'Zwiń listę' : `Pokaż wszystkie (${all.length})`}</button></div>` : ''}`
    : '<div class="empty" style="box-shadow:none">W tym okresie nie ma jeszcze postów. Przełącz na „Wszystkie”, żeby zobaczyć starsze.</div>';
  const tog = $('#tog');
  if (tog) tog.onclick = () => {
    showAll = !showAll;
    $('#plist').style.gridTemplateRows = showAll ? '1fr' : '0fr';
    tog.textContent = showAll ? 'Zwiń listę' : `Pokaż wszystkie (${all.length})`;
    tog.setAttribute('aria-expanded', showAll);
    if (!showAll) $('#posts').scrollIntoView({behavior: reduce ? 'auto' : 'smooth', block: 'start'});
  };

  countUp(document);
  first = false;
  const u = data?.updated ? new Date(data.updated * 1000) : null;
  $('#when').textContent = data?.refreshing ? 'Pobieram nowe dane…' : u ? 'Dane z ' + u.toLocaleString('pl-PL', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'}) : '';
  $('#refresh').disabled = !!data?.refreshing;
  $('#refresh').classList.toggle('busy', !!data?.refreshing);
}

async function load() {
  data = await api('/api/social/summary');
  $('#app').hidden = false;
  render();
  if (data.refreshing) setTimeout(load, 4000);
}

async function loadSettings() {
  const c = await api('/api/social/config');
  for (const k of Object.keys(c.set)) $('#' + k).value = c[k] || '';
  const r = await api('/api/social/redirects');
  $('#r-g').textContent = r.google; $('#r-i').textContent = r.instagram;
  const accs = await api('/api/social/accounts');
  $('#list').innerHTML = accs.length ? accs.map(a => `
    <div class="line" style="--pc:var(--${a.platform === 'youtube' ? 'yt' : a.platform === 'instagram' ? 'ig' : 'tt'})">
      <span class="logo">${ICON[a.platform]}</span><span class="acc-n">${esc(a.name)}</span>
      <label class="sr" for="g-${esc(a.key)}">Grupa</label>
      <select id="g-${esc(a.key)}" data-k="${esc(a.key)}" class="g"><option value="pozaskala" ${a.group === 'pozaskala' ? 'selected' : ''}>PozaSkala</option><option value="prywatne" ${a.group === 'prywatne' ? 'selected' : ''}>Prywatne</option></select>
      ${a.platform !== 'tiktok' ? `<button data-k="${esc(a.key)}" class="rm">Odłącz</button>` : ''}</div>`).join('')
    : '<div class="when" style="padding:6px 0 10px">Nic jeszcze nie połączono.</div>';
  document.querySelectorAll('select.g').forEach(s => s.onchange = async () => {
    await api('/api/social/accounts/' + encodeURIComponent(s.dataset.k), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({group: s.value})});
    await load();
  });
  document.querySelectorAll('button.rm').forEach(b => b.onclick = async () => {
    if (!confirm('Odłączyć to konto? Jego statystyki znikną z centrum.')) return;
    await api('/api/social/accounts/' + encodeURIComponent(b.dataset.k), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({remove: true})});
    loadSettings(); load();
  });
}

function pressed(box, btn) { box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === btn)); }
$('#refresh').onclick = async () => { await api('/api/social/refresh', {method: 'POST'}); setTimeout(load, 600); };
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (!b) return; group = b.dataset.g; showAll = false; pressed($('#tabs'), b); render(); };
$('#range').onclick = e => { const b = e.target.closest('button'); if (!b) return; range = +b.dataset.r; showAll = false; pressed($('#range'), b); render(); };
$('#save').onclick = async () => {
  const body = {};
  for (const k of ['GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'IG_APP_ID', 'IG_APP_SECRET', 'APIFY_TOKEN', 'TIKTOK_PROFILES']) body[k] = $('#' + k).value;
  await api('/api/social/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  $('#saved').textContent = 'Klucze zapisane'; setTimeout(() => $('#saved').textContent = '', 2500); loadSettings();
};
$('#add-yt').onclick = () => location.href = '/api/social/google/connect?group=' + $('#grp').value;
$('#add-ig').onclick = () => location.href = '/api/social/instagram/connect?group=' + $('#grp').value;

const qs = new URLSearchParams(location.search);
if (qs.get('blad')) $('#msg').innerHTML = `<div class="note bad">${esc(qs.get('blad'))}</div>`;
if (qs.get('ok')) $('#msg').innerHTML = `<div class="note good">Konto ${esc(NAMES[qs.get('ok')] || '')} połączone. Statystyki pobierają się w tle.</div>`;
if (qs.get('blad') || qs.get('ok')) { history.replaceState(null, '', '/'); $('#settings').open = true; }
load().then(loadSettings).catch(() => {});
</script>
</body>
</html>
