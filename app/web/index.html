<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centrum dowodzenia</title>
<meta name="description" content="Statystyki YouTube, Instagrama i TikToka w jednym miejscu.">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Centrum">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090A" media="(prefers-color-scheme: dark)">
<script>
  // motyw ustawiony zanim strona się narysuje (bez mignięcia)
  let t = 'dark'; try { t = localStorage.getItem('motyw') || 'dark'; } catch (e) {} if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FAFAFA; --surface:#FFFFFF; --raised:#F4F4F5; --line:#E6E6E9; --line-soft:#EFEFF1; --line-hi:#D4D4D8;
  --ink:#09090B; --soft:#52525B; --faint:#8B8B94; --grid:#EFEFF1;
  --accent:#6E56CF; --accent-2:#3E63DD; --accent-soft:rgba(110,86,207,.10);
  --up:#15803D; --up-bg:rgba(21,128,61,.09); --down:#C2352A; --down-bg:rgba(194,53,42,.08); --warn:#8A5300; --warn-bg:#FFF6E5;
  --yt:#E0352B; --ig:#8A4BD6; --tt:#0E9488;
  --shadow:0 1px 2px rgba(0,0,0,.04);
  --card-bg:#FFFFFF; --card-hi:inset 0 1px 0 rgba(255,255,255,.9);
  --head:rgba(250,250,250,.75);
  --aurora:radial-gradient(60% 50% at 50% -10%, rgba(110,86,207,.12), transparent 70%);
  --gridline:rgba(9,9,11,.045);
  --glow:none;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#08090A; --surface:#0E0F11; --raised:#16171A; --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.055); --line-hi:rgba(255,255,255,.18);
  --ink:#F4F4F5; --soft:#A1A1AA; --faint:#6B6B75; --grid:rgba(255,255,255,.06);
  --accent:#9E8CFC; --accent-2:#6E8BFF; --accent-soft:rgba(158,140,252,.12);
  --up:#4ADE80; --up-bg:rgba(74,222,128,.10); --down:#FF7B70; --down-bg:rgba(255,123,112,.10); --warn:#F5B25A; --warn-bg:rgba(245,178,90,.08);
  --yt:#E8504A; --ig:#9B66E8; --tt:#14A898;
  --shadow:0 0 0 1px rgba(0,0,0,.4), 0 20px 40px -24px rgba(0,0,0,.9);
  --card-bg:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
  --card-hi:inset 0 1px 0 rgba(255,255,255,.06);
  --head:rgba(8,9,10,.7);
  --aurora:radial-gradient(55% 45% at 50% -8%, rgba(120,98,255,.22), rgba(62,99,221,.08) 45%, transparent 75%);
  --gridline:rgba(255,255,255,.035);
  --glow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
    color-scheme:dark;
    --bg:#08090A; --surface:#0E0F11; --raised:#16171A; --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.055); --line-hi:rgba(255,255,255,.18);
    --ink:#F4F4F5; --soft:#A1A1AA; --faint:#6B6B75; --grid:rgba(255,255,255,.06);
    --accent:#9E8CFC; --accent-2:#6E8BFF; --accent-soft:rgba(158,140,252,.12);
    --up:#4ADE80; --up-bg:rgba(74,222,128,.10); --down:#FF7B70; --down-bg:rgba(255,123,112,.10); --warn:#F5B25A; --warn-bg:rgba(245,178,90,.08);
    --yt:#E8504A; --ig:#9B66E8; --tt:#14A898;
    --shadow:0 0 0 1px rgba(0,0,0,.4), 0 20px 40px -24px rgba(0,0,0,.9);
    --card-bg:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
    --card-hi:inset 0 1px 0 rgba(255,255,255,.06);
    --head:rgba(8,9,10,.7);
    --aurora:radial-gradient(55% 45% at 50% -8%, rgba(120,98,255,.22), rgba(62,99,221,.08) 45%, transparent 75%);
    --gridline:rgba(255,255,255,.035);
    --glow:none;
  }
}
:root{--ease:cubic-bezier(.2,0,0,1);--quick:140ms;--std:280ms;--slow:560ms;--r:14px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font:400 14.5px/1.5 "Geist",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background var(--std) var(--ease),color var(--std) var(--ease)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:var(--aurora)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(var(--gridline) 1px,transparent 1px),linear-gradient(90deg,var(--gridline) 1px,transparent 1px);background-size:56px 56px;
  -webkit-mask-image:radial-gradient(70% 55% at 50% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(70% 55% at 50% 0%,#000 30%,transparent 75%)}
.head,.wrap,.login{position:relative;z-index:1}
.head{position:sticky}
a{color:inherit}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---------- pasek górny ---------- */
.head{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line-soft)}
.head{padding-top:env(safe-area-inset-top)}
.head-in{max-width:1200px;margin:0 auto;padding:12px max(20px,env(safe-area-inset-right)) 12px max(20px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.brand img{width:30px;height:30px;border-radius:8px}
.brand b{font-weight:650;font-size:15.5px;letter-spacing:-.01em}
.brand span{color:var(--faint);font-size:13px;margin-left:4px}
.wrap{max-width:1200px;margin:0 auto;padding:26px max(20px,env(safe-area-inset-right)) calc(100px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}

button{font:500 13.5px "Geist",sans-serif;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:10px;padding:8px 13px;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;transition:background var(--quick) var(--ease),border-color var(--quick) var(--ease),transform var(--quick) var(--ease)}
button:hover{background:var(--raised)}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:default;transform:none}
button.main{background:var(--ink);color:var(--bg);border-color:transparent;box-shadow:0 0 0 1px var(--line),0 6px 20px -8px color-mix(in oklab,var(--accent) 60%,transparent)}
button.main:hover{opacity:.9;background:var(--ink)}
button svg{width:15px;height:15px;flex:none}
.spin{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:11px;position:relative}
.seg button{border:0;background:transparent;color:var(--soft);padding:6px 12px;border-radius:8px;position:relative;z-index:1}
.seg button:hover{color:var(--ink);background:transparent}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;left:0;border-radius:8px;background:var(--raised);box-shadow:0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--line-soft);
  transition:transform var(--std) var(--ease),width var(--std) var(--ease)}
.seg.icons button{padding:6px 8px}
.when{color:var(--faint);font-size:12.5px}

/* ---------- tytuł strony ---------- */
.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0 22px}
.grad{margin:0;font-weight:650;font-size:clamp(34px,5vw,52px);letter-spacing:-.045em;line-height:1;
  background:linear-gradient(180deg,var(--ink) 20%,color-mix(in oklab,var(--ink) 45%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- karty ---------- */
.card{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--card-hi),var(--shadow);position:relative;transition:background var(--std) var(--ease),border-color var(--std) var(--ease)}
.card:hover{border-color:var(--line-hi)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 20px 0}
.card-h h2{margin:0;font-size:14px;font-weight:550;letter-spacing:-.005em;color:var(--ink)}
.card-h small{color:var(--faint);font-size:12.5px}

/* ---------- wskaźniki ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:18px 20px 16px;overflow:hidden}
.kpi:first-child{background-image:var(--glow)}
.kpi .k{font-size:13px;color:var(--faint)}
.kpi .v{font-weight:600;font-size:clamp(26px,3.2vw,34px);letter-spacing:-.04em;line-height:1.1;margin:10px 0 12px;background:linear-gradient(180deg,var(--ink) 30%,color-mix(in oklab,var(--ink) 55%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px}
.chip.up{color:var(--up);background:var(--up-bg)} .chip.down{color:var(--down);background:var(--down-bg)} .chip.flat{color:var(--faint);background:var(--raised)}
.kpi .sub{font-size:12.5px;color:var(--faint)}
.kspark{position:absolute;right:16px;bottom:16px;width:42%;height:38px;pointer-events:none}
.kspark svg{display:block;width:100%;height:100%;overflow:visible}

/* ---------- wykres + platformy ---------- */
.mid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;margin-bottom:14px}
.chart{padding-bottom:12px}
.chart-box{position:relative;padding:8px 14px 0 6px;touch-action:pan-y}
.chart svg{display:block;width:100%;height:260px;overflow:visible}
.chart .gl{stroke:var(--grid);stroke-width:1;stroke-dasharray:2 4}
.chart .ax{fill:var(--faint);font:12px "Geist",sans-serif}
.chart .area{fill:url(#ga)}
.chart .ln{fill:none;stroke:url(#gl);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;filter:drop-shadow(0 4px 12px color-mix(in oklab,var(--accent) 45%,transparent))}
.chart .xh{stroke:var(--soft);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity var(--quick)}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2;opacity:0;transition:opacity var(--quick)}
.chart.hov .xh,.chart.hov .pt{opacity:1}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);
  font-size:12.5px;white-space:nowrap;opacity:0;transform:translateY(4px);transition:opacity var(--quick) var(--ease),transform var(--quick) var(--ease)}
.chart.hov .tip{opacity:1;transform:none}
.tip b{display:block;font-size:16px;font-weight:650}
.tip span{color:var(--faint)}
.chart .ln{stroke-dasharray:1;stroke-dashoffset:1}
.drawn .chart .ln{stroke-dashoffset:0;transition:stroke-dashoffset 1100ms var(--ease) 150ms}
.chart .area{opacity:0}
.drawn .chart .area{opacity:1;transition:opacity 700ms var(--ease) 500ms}
.chart-empty{height:260px;display:grid;place-items:center;color:var(--faint);text-align:center;padding:0 30px}

.plat{padding-bottom:6px}
.plat-list{padding:14px 20px 12px;display:grid;gap:16px}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-top b{font-weight:600;flex:1}
.pl-top .num{font-weight:600}
.pl-top small{color:var(--faint);font-size:12.5px;width:40px;text-align:right}
.track{height:8px;border-radius:99px;background:var(--raised);margin-top:8px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--pc);transform-origin:left;transform:scaleX(0)}
.drawn .track i{transform:scaleX(1);transition:transform 800ms var(--ease) var(--d,0ms)}
.dotp{width:10px;height:10px;border-radius:3px;background:var(--pc);flex:none}

/* ---------- konta ---------- */
.board{margin-bottom:34px;overflow:hidden}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:500;color:var(--faint);text-align:right;padding:16px 20px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap}
.tbl th:first-child{text-align:left}
.tbl td{padding:14px 20px;border-top:1px solid var(--line-soft);text-align:right;vertical-align:middle}
.tbl tr:first-child td{border-top:0}
.tbl tbody tr{transition:background var(--quick) var(--ease)}
.tbl tbody tr:hover{background:var(--raised)}
.tbl td:first-child{text-align:left}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;border-radius:10px;background:var(--pc);display:grid;place-items:center;flex:none}
.logo svg{width:18px;height:18px;fill:#fff}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.who small{display:block;color:var(--faint);font-size:12.5px}
.tbl .v{font-weight:600;font-size:15.5px}
.trend{width:140px}
.trend svg{display:block;width:140px;height:34px;margin-left:auto}
.bars{display:flex;align-items:flex-end;justify-content:flex-end;gap:3px;height:34px}
.bars i{width:8px;background:var(--pc);border-radius:2px 2px 1px 1px;min-height:3px;opacity:.85;transform-origin:bottom;transform:scaleY(0)}
.drawn .bars i{transform:none;transition:transform 600ms var(--ease) var(--d,0ms)}
.sline{stroke-dasharray:1;stroke-dashoffset:1}
.drawn .sline{stroke-dashoffset:0;transition:stroke-dashoffset 900ms var(--ease) var(--d,0ms)}
.err td{padding-top:0;text-align:left}
.err span{display:block;font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 11px}
.faint{color:var(--faint)}
.empty{padding:38px 22px;color:var(--soft);text-align:center}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}

/* ---------- posty ---------- */
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{margin:0;font-size:20px;font-weight:650;letter-spacing:-.02em}
.posts{overflow:hidden}
.plist{display:grid;transition:grid-template-rows var(--slow) var(--ease)}
.plist > div{overflow:hidden;min-height:0}
.post{display:grid;grid-template-columns:28px 68px minmax(0,1fr) auto auto 16px;gap:16px;align-items:center;padding:12px 18px 12px 14px;border-top:1px solid var(--line-soft);
  text-decoration:none;position:relative;transition:background var(--quick) var(--ease)}
.post:first-child{border-top:0}
.post:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:2px;background:var(--pc);opacity:0;transform:scaleY(.4);transition:opacity var(--std) var(--ease),transform var(--std) var(--ease)}
.post:hover{background:linear-gradient(90deg,color-mix(in oklab,var(--pc) 7%,transparent),transparent 60%)}
.post:hover:before{opacity:1;transform:none}
.rank{font-weight:600;color:var(--faint);text-align:right;font-size:13px;letter-spacing:.02em}
.post:nth-child(-n+3) .rank{color:var(--ink)}
.thumbw{position:relative;width:68px;height:68px}
.thumb{width:68px;height:68px;border-radius:12px;object-fit:cover;background:var(--raised);display:grid;place-items:center;border:1px solid var(--line)}
.thumb svg{width:22px;height:22px;fill:var(--pc)}
.pbadge{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:7px;background:var(--pc);display:grid;place-items:center;border:2px solid var(--bg)}
.pbadge svg{width:11px;height:11px;fill:#fff}
.pt{font-weight:550;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35;letter-spacing:-.005em}
.pm{font-size:12.5px;color:var(--faint);margin-top:4px;display:flex;gap:4px 10px;flex-wrap:wrap;align-items:center}
.pm .sep{width:3px;height:3px;border-radius:50%;background:var(--faint);opacity:.6}
.dot{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:6px;background:var(--pc)}
.pstats{display:flex;gap:14px;color:var(--soft);font-size:13px}
.pstats span{display:inline-flex;align-items:center;gap:5px}
.pstats svg{width:14px;height:14px;opacity:.7}
.peng{font-size:12px;font-weight:600;color:var(--soft);background:var(--raised);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.pv{text-align:right;min-width:92px}
.pv b{display:block;font-size:17px;font-weight:600;letter-spacing:-.02em}
.pv small{color:var(--faint);font-size:12px}
.mbar{display:block;height:3px;border-radius:3px;background:var(--raised);margin-top:6px;overflow:hidden}
.go{color:var(--faint);opacity:0;transform:translateX(-4px);transition:opacity var(--std) var(--ease),transform var(--std) var(--ease)}
.post:hover .go{opacity:1;transform:none;color:var(--ink)}
.mbar i{display:block;height:100%;background:var(--pc);border-radius:3px}
.more{display:flex;justify-content:center;padding:8px;border-top:1px solid var(--line-soft)}
.more button{border:0;background:transparent;color:var(--accent)}
.more button:hover{background:var(--accent-soft)}
.more svg{transition:transform var(--std) var(--ease)}
.more [aria-expanded=true] svg{transform:rotate(180deg)}

/* ---------- ustawienia ---------- */
details.set{margin-top:34px}
details.set summary{cursor:pointer;list-style:none;padding:18px 20px;font-weight:600;display:flex;align-items:center;gap:10px}
details.set summary::-webkit-details-marker{display:none}
details.set summary .chev{transition:transform var(--std) var(--ease);color:var(--faint)}
details.set[open] summary .chev{transform:rotate(90deg)}
.set-body{padding:0 20px 22px}
.set-body h3{font-size:14px;font-weight:600;margin:18px 0 8px}
.line{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.line .logo{width:26px;height:26px;border-radius:8px}
.line .logo svg{width:14px;height:14px}
.line > b{flex:1;min-width:140px;font-weight:550}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:block;font-size:12.5px;color:var(--soft);margin-bottom:5px}
input,select{width:100%;font:14px "Geist",sans-serif;background:var(--raised);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
select{width:auto;padding-right:28px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.hint{font-size:12.5px;color:var(--soft);background:var(--raised);border-radius:12px;padding:12px 14px;margin-top:14px;line-height:1.75}
code{font:12px ui-monospace,Menlo,monospace;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;word-break:break-all}
.note{border-radius:12px;padding:11px 15px;margin-bottom:16px;font-size:13.5px}
.note.bad{background:var(--down-bg);color:var(--down)} .note.good{background:var(--up-bg);color:var(--up)}
.login{max-width:380px;margin:calc(16vh + env(safe-area-inset-top)) auto 0;padding:30px}
.login img{width:52px;height:52px;border-radius:14px}
.login h1{margin:16px 0 4px;font-weight:650;font-size:24px;letter-spacing:-.02em}
.login p{margin:0 0 18px;color:var(--soft)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- szkielet i ruch ---------- */
.sk{background:linear-gradient(90deg,var(--raised) 0%,var(--line-soft) 50%,var(--raised) 100%);background-size:200% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
.in{opacity:0;transform:translateY(12px)}
.shown .in{opacity:1;transform:none;transition:opacity 450ms var(--ease) var(--d,0ms),transform 550ms var(--ease) var(--d,0ms)}
.swap{animation:sw var(--std) var(--ease)}
@keyframes sw{from{opacity:.25;transform:translateY(5px)}to{opacity:1;transform:none}}
.loading{opacity:.55;transition:opacity var(--std)}

/* ---------- dodatkowy ruch ---------- */
/* karty unoszą się lekko pod kursorem, z „reflektorem” na krawędzi */
.card.lift{transition:transform var(--std) var(--ease),box-shadow var(--std) var(--ease),background var(--std) var(--ease)}
@media (hover:hover){
  .card.lift:hover{transform:translateY(-2px);box-shadow:var(--shadow),0 18px 40px -22px rgba(15,19,32,.35)}
}
.spot:after{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity var(--std) var(--ease);
  background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),var(--accent-soft),transparent 70%)}
.spot:hover:after{opacity:1}
.spot:before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;z-index:2;padding:1px;opacity:0;transition:opacity var(--std) var(--ease);
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,50%),color-mix(in oklab,var(--accent) 80%,transparent),transparent 65%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.spot:hover:before{opacity:1}
.spot > *{position:relative;z-index:1}
/* kropka „na żywo” przy dacie aktualizacji */
.live{display:inline-flex;align-items:center;gap:8px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--up);position:relative;flex:none}
.live i:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--up);opacity:0;animation:pulse 2.4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes pulse{0%{transform:scale(.4);opacity:.7}80%,100%{transform:scale(1.5);opacity:0}}
.live.busy i{background:var(--accent)} .live.busy i:after{border-color:var(--accent);animation-duration:1s}
/* cień paska po przewinięciu */
.head{transition:box-shadow var(--std) var(--ease),background var(--std) var(--ease)}
.head.scrolled{box-shadow:0 8px 24px -16px rgba(0,0,0,.35)}
/* wykres: punkt z pulsującą obwódką, płynny dymek */
.chart .ring{fill:none;stroke:var(--accent);stroke-width:2;opacity:0}
.chart.hov .ring{animation:ring 1.6s var(--ease) infinite}
@keyframes ring{0%{opacity:.5;r:5}100%{opacity:0;r:14}}
.tip{transition:opacity var(--quick) var(--ease),transform var(--quick) var(--ease),left 90ms linear}
.chart .xh,.chart .pt{transition:opacity var(--quick),transform 90ms linear}
/* wiersze tabeli i posty wchodzą kaskadą */
.tbl tbody tr.rw{opacity:0;transform:translateX(-8px)}
.drawn .tbl tbody tr.rw{opacity:1;transform:none;transition:opacity 400ms var(--ease) var(--d,0ms),transform 500ms var(--ease) var(--d,0ms),background var(--quick) var(--ease)}
.post.rw{opacity:0;transform:translateY(8px)}
.seen .post.rw{opacity:1;transform:none;transition:opacity 380ms var(--ease) var(--d,0ms),transform 480ms var(--ease) var(--d,0ms),background var(--quick) var(--ease)}
.post .thumb{transition:transform var(--std) var(--ease)}
.post:hover .thumb{transform:scale(1.04)}
.post:hover .mbar i{filter:brightness(1.15)}
.mbar i{transform-origin:left;transform:scaleX(0)}
.seen .mbar i{transform:none;transition:transform 700ms var(--ease) var(--d,0ms)}
.plist[style*="1fr"] .post.rw{opacity:1;transform:none}
/* sekcje niżej pojawiają się przy przewijaniu */
.reveal{opacity:0;transform:translateY(18px)}
.reveal.seen{opacity:1;transform:none;transition:opacity 500ms var(--ease),transform 600ms var(--ease)}
/* zmieniona liczba po odświeżeniu na chwilę się podświetla */
.flash{animation:flash 1.4s var(--ease)}
@keyframes flash{0%{background:var(--accent-soft);box-shadow:0 0 0 4px var(--accent-soft)}100%{background:transparent;box-shadow:0 0 0 4px transparent}}
.v.num,.tbl .v{border-radius:6px}
/* wciśnięcie przycisku w przełączniku */
.seg button:active{transform:scale(.94)}
/* przejście motywu: okrąg rozlewający się od przycisku */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-new(root){clip-path:circle(0 at var(--tx,90%) var(--ty,0%))}

/* ---------- okno szczegółów posta (na środku ekranu) ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(4,5,7,.6);backdrop-filter:blur(6px) saturate(1.2);-webkit-backdrop-filter:blur(6px) saturate(1.2);opacity:0;transition:opacity 320ms var(--ease)}
.panel{position:relative;width:min(920px,100%);max-height:min(92dvh,980px);overflow:auto;overscroll-behavior:contain;border-radius:20px;
  background:var(--bg);background-image:var(--card-bg);border:1px solid var(--line-hi);box-shadow:0 40px 100px -30px rgba(0,0,0,.75),var(--card-hi);
  opacity:0;transform:translateY(14px) scale(.965);transition:opacity 300ms var(--ease),transform 460ms cubic-bezier(.05,.7,.1,1);padding:22px 28px 28px}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{opacity:1;transform:none}
.sheet.closing .panel{opacity:0;transform:translateY(6px) scale(.98);transition:opacity 200ms var(--ease),transform 220ms cubic-bezier(.3,0,1,1)}
.sheet.closing .scrim{opacity:0;transition:opacity 220ms}
.p-top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.p-top .logo{width:26px;height:26px;border-radius:8px}
.p-top .logo svg{width:14px;height:14px}
.p-top b{flex:1;font-weight:550}
.p-top button{padding:7px 9px}
.p-head{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.p-media{width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--raised);border:1px solid var(--line);display:grid;place-items:center}
.p-media.tall{aspect-ratio:4/5}
.p-media img{width:100%;height:100%;object-fit:cover;display:block}
.p-media svg{width:34px;height:34px;fill:var(--pc);opacity:.8}
.p-title{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.3;margin:0 0 4px}
.p-date{color:var(--faint);font-size:13px}
.p-hero{display:flex;align-items:baseline;gap:10px;margin:22px 0 6px}
.p-hero b{font-size:52px;font-weight:600;letter-spacing:-.045em;line-height:1;background:linear-gradient(180deg,var(--ink) 30%,color-mix(in oklab,var(--ink) 55%,transparent));-webkit-background-clip:text;background-clip:text;color:transparent}
.p-hero span{color:var(--faint)}
.p-cmp{font-size:14px;color:var(--soft)}

.p-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}

.p-react{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px}
.p-chart{position:relative;border:1px solid var(--line);border-radius:16px;padding:16px 14px 8px;background:var(--card-bg)}
.p-chart svg{display:block;width:100%;height:260px;overflow:visible}
.p-chart .gl{stroke:var(--grid);stroke-dasharray:2 4}
.p-chart .ax{fill:var(--faint);font:11.5px "Geist",sans-serif}
.p-chart .xh{stroke:var(--soft);stroke-dasharray:3 3;opacity:0}
.p-chart .pt{fill:var(--bg);stroke:var(--pc);stroke-width:2;opacity:0}
.p-chart.hov .xh,.p-chart.hov .pt,.p-chart.hov .tip{opacity:1}
.p-chart.hov .tip{transform:none}
.p-chart .tip{top:8px}
.p-note{color:var(--faint);font-size:13px;padding:22px 6px;text-align:center}
.p-cta{display:flex;gap:8px;margin-top:20px}
.p-cta a{flex:1;justify-content:center;text-decoration:none;font:500 14px "Geist",sans-serif;border-radius:10px;padding:11px 14px;display:inline-flex;align-items:center;gap:8px;
  background:var(--ink);color:var(--bg)}
.p-in > *{opacity:0;transform:translateY(10px)}
.sheet.open .p-in > *{opacity:1;transform:none;transition:opacity 360ms var(--ease) calc(100ms + var(--i,0) * 45ms),transform 440ms var(--ease) calc(100ms + var(--i,0) * 45ms)}
@media (max-width:640px){
  .sheet{padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
  .panel{padding:14px 16px 18px;max-height:94dvh}

  .p-head{grid-template-columns:110px minmax(0,1fr);gap:14px}

  .p-hero b{font-size:34px}

}

@media (max-width:980px){ .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .mid{grid-template-columns:1fr} }
@media (max-width:760px){
  .tbl .hide-m,.pstats{display:none}

}
@media (max-width:560px){
  .head-in{padding:10px max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}

  .post{grid-template-columns:52px minmax(0,1fr) auto;padding:12px 14px;gap:14px}
  .thumbw{width:52px;height:52px}
  .go,.pm .ms{display:none}
  .rank{display:none}
  .thumb{width:52px;height:52px}
  .pstats{display:none}
  .pv{min-width:70px}
  .chart svg{height:220px}
}
@media (prefers-reduced-motion:reduce){
  *,*:before{transition:none!important;animation:none!important}
  .in{opacity:1;transform:none}
  .chart .ln,.sline{stroke-dashoffset:0} .chart .area{opacity:1}
  .track i,.bars i,.mbar i{transform:none}
  .tbl tbody tr.rw,.post.rw,.reveal,.p-in > *{opacity:1;transform:none}
  .panel{transform:none}
}
</style>
</head>
<body>
<header class="head" id="head">
  <div class="head-in">
    <div class="brand"><img src="/icon-192.png" alt=""><b>Centrum dowodzenia</b><span>PozaSkala i konta prywatne</span></div>
    <div class="seg" role="group" aria-label="Grupa kont" id="tabs">
      <span class="pill"></span>
      <button data-g="" aria-pressed="true">Wszystko</button>
      <button data-g="pozaskala" aria-pressed="false">PozaSkala</button>
      <button data-g="prywatne" aria-pressed="false">Prywatne</button>
    </div>
    <div class="seg icons" role="group" aria-label="Motyw" id="theme">
      <span class="pill"></span>
      <button data-t="auto" aria-pressed="true" title="Motyw jak w systemie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span class="sr">Jak w systemie</span></button>
      <button data-t="light" aria-pressed="false" title="Jasny motyw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><span class="sr">Jasny</span></button>
      <button data-t="dark" aria-pressed="false" title="Ciemny motyw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg><span class="sr">Ciemny</span></button>
    </div>
    <button class="main" id="refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 12a9 9 0 11-2.6-6.4M21 4v5h-5"/></svg><span>Odśwież</span></button>
  </div>
</header>

<main class="wrap" id="app">
  <div class="intro in" style="--d:0ms">
    <h1 class="grad">Przegląd</h1>
    <span class="when num live" id="live"><i></i><span id="when"></span></span>
  </div>
  <div id="msg"></div>

  <section class="kpis" id="kpis" aria-label="Najważniejsze liczby">
    <div class="card kpi"><div class="sk" style="height:14px;width:60%"></div><div class="sk" style="height:34px;margin:12px 0 8px"></div></div>
    <div class="card kpi"><div class="sk" style="height:14px;width:60%"></div><div class="sk" style="height:34px;margin:12px 0 8px"></div></div>
    <div class="card kpi"><div class="sk" style="height:14px;width:60%"></div><div class="sk" style="height:34px;margin:12px 0 8px"></div></div>
    <div class="card kpi"><div class="sk" style="height:14px;width:60%"></div><div class="sk" style="height:34px;margin:12px 0 8px"></div></div>
  </section>

  <section class="mid">
    <div class="card chart in spot" id="chart" style="--d:200ms"></div>
    <div class="card plat in lift spot" id="plat" style="--d:260ms"></div>
  </section>

  <section class="card board in" id="board" style="--d:320ms" aria-label="Konta"></section>

  <div class="sec-h reveal">
    <div><h2 id="posts-h">Najlepsze posty</h2><div class="when" style="margin-top:2px">Kliknij post, żeby zobaczyć jego statystyki</div></div>
    <div class="seg" role="group" aria-label="Okres" id="range">
      <span class="pill"></span>
      <button data-r="new" aria-pressed="false">Ostatnie</button>
      <button data-r="28" aria-pressed="true">28 dni</button>
      <button data-r="0" aria-pressed="false">Cały czas</button>
    </div>
  </div>
  <section class="card posts reveal" id="posts"></section>

  <details class="card set reveal" id="settings">
    <summary><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>Konta i ustawienia</summary>
    <div class="set-body">
      <h3>Połączone konta</h3>
      <div id="list"></div>
      <div class="line">
        <label for="grp" style="margin:0">Nowe konto dodaj do grupy:</label>
        <select id="grp"><option value="pozaskala">PozaSkala</option><option value="prywatne">Prywatne</option></select>
        <button id="add-yt">Dodaj kanał YouTube</button>
        <button id="add-ig">Dodaj konto Instagram</button>
      </div>
      <h3>Klucze</h3>
      <p class="when" style="margin:-4px 0 12px">Wspólne dla wszystkich kont – wpisujesz je raz.</p>
      <div class="grid2">
        <div><label for="GOOGLE_CLIENT_ID">Google Client ID</label><input id="GOOGLE_CLIENT_ID" autocomplete="off"></div>
        <div><label for="GOOGLE_CLIENT_SECRET">Google Client Secret</label><input id="GOOGLE_CLIENT_SECRET" autocomplete="off"></div>
        <div><label for="IG_APP_ID">Instagram App ID</label><input id="IG_APP_ID" autocomplete="off"></div>
        <div><label for="IG_APP_SECRET">Instagram App Secret</label><input id="IG_APP_SECRET" autocomplete="off"></div>
        <div><label for="APIFY_TOKEN">Token Apify</label><input id="APIFY_TOKEN" autocomplete="off"></div>
        <div><label for="TIKTOK_PROFILES">Profile TikTok, po przecinku</label><input id="TIKTOK_PROFILES" autocomplete="off" placeholder="np. st4nczuk_"></div>
      </div>
      <div class="line" style="border:0;padding-bottom:0"><button class="main" id="save">Zapisz klucze</button><span id="saved" class="when"></span></div>
      <div class="hint">Adresy przekierowania do wklejenia w Google Cloud i w aplikacji Meta:<br>
        Google: <code id="r-g"></code><br>Instagram: <code id="r-i"></code></div>

</main>

<div class="sheet drawn" id="sheet" hidden>
  <div class="scrim" id="scrim"></div>
  <aside class="panel" role="dialog" aria-modal="true" aria-labelledby="p-title" id="panel"></aside>
</div>

<script>
const $ = s => document.querySelector(s);
const NAMES = {youtube: 'YouTube', instagram: 'Instagram', tiktok: 'TikTok'};
const VAR = {youtube: 'yt', instagram: 'ig', tiktok: 'tt'};
const ICON = {
  youtube: '<svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>',
  instagram: '<svg viewBox="0 0 24 24"><path d="M7 3h10a4 4 0 014 4v10a4 4 0 01-4 4H7a4 4 0 01-4-4V7a4 4 0 014-4zm5 5a4 4 0 100 8 4 4 0 000-8zm0 2a2 2 0 110 4 2 2 0 010-4zm5-3.2a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/></svg>',
  tiktok: '<svg viewBox="0 0 24 24"><path d="M15 3c.4 2.3 1.9 3.9 4.5 4.1v3.1c-1.6 0-3.1-.5-4.4-1.4v6.4A5.7 5.7 0 119.4 9.5v3.2a2.6 2.6 0 102.5 2.6V3H15z"/></svg>'
};
let data = null, group = '', range = 28, showAll = false, first = true, series = [], shown = [];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = n => n == null || n === '' || !isFinite(n) ? '–' : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' mln' : Math.round(n).toLocaleString('pl-PL');
const short = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' mln' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace('.', ',') + ' tys.' : String(Math.round(n));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const dmy = d => d ? d.split('-').reverse().join('.') : '';
const dayName = d => new Date(d + 'T12:00').toLocaleDateString('pl-PL', {day: 'numeric', month: 'short'});
const chip = d => d == null ? '<span class="chip flat">brak danych</span>' : `<span class="chip ${d > 0 ? 'up' : d < 0 ? 'down' : 'flat'}">${d > 0 ? '▲' : d < 0 ? '▼' : '■'} ${fmt(Math.abs(d))}</span>`;

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (r.status === 401) { showLogin(); throw new Error('auth'); }
  return r.json();
}

function showLogin() {
  if ($('.login')) return;
  $('#app').hidden = true; $('#head').hidden = true;
  document.body.insertAdjacentHTML('beforeend', `<form class="card login"><img src="/icon-192.png" alt="">
    <h1>Centrum dowodzenia</h1><p>Zaloguj się, żeby zobaczyć statystyki.</p>
    <label for="pw">Hasło</label><input type="password" id="pw" autocomplete="current-password" required>
    <div class="line" style="border:0;padding-bottom:0"><button class="main" type="submit">Zaloguj się</button><span id="lerr" class="when" style="color:var(--down)"></span></div></form>`);
  $('.login').onsubmit = async e => {
    e.preventDefault();
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({password: $('#pw').value})});
    if (r.ok) location.reload(); else $('#lerr').textContent = (await r.json()).error || 'Nie udało się zalogować.';
  };
  $('#pw').focus();
}

function movePill(box) {
  const b = box.querySelector('[aria-pressed=true]'), p = box.querySelector('.pill');
  if (!b || !p) return;
  p.style.width = b.offsetWidth + 'px';
  p.style.transform = `translateX(${b.offsetLeft}px)`;
}

function countUp(root) {
  root.querySelectorAll('[data-n]').forEach(el => {
    const target = el.dataset.n === '' ? NaN : +el.dataset.n;
    const from = +(el.dataset.prev || 0);
    if (reduce || !isFinite(target) || (!first && from === target)) { el.textContent = fmt(target); return; }
    if (!first && el.dataset.prev !== undefined && from !== 0) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
    const t0 = performance.now(), dur = first ? 1100 : 500;
    const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 4);
      el.textContent = fmt(from + (target - from) * e); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function weekDelta(a) {
  const h = a.history || [];
  if (h.length < 2) return null;
  const last = h[h.length - 1];
  const ref = h.find(x => (new Date(last.date) - new Date(x.date)) / 864e5 <= 7) || h[0];
  return last.followers - ref.followers;
}

function miniTrend(a, i) {
  const d = a.daily || [];
  if (d.length >= 2) {
    const v = d.map(x => x.views), mx = Math.max(...v, 1), w = 140, h = 34;
    const line = v.map((y, k) => `${(k / (v.length - 1) * w).toFixed(1)},${(h - 3 - y / mx * (h - 6)).toFixed(1)}`).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Wyświetlenia dziennie"><polyline class="sline" pathLength="1" style="--d:${400 + i * 70}ms" points="${line}" fill="none" stroke="var(--pc)" stroke-width="1.75" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
  }
  const ps = (a.posts || []).slice().sort((x, y) => x.date < y.date ? -1 : 1).slice(-12);
  if (ps.length < 2) return '<span class="faint">–</span>';
  const mx = Math.max(...ps.map(p => p.views || 0), 1);
  return `<div class="bars" aria-label="Wyświetlenia ostatnich postów">${ps.map((p, k) => `<i title="${fmt(p.views)} wyświetleń" style="height:${Math.max(8, (p.views || 0) / mx * 100).toFixed(0)}%;--d:${400 + i * 70 + k * 25}ms"></i>`).join('')}</div>`;
}

// ---------- duży wykres ----------
function buildSeries(accs) {
  const byDate = {};
  accs.forEach(([, a]) => (a.daily || []).forEach(d => byDate[d.date] = (byDate[d.date] || 0) + d.views));
  let pts = Object.entries(byDate).sort().map(([date, v]) => ({date, v}));
  if (pts.length >= 2) return {kind: 'views', title: 'Wyświetlenia dziennie', note: 'YouTube · ostatnie 28 dni', pts};
  const hist = {};
  accs.forEach(([, a]) => (a.history || []).forEach(h => hist[h.date] = (hist[h.date] || 0) + h.followers));
  pts = Object.entries(hist).sort().map(([date, v]) => ({date, v}));
  if (pts.length >= 2) return {kind: 'followers', title: 'Obserwujący łącznie', note: 'dzień po dniu', pts};
  return null;
}

function drawChart(accs) {
  const box = $('#chart');
  const s = buildSeries(accs);
  if (!s) {
    box.innerHTML = `<div class="card-h"><h2>Wyświetlenia dziennie</h2></div><div class="chart-empty"><div><b style="color:var(--ink)">Wykres pojawi się po podpięciu YouTube</b><br>albo po kilku dniach zbierania liczby obserwujących.</div></div>`;
    return;
  }
  series = s.pts;
  const W = Math.max(320, box.clientWidth - 20), H = innerWidth < 560 ? 220 : 260, L = 52, R = 10, T = 12, B = 26;
  const max = Math.max(...series.map(p => p.v)), min0 = Math.min(...series.map(p => p.v)), min = s.kind === 'views' ? 0 : min0;
  // równe, „okrągłe” podziałki osi (1, 2, 2,5, 5 × 10ⁿ)
  const raw = Math.max(max - min, 1) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(st => st >= raw);
  const lo = s.kind === 'views' ? 0 : Math.floor(min / step) * step;
  const span = Math.ceil((max - lo) / step) * step || step;
  const x = i => L + i / (series.length - 1) * (W - L - R);
  const y = v => T + (1 - (v - lo) / span) * (H - T - B);
  const ticks = Array.from({length: Math.round(span / step) + 1}, (_, k) => lo + k * step);
  const line = series.map((p, i) => `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const xi = [0, Math.floor((series.length - 1) / 2), series.length - 1];
  const sum = series.reduce((a, p) => a + p.v, 0);
  box.innerHTML = `<div class="card-h"><h2>${s.title}</h2><small>${s.note}</small></div>
    <div class="chart-box" tabindex="0" aria-label="${s.title}. Najechanie lub strzałki pokazują wartości dla dni.">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${s.title}, łącznie ${fmt(sum)}">
        <defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient><linearGradient id="gl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="var(--accent-2)"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs>
        ${ticks.map(t => `<line class="gl" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="ax num" x="${L - 10}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${short(t)}</text>`).join('')}
        ${xi.map((i, k) => `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 6}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${dayName(series[i].date)}</text>`).join('')}
        <polygon class="area" points="${x(0)},${y(lo)} ${line} ${x(series.length - 1)},${y(lo)}"/>
        <polyline class="ln" pathLength="1" points="${line}" vector-effect="non-scaling-stroke"/>
        <line class="xh" id="xh" y1="${T}" y2="${H - B}"/>
        <circle class="ring" id="rg" r="5"/>
        <circle class="pt" id="pt" r="4.5"/>
      </svg>
      <div class="tip" id="tip"></div>
    </div>`;
  const cb = box.querySelector('.chart-box'), svg = cb.querySelector('svg');
  const show = i => {
    i = Math.max(0, Math.min(series.length - 1, i));
    const px = x(i), py = y(series[i].v), sc = svg.clientWidth / W;
    $('#xh').setAttribute('x1', px); $('#xh').setAttribute('x2', px);
    $('#pt').setAttribute('cx', px); $('#pt').setAttribute('cy', py);
    $('#rg').setAttribute('cx', px); $('#rg').setAttribute('cy', py);
    const tip = $('#tip');
    tip.innerHTML = `<b class="num"></b><span></span>`;
    tip.firstChild.textContent = fmt(series[i].v);
    tip.lastChild.textContent = new Date(series[i].date + 'T12:00').toLocaleDateString('pl-PL', {weekday: 'short', day: 'numeric', month: 'long'});
    const left = px * sc + 6, tw = tip.offsetWidth;
    tip.style.left = Math.min(Math.max(left - tw / 2, 4), cb.clientWidth - tw - 4) + 'px';
    box.classList.add('hov'); cb.dataset.i = i;
  };
  cb.onpointermove = e => { const r = svg.getBoundingClientRect(); const fx = (e.clientX - r.left) / r.width * W; show(Math.round((fx - L) / (W - L - R) * (series.length - 1))); };
  cb.onpointerleave = () => box.classList.remove('hov');
  cb.onkeydown = e => { if (!['ArrowLeft', 'ArrowRight'].includes(e.key)) return; e.preventDefault(); show(+(cb.dataset.i ?? series.length - 1) + (e.key === 'ArrowLeft' ? -1 : 1)); };
  cb.onblur = () => box.classList.remove('hov');
}

    : `<div class="empty"><b>${group ? 'W tej grupie nie ma jeszcze kont' : 'Nie masz jeszcze podpiętych kont'}</b>Dodasz je w „Konta i ustawienia” na dole strony.</div>`;

  // posty
  const cut = new Date(Date.now() - (range === 'new' ? 0 : range) * 864e5).toISOString().slice(0, 10);

  $('#posts-h').textContent = range === 'new' ? 'Ostatnie posty' : 'Najlepsze posty';

      <span class="rank num">${String(i + 1).padStart(2, '0')}</span>
      <span class="thumbw">${p.thumb ? `<img class="thumb" src="${esc(p.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" data-p="${p.platform}">` : `<span class="thumb">${ICON[p.platform]}</span>`}<span class="pbadge">${ICON[p.platform]}</span></span>
      <span style="min-width:0"><span class="pt">${esc(p.title) || 'Bez opisu'}</span>
        <span class="pm"><span>${esc(p.acc)}</span><i class="sep"></i><span class="num">${dmy(p.date)}</span><span class="peng num ms">${p.views ? (((p.likes || 0) + (p.comments || 0) + (p.shares || 0) + (p.saved || 0)) / p.views * 100).toFixed(1).replace('.', ',') + '% zaang.' : ''}</span></span></span>
      <span class="pstats num hide-m"><span title="Polubienia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.6-7 10-7 10z"/></svg>${fmt(p.likes)}</span><span title="Komentarze"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16v11H9l-5 4z"/></svg>${fmt(p.comments)}</span></span>
      <span class="pv"><b class="num">${fmt(p.views)}</b><small>wyświetleń</small><span class="mbar"><i style="width:${Math.max(3, (p.views || 0) / topv * 100).toFixed(1)}%;--d:${200 + Math.min(i, 5) * 50}ms"></i></span></span>

    ${all.length > TOP ? `<div class="plist" id="plist" style="grid-template-rows:${showAll ? '1fr' : '0fr'}"><div>${all.slice(TOP).map((p, i) => row(p, i + TOP)).join('')}</div></div>

function seg(box, attr, apply, rerender = true) {

function hoverChart(box, pts, opt) {

      ${xi.map((i, k) => `<text class="ax" x="${x(i).toFixed(1)}" y="${H - 4}" text-anchor="${k === 0 ? 'start' : k === 2 ? 'end' : 'middle'}">${opt.xl(pts[i])}</text>`).join('')}
      <polygon points="${x(0)},${y(0)} ${line} ${x(pts.length - 1)},${y(0)}" fill="url(#pg)"/>
      <polyline class="sline" pathLength="1" style="--d:250ms" points="${line}" fill="none" stroke="var(--pc)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
      <line class="xh" y1="${T}" y2="${H - B}"/><circle class="pt" r="4"/></svg><div class="tip"></div>`;
  const svg = box.querySelector('svg'), tip = box.querySelector('.tip'), xh = box.querySelector('.xh'), pt = box.querySelector('.pt');
  const show = i => {
    i = Math.max(0, Math.min(pts.length - 1, i));
    const px = x(i), sc = svg.clientWidth / W;
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); pt.setAttribute('cx', px); pt.setAttribute('cy', y(pts[i].v));
    tip.innerHTML = '<b class="num"></b><span></span>';
    tip.firstChild.textContent = opt.tv(pts[i], i); tip.lastChild.textContent = opt.tl(pts[i], i);
    const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(12 + px * sc - tw / 2, 4), box.clientWidth - tw - 4) + 'px';
    box.classList.add('hov');
  };
  box.onpointermove = e => { const r = svg.getBoundingClientRect(); show(Math.round(((e.clientX - r.left) / r.width * W - L) / (W - L - R) * (pts.length - 1))); };
  box.onpointerleave = () => box.classList.remove('hov');
}

function openPost(p) {
  lastFocus = document.activeElement;
  const acc = data.accounts[p.key] || {};
  const med = median((acc.posts || []).map(x => x.views || 0));
  const diff = med ? Math.round(((p.views || 0) / med - 1) * 100) : null;
  const eng = p.views ? ((p.likes || 0) + (p.comments || 0) + (p.shares || 0) + (p.saved || 0)) / p.views * 100 : null;
  const rank = (acc.posts || []).slice().sort((a, b) => (b.views || 0) - (a.views || 0)).findIndex(x => x.id === p.id) + 1;
  const tall = p.platform !== 'youtube';
  const cells = [cell(p.likes, 'polubień', 0), cell(p.comments, 'komentarzy', 1), cell(p.shares, 'udostępnień', 2), cell(p.saved, 'zapisań', 3),
                 cell(p.reach, 'osób zasięgu', 4), cell(eng != null ? eng.toFixed(1).replace('.', ',') + '%' : null, 'zaangażowania', 5)].join('');
  $('#panel').style.setProperty('--pc', `var(--${VAR[p.platform]})`);
  $('#panel').innerHTML = `
    <div class="p-top"><span class="logo">${ICON[p.platform]}</span><b>${esc(p.acc)}</b><button id="p-close" aria-label="Zamknij"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="p-in">
      <div class="p-head" style="--i:0">
        <div class="p-media ${tall ? 'tall' : ''}">${p.thumb ? `<img src="${esc(p.thumb)}" alt="" referrerpolicy="no-referrer">` : ICON[p.platform]}</div>
        <div><div class="p-title" id="p-title"></div><div class="p-date">${NAMES[p.platform]} · ${new Date(p.date + 'T12:00').toLocaleDateString('pl-PL', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'})}</div>
          <div class="p-hero"><b class="num" data-n="${p.views || 0}"></b><span>wyświetleń</span></div>
          <div class="p-cmp">${diff == null ? '' : (diff === 0 ? 'Tyle, co zwykły post tego konta' : `<b class="${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : '−'}${Math.abs(diff)}%</b> ${diff > 0 ? 'więcej' : 'mniej'} niż zwykły post tego konta`)}${rank ? ` · ${rank}. miejsce na koncie` : ''}</div>
          <div class="p-grid p-react">${cells}</div></div>
      </div>
      <div style="--i:1"><div class="p-sec">Jak rosły wyświetlenia <small id="p-chart-note"></small></div><div class="p-chart" id="p-chart"><div class="sk" style="height:260px"></div></div></div>
      <div id="p-extra" style="--i:3"></div>
      <div class="p-cta" style="--i:4"><a href="${esc(p.url)}" target="_blank" rel="noopener">${PLAT_OPEN[p.platform]}<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17L17 7M9 7h8v8"/></svg></a></div>
    </div>`;
  $('#p-title').textContent = p.title || 'Bez opisu';
  $('#panel').querySelectorAll('.p-media img').forEach(img => img.onerror = () => { img.replaceWith(Object.assign(document.createElement('span'), {innerHTML: ICON[p.platform]})); });
  const sh = $('#sheet');
  sh.hidden = false; sh.classList.remove('closing');
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => requestAnimationFrame(() => sh.classList.add('open')));
  const saveFirst = first; first = true; countUp($('#panel')); first = saveFirst;
  $('#p-close').onclick = closePost; $('#p-close').focus({preventScroll: true});
  // historia z kolejnych odświeżeń centrum (Instagram, TikTok – i zapas dla YouTube)
  const hist = ((acc.post_hist || {})[p.id] || []).map(([t, v]) => ({t, v}));
  const fromHist = () => {
    $('#p-chart-note').textContent = hist.length > 1 ? 'z kolejnych odświeżeń centrum' : '';
    hoverChart($('#p-chart'), hist, {
      empty: 'Wykres zbuduje się sam – centrum zapisuje wyświetlenia tego posta przy każdym odświeżeniu.',
      aria: 'Wyświetlenia posta w czasie',
      xl: q => new Date(q.t).toLocaleDateString('pl-PL', {day: 'numeric', month: 'short'}),
      tv: q => fmt(q.v) + ' wyświetleń',
      tl: q => new Date(q.t).toLocaleString('pl-PL', {day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit'})});
  };
  if (p.platform === 'youtube') loadExtra(p, fromHist); else fromHist();
}

async function loadExtra(p, fallback) {
  let r = null;
  try { r = await api(`/api/social/post?key=${encodeURIComponent(p.key)}&id=${encodeURIComponent(p.id)}`); } catch (e) {}
  const x = r?.extra;
  if (!$('#p-chart')) return;
  if (!x || !x.daily || x.daily.length < 2) { fallback(); }
  else {
    let run = 0;
    const pts = x.daily.map(d => ({date: d.date, day: d.views, v: (run += d.views)}));
    $('#p-chart-note').textContent = 'łącznie od publikacji';
    hoverChart($('#p-chart'), pts, {
      empty: '', aria: 'Wyświetlenia filmu łącznie od publikacji',
      xl: q => dayName(q.date),
      tv: q => fmt(q.v) + ' łącznie',
      tl: q => `${new Date(q.date + 'T12:00').toLocaleDateString('pl-PL', {weekday: 'short', day: 'numeric', month: 'long'})} · +${fmt(q.day)} tego dnia`});
  }
  if (x) $('#p-extra').innerHTML = `<div class="p-sec">Oglądalność</div><div class="p-grid">
      ${cell(Math.round((x.minutes || 0) / 60), 'godzin oglądania', 0)}${cell(mmss(x.avg_duration), 'średni czas oglądania', 1)}
      ${cell(x.avg_percent != null ? Math.round(x.avg_percent) + '%' : null, 'filmu obejrzane średnio', 2)}${cell(x.subs, 'nowych subskrypcji', 3)}</div>`;
}

function closePost() {
  const sh = $('#sheet');
  if (sh.hidden) return;
  sh.classList.add('closing'); sh.classList.remove('open');
  setTimeout(() => { sh.hidden = true; sh.classList.remove('closing'); document.body.style.overflow = ''; lastFocus?.focus?.({preventScroll: true}); }, reduce ? 0 : 250);
}
$('#scrim').onclick = closePost;
addEventListener('keydown', e => { if (e.key === 'Escape') closePost(); });
$('#posts').addEventListener('click', e => {
  const a = e.target.closest('a.post'); if (!a) return;
  if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;   // z Cmd/Ctrl otwiera się normalnie w nowej karcie
  e.preventDefault();
  openPost(shown[+a.dataset.i]);
});

seg($('#tabs'), 'g', v => group = v);
seg($('#range'), 'r', v => range = v === 'new' ? 'new' : +v);

// reflektor podążający za kursorem na kartach
function hookSpots() {
  document.querySelectorAll('.spot').forEach(el => {
    if (el.dataset.sp) return; el.dataset.sp = 1;
    el.addEventListener('pointermove', e => { const r = el.getBoundingClientRect(); el.style.setProperty('--mx', (e.clientX - r.left) + 'px'); el.style.setProperty('--my', (e.clientY - r.top) + 'px'); });
  });
}
// sekcje niżej strony wjeżdżają, gdy do nich przewiniesz
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('seen'); io.unobserve(e.target); } }), {rootMargin: '0px 0px -8% 0px'}) : null;
document.querySelectorAll('.reveal').forEach(el => io ? io.observe(el) : el.classList.add('seen'));
addEventListener('scroll', () => $('#head').classList.toggle('scrolled', scrollY > 8), {passive: true});

// motyw: jak w systemie / jasny / ciemny
function setTheme(t, save) {
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  if (save) { try { localStorage.setItem('motyw', t); } catch (e) {} }
  $('#theme').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x.dataset.t === t));
  movePill($('#theme'));
}
$('#theme').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const go = () => setTheme(b.dataset.t, true);
  if (!document.startViewTransition || reduce) return go();
  const r = b.getBoundingClientRect();
  document.documentElement.style.setProperty('--tx', (r.left + r.width / 2) + 'px');
  document.documentElement.style.setProperty('--ty', (r.top + r.height / 2) + 'px');
  const vt = document.startViewTransition(go);
  vt.ready.then(() => document.documentElement.animate(
    {clipPath: [`circle(0 at ${r.left + r.width / 2}px ${r.top + r.height / 2}px)`, `circle(${Math.hypot(innerWidth, innerHeight)}px at ${r.left + r.width / 2}px ${r.top + r.height / 2}px)`]},
    {duration: 650, easing: 'cubic-bezier(.2,0,0,1)', pseudoElement: '::view-transition-new(root)'})).catch(() => {});
};
setTheme(document.documentElement.dataset.theme || 'auto');

const pills = () => ['#tabs', '#range', '#theme'].forEach(s => movePill($(s)));
let rt; addEventListener('resize', () => { pills(); clearTimeout(rt); rt = setTimeout(() => data && drawChart(Object.entries(data.accounts || {}).filter(([, a]) => !group || a.group === group)), 150); });
document.fonts?.ready.then(pills);
pills();

$('#refresh').onclick = async () => { await api('/api/social/refresh', {method: 'POST'}); setTimeout(load, 600); };
$('#save').onclick = async () => {
  const body = {};
  for (const key of ['GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'IG_APP_ID', 'IG_APP_SECRET', 'APIFY_TOKEN', 'TIKTOK_PROFILES']) body[key] = $('#' + key).value;
  await api('/api/social/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  $('#saved').textContent = 'Klucze zapisane'; setTimeout(() => $('#saved').textContent = '', 2500); loadSettings();
};
$('#add-yt').onclick = () => location.href = '/api/social/google/connect?group=' + $('#grp').value;
$('#add-ig').onclick = () => location.href = '/api/social/instagram/connect?group=' + $('#grp').value;

const qs = new URLSearchParams(location.search);
if (qs.get('blad')) $('#msg').innerHTML = `<div class="note bad">${esc(qs.get('blad'))}</div>`;
if (qs.get('ok')) $('#msg').innerHTML = `<div class="note good">Konto ${esc(NAMES[qs.get('ok')] || '')} połączone. Statystyki pobierają się w tle.</div>`;
if (qs.get('blad') || qs.get('ok')) { history.replaceState(null, '', '/'); $('#settings').open = true; }
load().then(loadSettings).catch(() => {});
</script>
</body>
</html>
