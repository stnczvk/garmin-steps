/* ---------- waga: wykres, prognoza, pomiary ---------- */
let wRange="3m", wAddOpen=false, wAll=false, wDate=null;
function bwDaily(){ const m={}; for(const p of bwSeries()) m[p.d]=p.v; return Object.entries(m).sort((a,b)=>a[0]<b[0]?-1:1).map(([d,v])=>({d,v})); }
function weightBlock(){
  const all=bwDaily(), g=+targets.goalBw||null, tr=bwTrend();
  const cut={"1m":30,"3m":91,"6m":182,"1y":365,"all":1e5}[wRange];
  const from=shiftDate(today(),-cut); const pts=all.filter(p=>p.d>=from);
  const chips=[["1m","1 mies."],["3m","3 mies."],["6m","6 mies."],["1y","Rok"],["all","Od początku"]].map(([k,l])=>`<button data-act="w-range" data-k="${k}" aria-pressed="${wRange===k}">${l}</button>`).join("");
  let chart;
  if(pts.length<2) chart=`<div class="empty">${all.length<2?"Dodaj co najmniej 2 pomiary wagi, żeby zobaczyć wykres.":"W tym okresie jest mniej niż 2 pomiary. Wybierz dłuższy zakres."}</div>`;
  else{
    const W=360,H=210,L=34,R=8,T=12,B=26;
    let lo=Math.min(...pts.map(p=>p.v),g??1e9), hi=Math.max(...pts.map(p=>p.v),g??-1e9);
    const pad=Math.max(0.5,(hi-lo)*0.12); lo=Math.floor(lo-pad); hi=Math.ceil(hi+pad);
    const t0=new Date(pts[0].d).getTime(), t1=Math.max(new Date(pts.at(-1).d).getTime(),t0+864e5);
    const x=d=>L+(new Date(d).getTime()-t0)/(t1-t0)*(W-L-R), y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
    const st=(hi-lo)>12?5:(hi-lo)>5?2:1; let grid="";
    for(let v=Math.ceil(lo/st)*st;v<=hi;v+=st) grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
    const line=pts.map((p,i)=>`${i?"L":"M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    const avgPts=pts.map(p=>{const f=shiftDate(p.d,-6);const w=all.filter(q=>q.d>=f&&q.d<=p.d);return {d:p.d,v:w.reduce((a,q)=>a+q.v,0)/w.length}});
    const avgLine=avgPts.map((p,i)=>`${i?"L":"M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
    const goalL=g&&g>=lo&&g<=hi?`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--ink)" stroke-width="1.5"/><text x="${W-R}" y="${y(g)-4}" text-anchor="end" font-size="10" fill="var(--ink)">cel ${fmt(g)}</text>`:"";
    const fd=d=>{const z=new Date(d+"T12:00:00");return cut>200?z.toLocaleDateString("pl-PL",{month:"short",year:"2-digit"}):z.toLocaleDateString("pl-PL",{day:"numeric",month:"short"})};
    const last=pts.at(-1);
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres wagi">${grid}${goalL}
      <path d="${line}" fill="none" stroke="var(--c)" stroke-width="1.2" stroke-opacity=".45" stroke-linejoin="round"/>
      <path d="${avgLine}" fill="none" stroke="var(--c)" stroke-width="3.2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.length<=40?pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="2.5" fill="var(--c)" fill-opacity=".55"/>`).join(""):""}
      <circle cx="${x(last.d)}" cy="${y(avgPts.at(-1).v)}" r="5" fill="var(--surface)" stroke="var(--c)" stroke-width="3"/>
      <text x="${L}" y="${H-8}" font-size="10" fill="var(--muted)">${fd(pts[0].d)}</text><text x="${W-R}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="end">${fd(last.d)}</text></svg>`;
  }
  // różnica i prognoza
  const cur=smoothBw();
  let info="";
  if(cur&&g){
    const diff=cur-g, need=Math.abs(diff);
    let prog="";
    if(need<0.2) prog="Jesteś przy wadze docelowej.";
    else if(tr&&Math.sign(tr.perWeek)===-Math.sign(diff)&&Math.abs(tr.perWeek)>0.05){ const days=Math.ceil(need/Math.abs(tr.perWeek)*7); prog=`Prognoza osiągnięcia celu: <b>za ${days} dni</b> <span class="note">(przy obecnym tempie ${fmt(Math.round(Math.abs(tr.perWeek)*100)/100)} kg/tydz.)</span>`; }
    else { const r=+targets.rate||0.4; const days=Math.ceil(need/r*7); prog=`Prognoza osiągnięcia celu: <b>za ok. ${days} dni</b> <span class="note">(przy zaplanowanym tempie ${fmt(r)} kg/tydz.${tr?"; obecny trend jeszcze tego nie pokazuje":""})</span>`; }
    info=`<div class="card" style="border:2px solid var(--good);box-shadow:none"><div>Różnica do celu (ze średniej 7 dni): <b class="num">${diff>0?"+":""}${fmt(Math.round(diff*10)/10)} kg</b></div><div>${prog}</div></div>`;
  } else if(cur) info=`<div class="note">Ustaw wagę docelową w karcie „Cel wagi i kalorie”, żeby zobaczyć różnicę i prognozę.</div>`;
  // tabela
  const sesD=new Set(sessions.filter(x=>x.bw>0).map(x=>x.date));
  const rowsAll=[...all].reverse(); const rows=wAll?rowsAll:rowsAll.slice(0,11);
  const dir=goalDir();
  const table=rows.length?`<div style="overflow-x:auto"><table class="wtable"><thead><tr><th>Data</th><th class="r">Pomiar (kg)</th><th class="r">Zmiana</th><th></th></tr></thead><tbody>
    ${rows.map((p,i)=>{const prev=rowsAll[i+1];const ch=prev?p.v-prev.v:null;const good=ch==null?null:(dir<0?ch<0:dir>0?ch>0:Math.abs(ch)<0.3);
      return `<tr><td class="num">${fmtDate(p.d)}</td><td class="r num">${fmt(p.v)}</td><td class="r num" style="color:${ch==null||Math.abs(ch)<0.05?"var(--muted)":good?"var(--good)":"var(--bad)"}">${ch==null?"–":Math.abs(ch)<0.05?"0":`${ch<0?"▼":"▲"} ${fmt(Math.round(Math.abs(ch)*10)/10)}`}</td><td class="r">${activity[p.d]?.bw>0?`<button class="x" data-act="w-del" data-d="${p.d}" aria-label="Usuń pomiar">×</button>`:sesD.has(p.d)?`<span class="note" title="z treningu">T</span>`:""}</td></tr>`}).join("")}
    </tbody></table></div>${rowsAll.length>11?`<button class="btn ghost small" data-act="w-all" style="align-self:flex-start">${wAll?"Pokaż mniej":`Pokaż wszystkie (${rowsAll.length})`}</button>`:""}`:"";
  const add="";
  const wd=wDate||today(), tw=activity[wd]?.bw;
  const quick=`<div class="row" style="align-items:end"><label class="stack" style="gap:4px"><span class="label">Data</span><input type="date" id="w-date" value="${wd}" max="${today()}"></label><label class="stack" style="gap:4px;width:110px"><span class="label">Waga (kg)</span><input type="number" id="w-today" step="0.1" inputmode="decimal" value="${tw||""}" placeholder="np. 56,1"></label><button class="btn small" data-act="w-today-save">Zapisz</button><span class="note" id="w-msg" style="font-weight:600"></span></div>
    <p class="note" style="margin:0">Domyślnie dzisiejsza data. Zmień ją, żeby dopisać starszy pomiar (np. z Fitatu). Waż się rano, po toalecie, przed jedzeniem, najlepiej 3–7 razy w tygodniu.</p>`;
  return `${quick}<div class="chips">${chips}</div>${chart}
    <div class="legend" style="flex-direction:row;flex-wrap:wrap;gap:6px 16px"><span><i class="lg" style="background:var(--c)"></i>średnia z 7 dni (trend)</span><span><i class="lg" style="background:var(--c);opacity:.45"></i>pojedyncze pomiary</span>${g?`<span>━ cel</span>`:""}</div>
    ${tr?`<div class="note">Trend z ostatnich 4 tygodni: <b class="num">${tr.perWeek<0?"−":"+"}${fmt(Math.round(Math.abs(tr.perWeek)*100)/100)} kg/tydz.</b> · średnia z 7 dni: <b class="num">${fmt(Math.round(tr.last*10)/10)} kg</b></div>`:all.length?`<div class="note">Trend pokaże się po min. 3 pomiarach z co najmniej tygodnia.</div>`:""}
    ${info}${add}${table}`;
}

/* ---------- cel wagi i tempo ---------- */
const DAILY=[[1.2,"Siedząca (praca przy biurku, do 5 tys. kroków)"],[1.35,"Lekka (trochę chodzenia, 5–7 tys. kroków)"],[1.45,"Umiarkowana (praca na nogach, 7–10 tys. kroków)"],[1.6,"Wysoka (praca fizyczna, 10 tys.+ kroków)"]];
function bwSeries(){
  const pts=sessions.filter(x=>x.bw>0).map(x=>({d:x.date,v:+x.bw}));
  for(const [d,a] of Object.entries(activity)) if(a&&a.bw>0) pts.push({d,v:+a.bw});
  return pts.sort((a,b)=>a.d<b.d?-1:1);
}
function tdeeInfo(){
  const bw=lastBw(); let bmr=null, zero=null;
  if(bw&&targets.height&&targets.age){
    bmr=10*bw+6.25*targets.height-5*targets.age+(targets.sex==="k"?-161:5);
    const F={1.2:1.3,1.35:1.45,1.45:1.6,1.6:1.75}; // aktywność poza treningiem (NEAT) dla młodych, aktywnych osób
    const daily=F[+targets.daily]||1.45, tr=targets.trainings??3;
    zero=bmr*daily + tr*6*bw/7 + (+targets.adj||0); // trening siłowy ok. 6 kcal na kg masy ciała na sesję
  }
  // sprawdzenie na Twoich danych: ostatnie 21 dni jedzenia + trend wagi
  let adapt=null, why="";
  const from=shiftDate(today(),-21);
  const fdays=Object.keys(food).filter(d=>d>=from&&d<today()&&(food[d]||[]).length);
  const pts=bwSeries().filter(p=>p.d>=from);
  if(fdays.length>=10&&pts.length>=2&&(new Date(pts.at(-1).d)-new Date(pts[0].d))/864e5>=10){
    const avg=fdays.reduce((a,d)=>a+dayTotals(food[d]).kcal,0)/fdays.length;
    const t0=new Date(pts[0].d).getTime(); const xs=pts.map(p=>(new Date(p.d).getTime()-t0)/864e5), ys=pts.map(p=>p.v);
    const mx=xs.reduce((a,b)=>a+b)/xs.length, my=ys.reduce((a,b)=>a+b)/ys.length;
    const slope=xs.reduce((a,x,i)=>a+(x-mx)*(ys[i]-my),0)/xs.reduce((a,x)=>a+(x-mx)**2,0);
    const est=avg-slope*7700; if(est>1300&&est<5000) adapt=est;
  } else why=`po ok. 2–3 tygodniach wpisywania jedzenia i wagi (masz ${fdays.length} dni jedzenia i ${pts.length} pomiary wagi z 3 tyg.)`;
  return {bmr,zero,adapt,why,used:zero};
}
function goalDir(){ const bw=lastBw(), g=+targets.goalBw; if(!bw||!g) return 0; return g<bw-0.2?-1:g>bw+0.2?1:0; }
function autoKcal(){
  if(targets.autoKcal===false||!targets.goalBw) return null;
  const t=tdeeInfo(); if(!t.zero) return null;
  const rate=+targets.rate||0.4, dir=goalDir(), n=Math.min(6,Math.max(0,targets.trainings??3));
  const avg=Math.max(1500,t.zero+dir*rate*7700/7);
  const r10=x=>Math.round(x/10)*10;
  return {avg, zero:t.zero, train:r10(avg+100*(7-n)/7), rest:r10(avg-100*n/7)};
}
function goalHTML(){

  const diff=bw&&g?Math.abs(g-bw):null, weeks=diff&&dir?Math.ceil(diff/rate):null;
  const eta=weeks?(()=>{const d=new Date();d.setDate(d.getDate()+weeks*7);return d.toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"})})():null;
  const pct=bw?rate/bw*100:null;

      <label style="grid-column:1/-1"><span class="label">Aktywność w ciągu dnia</span>${sel("wg-daily",DAILY,targets.daily??1.35)}</label>

    </div>
    <div class="stat" style="background:var(--surface2)"><div class="label">Zero kaloryczne</div><div class="v num">${t.zero?Math.round(t.zero)+" kcal":"–"}</div><div class="note">${t.zero?"Tyle kalorii dziennie utrzymuje Twoją obecną wagę. Wzór jest szacunkiem. Jeśli znasz swoje zero z doświadczenia albo z Fitatu, dopasuj je korektą.":"Uzupełnij wagę, wzrost i wiek."}</div></div>
    <div class="label">3. Cel i tempo</div>
    <div class="editgrid">
      <label><span class="label">Waga docelowa</span><input type="number" id="wg-goal" step="0.1" inputmode="decimal" value="${targets.goalBw??""}" placeholder="kg"></label>
      <label style="grid-column:span 2"><span class="label">Tempo zmiany wagi</span>${sel("wg-rate",[[0.25,"0,25 kg / tydzień"],[0.3,"0,3 kg / tydzień"],[0.4,"0,4 kg / tydzień"],[0.5,"0,5 kg / tydzień"],[0.6,"0,6 kg / tydzień"],[0.75,"0,75 kg / tydzień"],[1,"1 kg / tydzień"]],targets.rate??0.4)}</label>
    </div>
    ${warn?`<div class="note" style="color:var(--warn);font-weight:600">${warn}</div>`:""}
    <label class="row" style="gap:10px;cursor:pointer;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" id="wg-auto" ${targets.autoKcal!==false?"checked":""} style="width:22px;height:22px;min-height:0;flex:none"> <span>Ustaw moje cele kalorii według tego wyliczenia</span></label>

      <div class="note num">${dir<0?`zero kaloryczne ${Math.round(ak.zero)} − ${deficit} kcal deficytu`:dir>0?`zero kaloryczne ${Math.round(ak.zero)} + ${deficit} kcal nadwyżki`:"utrzymanie wagi"}</div>
      <div class="note num" style="margin-top:4px"><b>Dzień treningowy ${ak.train} kcal · dzień wolny ${ak.rest} kcal</b></div></div>`:""}

function parseGarminSteps(txt,goal){
  const lines=txt.replace(/\u00a0/g," ").split(/\n+/);const cands=[];
  lines.forEach((ln,li)=>{const low=ln.toLowerCase();const re=/(\d{1,2}[ .,]\d{3}|\d{3,5})/g;let m;
    while((m=re.exec(ln))){const v=+m[1].replace(/[ .,]/g,"");if(v<50||v>80000)continue;
      const before=low.slice(0,m.index);const isGoal=/cel|goal|\/\s*$/.test(before.slice(-8));
      const near=/krok|step/.test(low)||/krok|step/.test((lines[li+1]||"").toLowerCase())||/krok|step/.test((lines[li-1]||"").toLowerCase());
      cands.push({v,isGoal,near,idx:cands.length});}});
  const ok=cands.filter(c=>!c.isGoal&&c.v!==goal);
  const pick=ok.find(c=>c.near)||ok.sort((a,b)=>b.v-a.v)[0];
  return pick?pick.v:null;
}

async function decodeBarcode(file){
  const im=await loadImg(file);
  if("BarcodeDetector" in window){ try{ const det=new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]}); const r=await det.detect(im); if(r&&r[0]&&/^\d{8,14}$/.test(r[0].rawValue)) return r[0].rawValue; }catch(e){} }
  await loadScript("ocrlib/zxing.min.js","ZXing");
  const ZX=window.ZXing, rd=new ZX.MultiFormatReader(), hints=new Map();
  hints.set(ZX.DecodeHintType.POSSIBLE_FORMATS,[ZX.BarcodeFormat.EAN_13,ZX.BarcodeFormat.EAN_8,ZX.BarcodeFormat.UPC_A,ZX.BarcodeFormat.UPC_E,ZX.BarcodeFormat.CODE_128]);
  hints.set(ZX.DecodeHintType.TRY_HARDER,true); rd.setHints(hints);
  const cv=document.createElement("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
  const W=im.naturalWidth||im.width, H=im.naturalHeight||im.height;
  const crops=[[0,0,1,1],[0.1,0.25,0.8,0.5],[0,0.15,1,0.7],[0.2,0.1,0.6,0.8]];
  for(const maxS of [1400,900,2000]) for(const [x,y,w,h] of crops) for(const rot of [0,90]){
    const sw=W*w, sh=H*h, sc=Math.min(1,maxS/Math.max(sw,sh)), dw=Math.round(sw*sc), dh=Math.round(sh*sc);
    if(rot){cv.width=dh;cv.height=dw;cx.setTransform(0,1,-1,0,dh,0);}else{cv.width=dw;cv.height=dh;cx.setTransform(1,0,0,1,0,0);}
    cx.drawImage(im,W*x,H*y,sw,sh,0,0,dw,dh); cx.setTransform(1,0,0,1,0,0);
    for(const Bin of [ZX.HybridBinarizer,ZX.GlobalHistogramBinarizer]){ try{ const res=rd.decode(new ZX.BinaryBitmap(new Bin(new ZX.HTMLCanvasElementLuminanceSource(cv)))); const t=res.getText(); if(/^\d{8,14}$/.test(t)) return t; }catch(e){} }
  }
  throw new Error("nocode");
}

      <div><span class="note">Białko</span>${kR(bw,P.p[0],P.p[1])}</div>
      <div><span class="note">Tłuszcz</span>${kR(bw,P.f[0],P.f[1])}</div>
      ${P.r?`<div style="grid-column:1/-1"><span class="note">Zdrowe tempo zmiany wagi (${P.rt} tygodniowo)</span><b class="num">${type==="bulk"?"+":"−"}${kg2(bw*P.r[0])} do ${type==="bulk"?"+":"−"}${kg2(bw*P.r[1])} kg / tydzień</b></div>`:`<div style="grid-column:1/-1"><span class="note">Zdrowe tempo</span><b>średnia waga stabilna, ±0,5 kg przez 2 tygodnie</b></div>`}
      ${z?`<div><span class="note">Twoje zero kaloryczne</span><b class="num">${Math.round(z)} kcal</b></div>`:""}
    </div>
    ${z?"":`<div class="note">Kalorie pokażą się po uzupełnieniu danych w Podsumowanie → Waga → „Cel wagi i kalorie”.</div>`}
    <div class="note">Węglowodany: reszta kalorii po białku i tłuszczu.</div></div>`;
}
function foodRows(names,key){
  let rows=names.map(n=>DB_ITEMS.find(x=>x.name===n)).filter(Boolean).sort((a,b)=>b[key]-a[key]);
  const col=k=>`<td class="r num" style="white-space:nowrap">${k===key?`<b>${fmt(rows._r[k])}</b>`:`${fmt(rows._r[k])}`}</td>`;
  return `<div style="overflow-x:auto"><table class="wtable"><thead><tr><th>Na 100 g produktu</th><th class="r" style="color:var(--m-p)">B (g)</th><th class="r" style="color:var(--m-c)">W (g)</th><th class="r" style="color:var(--m-f)">T (g)</th></tr></thead><tbody>${rows.map(r=>{rows._r=r;return `<tr><td>${esc(r.name)}</td>${col("p")}${col("c")}${col("f")}</tr>`}).join("")}</tbody></table></div>`;
}
function knowArticle(k){
  const bw=kBw(), bwTxt=bw?`Przy Twojej wadze (${fmt(Math.round(bw*10)/10)} kg): `:"";
  const A={
  macro:`<h2>Białko, węgle, tłuszcze</h2>
    <h3>Białko: buduje i chroni mięśnie</h3>
    <ul class="klist"><li><b>Redukcja:</b> 2–2,4 g na kg masy ciała. Na deficycie białko najmocniej chroni mięśnie. ${bwTxt?bwTxt+kR(bw,2,2.4)+".":""}</li>
    <li><b>Masa:</b> 1,6–2,2 g/kg. Więcej nie buduje więcej mięśni, tylko zabiera miejsce węglom. ${bwTxt?bwTxt+kR(bw,1.6,2.2)+".":""}</li>
    <li><b>Utrzymanie:</b> 1,6–2 g/kg. ${bwTxt?bwTxt+kR(bw,1.6,2)+".":""}</li>
    <li>Rozłóż je na 3–5 posiłków po ok. 25–40 g. Jeden posiłek z porcją białka w ciągu 2–3 godzin po treningu wystarczy, nie trzeba pić shake'a „w okienku”.</li></ul>
    <h3>Tłuszcze: hormony i zdrowie</h3>
    <ul class="klist"><li>20–35% kalorii. Nie schodź na dłużej poniżej ok. 0,6–0,7 g/kg, bo cierpi gospodarka hormonalna, w tym testosteron. ${bw?`Dla Ciebie minimum to ok. <b class="num">${Math.round(bw*0.65)} g</b> dziennie.`:""}</li>
    <li>Najlepiej z oliwy, orzechów, ryb, jajek i awokado. Tłuszczy trans (twarde margaryny, część słodyczy i fast foodów) unikaj.</li></ul>
    <h3>Węglowodany: paliwo na trening</h3>
    <ul class="klist"><li>To, co zostaje z kalorii po białku i tłuszczu. Przy 3 treningach siłowych zwykle 3–5 g/kg${bw?` (dla Ciebie ok. <b class="num">${Math.round(bw*3)}–${Math.round(bw*5)} g</b>)`:""}.</li>
    <li>Najwięcej zjedz w posiłku przed treningiem (1,5–3 h wcześniej) i po nim, a przez resztę dnia mniej. Dziennik już to robi, bo w dzień treningowy daje więcej kcal.</li>
    <li>Bazą niech będą kasze, ryż, ziemniaki, płatki owsiane, pieczywo pełnoziarniste i owoce. Słodycze mogą być, byle w ramach kalorii.</li></ul>
    <h3>Reszta</h3>
    <ul class="klist"><li><b>Błonnik:</b> 25–35 g dziennie, czyli warzywa do 2–3 posiłków, owoce, kasze i pełne ziarno.</li>
    <li><b>Woda:</b> ok. 30–40 ml na kg${bw?` (dla Ciebie ok. <b class="num">${fmt(Math.round(bw*0.035*10)/10)} l</b>)`:""}, więcej w upał i przy treningu. Mocz ma być jasnożółty.</li>
    <li><b>Kalorie z makro:</b> 1 g białka i węgli to 4 kcal, 1 g tłuszczu to 9 kcal, a 1 g alkoholu to 7 kcal.</li></ul>`,
  which:`<h2>Masa czy redukcja?</h2>
    <p>Decyduje o tym głównie to, ile masz tłuszczu, jak długo trenujesz i na jakim etapie jesteś teraz, a nie sama waga.</p>
    <h3>Szybki test</h3>
    <div class="kbox stack" style="gap:10px" id="wq">
      ${[["belly","Jak wygląda Twój brzuch rano, przy dobrym świetle?",[["a","Widać wyraźnie mięśnie brzucha"],["b","Widać zarys mięśni brzucha"],["c","Płaski, ale bez zarysu mięśni"],["d","Widać „oponkę”, wystaje"]]],
        ["exp","Jak długo regularnie trenujesz siłowo?",[["a","Mniej niż rok"],["b","1–3 lata"],["c","Ponad 3 lata"]]],
        ["now","Na jakim etapie jesteś teraz?",[["a","Właśnie kończę redukcję"],["b","Od dawna jestem na masie"],["c","Nic szczególnego / utrzymanie"],["d","Wracam po dłuższej przerwie"]]],
        ["goal","Co jest dla Ciebie ważniejsze w najbliższych miesiącach?",[["a","Więcej mięśni i siły"],["b","Szczuplejsza, bardziej widoczna sylwetka"]]]
      ].map(([id,q,opts])=>`<div><div style="font-weight:600;margin-bottom:6px">${q}</div><div class="chips">${opts.map(([v,l])=>`<button data-act="wq" data-q="${id}" data-v="${v}" aria-pressed="${(wqA||{})[id]===v}">${l}</button>`).join("")}</div></div>`).join("")}
      ${whichResult()}
    </div>
    <h3>Jak ocenić, ile masz tłuszczu (mężczyźni, orientacyjnie)</h3>
    <ul class="klist"><li><b>ok. 8–10%:</b> wyraźny „kaloryfer”, widoczne żyły na brzuchu i rękach, twarz szczupła. Trudno tu długo wytrzymać, to raczej poziom „na zdjęcia”.</li>
    <li><b>ok. 11–13%:</b> widać zarys mięśni brzucha, zwłaszcza górnych, żyły na przedramionach. <b>Najlepszy moment na start masy.</b></li>
    <li><b>ok. 14–17%:</b> brzuch płaski, bez zarysu mięśni, lekka miękkość na bokach. Można iść w masę spokojnie albo w krótki mini-cut.</li>
    <li><b>ok. 18–22%:</b> widoczny brzuszek i boczki, zanika linia szczęki. Rozsądniej zacząć od redukcji.</li>
    <li><b>powyżej ok. 22%:</b> najpierw redukcja, bez wątpliwości.</li></ul>
    <p class="note">Wagi z pomiarem tłuszczu (bioimpedancja) potrafią się mylić o kilka procent. Lepiej porównywać zdjęcia i obwód pasa.</p>
    <h3>Typowe sytuacje</h3>
    <div class="kgrid">
      ${kBox(`<b>„Skinny fat”</b>: mało mięśni, ale miękki brzuch. Zamiast głodówki zero kaloryczne albo lekki deficyt (ok. 200 kcal), wysokie białko i porządny trening siłowy. Sylwetka poprawi się w obie strony naraz.`)}
      ${kBox(`<b>Początkujący (do roku)</b>: mięśnie rosną nawet przy małej nadwyżce albo na zerze. Nie trzeba dużej masy. Wystarczy +100–200 kcal albo rekompozycja.`)}
      ${kBox(`<b>Średniozaawansowany (1–3 lata+) i szczupły</b>: klasyczne etapy. Masa 4–8 miesięcy, potem redukcja albo mini-cut i znowu masa.`)}
      ${kBox(`<b>Powrót po przerwie</b>: przez pierwsze 1–3 miesiące siła i mięśnie wracają szybko („pamięć mięśniowa”). Najlepiej na zerze albo lekkiej nadwyżce.`)}
      ${kBox(`<b>Długo na masie i coraz więcej tłuszczu</b>: mini-cut 3–6 tygodni, a potem z powrotem do masy.`)}
    </div>
    <h3>Jak zaplanować rok</h3>
    <ul class="klist"><li>Przykładowy rytm dla kogoś szczupłego po 2+ latach: <b>masa ok. 6 miesięcy → mini-cut ok. 4–6 tygodni → masa dalej</b>, albo masa → redukcja 8–12 tygodni przed latem.</li>
    <li>Między redukcją a masą zawsze 2–4 tygodnie na zerze kalorycznym.</li>
    <li>Nie zmieniaj kierunku przez chwilowy spadek motywacji. Oceniaj co 4 tygodnie na podstawie zdjęć, pasa i siły.</li></ul>
    <h3>Sygnały, że czas zmienić etap</h3>
    <ul class="klist"><li><b>Kończ masę,</b> gdy pas rośnie szybciej niż ok. 1 cm na kilogram, zniknął zarys brzucha albo źle czujesz się w swoim ciele.</li>
    <li><b>Kończ redukcję,</b> gdy osiągnąłeś cel, siła wyraźnie spada przez 3+ tygodnie, masz ciągłe zmęczenie i zły sen albo redukcja trwa już ponad ok. 16 tygodni (wtedy przynajmniej przerwa na zero).</li></ul>
    ${kBox(`<b>U Ciebie:</b> końcówka redukcji, potem 2–4 tygodnie na zerze i spokojna masa (ok. +0,15–0,2 kg/tydz.). Dokładnie tak, jak jest ustawione w dzienniku.`)}`,
  bulk:`<h2>Masa: jak ją robić</h2>
    ${phaseBox("bulk")}
    <h3>Kalorie i tempo</h3>
    <ul class="klist"><li><b>Nadwyżka 200–300 kcal</b> ponad zero kaloryczne, tak zwana czysta masa. Większa nadwyżka nie buduje szybciej mięśni, tylko szybciej odkłada tłuszcz.</li>
    <li><b>Tempo:</b> ok. 0,25–0,4% masy ciała na tydzień. Po 2+ latach treningu raczej dolna granica. Miesięcznie to realnie 0,5–1 kg, z czego część to woda i glikogen.</li>
    <li><b>Korekty co 2 tygodnie:</b> gdy średnia waga stoi, dodaj 100–150 kcal. Gdy rośnie wyraźnie szybciej niż tempo, odejmij 100 kcal.</li>
    <li>Pierwszy tydzień masy po redukcji: waga może skoczyć o 0,5–1 kg przez wodę i glikogen. To normalne, nie panikuj.</li></ul>
    <h3>Makro</h3>
    <ul class="klist"><li>Białko 1,6–2,2 g/kg. Nie trzeba więcej niż na redukcji.</li>
    <li>Tłuszcz 20–30% kalorii. Nadwyżkę najlepiej „dokładać” węglami, bo to one dają energię na mocniejsze treningi.</li></ul>
    <h3>Trening</h3>
    <ul class="klist"><li><b>Priorytet to progresja:</b> więcej ciężaru albo powtórzeń z tygodnia na tydzień. Masa bez progresji to zwykłe tycie.</li>
    <li>Objętość możesz zwiększać stopniowo, np. o 1 serię na partię co kilka tygodni, jeśli regeneracja jest dobra.</li>
    <li>Serie kończ 1–2 powtórzenia przed upadkiem. Co 6–8 tygodni zrób tydzień lżej (deload).</li>
    <li>Kroki utrzymuj, np. 7–10 tys. Pomagają kontrolować tłuszcz i apetyt.</li></ul>
    <h3>Jedzenie w praktyce</h3>
    <ul class="klist"><li>Gdy brakuje apetytu, dołóż kalorie w łatwej formie: płatki z mlekiem, masło orzechowe, soki, ryż zamiast ziemniaków, większe porcje węgli wokół treningu.</li>
    <li>Nadal 80% jedzenia z „normalnych” produktów. Masa to nie wymówka na fast foody codziennie.</li></ul>
    <h3>Kiedy kończyć</h3>
    <ul class="klist"><li>Gdy obwód w pasie rośnie szybciej niż ok. 1 cm na każdy przybrany kilogram albo zniknął zarys brzucha. Wtedy mini-cut albo redukcja.</li>
    <li>Zwykle po 4–8 miesiącach. Potem mini-cut albo krótka redukcja i kolejny etap masy.</li></ul>
    <h3>Najczęstsze błędy</h3>
    <ul class="klist"><li>Za duża nadwyżka („brudna masa”) i po 3 miesiącach potrzeba 3 miesięcy redukcji.</li><li>Brak zapisywania treningów i jedzenia, czyli brak kontroli, co działa.</li><li>Zbyt krótka masa. Mięśnie rosną miesiącami, nie tygodniami.</li></ul>`,
  cut:`<h2>Redukcja: jak ją robić</h2>
    ${phaseBox("cut")}
    <h3>Kalorie i tempo</h3>
    <ul class="klist"><li><b>Deficyt 300–500 kcal</b> poniżej zera kalorycznego.</li>
    <li><b>Tempo:</b> 0,5–1% masy ciała na tydzień. Im jesteś szczuplejszy, tym bliżej dolnej granicy. Na końcówce redukcji lepiej wolniej, a nie szybciej.</li>
    <li><b>Zastój:</b> gdy średnia waga stoi 2 tygodnie (przy dokładnym liczeniu), zabierz 100–150 kcal albo dołóż 2–3 tys. kroków dziennie. Najpierw sprawdź, czy liczysz wszystko: oleje, sosy, napoje, podjadanie.</li>
    <li>Na redukcji zero kaloryczne powoli spada, bo ważysz mniej i mniej się ruszasz bezwiednie. Dlatego od czasu do czasu potrzebne są małe korekty.</li></ul>
    <h3>Ochrona mięśni</h3>
    <ul class="klist"><li>Białko 2–2,4 g/kg. To najważniejsza liczba na redukcji.</li>
    <li><b>Trzymaj ciężary</b> z masy. Mniej serii jest w porządku, mniejsze ciężary nie. Ciężar to sygnał dla mięśni, żeby zostały.</li>
    <li>Nie trenuj do upadku w każdej serii. Na deficycie regeneracja jest słabsza.</li>
    <li>Sen 7–9 h. Przy krótkim śnie traci się więcej mięśni, a mniej tłuszczu.</li></ul>
    <h3>Cardio i kroki</h3>
    <ul class="klist"><li>Kroki (8–12 tys.) to najprostszy sposób na większy deficyt bez męczenia regeneracji.</li>
    <li>Cardio: 2–3 razy w tygodniu po 20–40 min spokojnego tempa (szybki marsz pod górę, rower, orbitrek). Nie rób intensywnych interwałów w dzień nóg.</li></ul>
    <h3>Jedzenie w praktyce</h3>
    <ul class="klist"><li>Duża objętość przy małych kaloriach: warzywa, owoce, chude białko, zupy, skyr. Łatwiej wtedy o sytość.</li>
    <li>Uważaj na płynne kalorie (soki, alkohol, słodkie kawy) i tłuszcz dodawany „na oko”.</li>
    <li>Więcej węgli w dni treningowe, mniej w wolne. Dziennik liczy to automatycznie.</li></ul>
    <h3>Długie redukcje</h3>
    <ul class="klist"><li>Co 8–12 tygodni zrób 1–2 tygodnie na zerze kalorycznym (diet break). Pomaga głowie, hormonom i wydolności.</li>
    <li>Refeed: 1 dzień w tygodniu na zerze, głównie z węgli. Opcjonalnie, gdy treningi mocno siadają.</li></ul>
    <h3>Jak zakończyć</h3>
    <ul class="klist"><li>Wracaj do zera stopniowo, dokładając 100–200 kcal tygodniowo, głównie z węgli.</li>
    <li>Waga podskoczy o 0,5–1 kg od wody i glikogenu. To nie tłuszcz. Patrz na średnią z 7 dni.</li></ul>
    <h3>Najczęstsze błędy</h3>
    <ul class="klist"><li>Za duży deficyt i utrata siły oraz mięśni.</li><li>Obcinanie białka razem z kaloriami.</li><li>Ocenianie efektów po jednym ważeniu zamiast po trendzie.</li></ul>`,
  mini:`<h2>Mini-cut</h2>
    ${phaseBox("mini")}
    <p>To krótka, dość mocna redukcja wstawiona w trakcie masy, gdy nazbierało się za dużo tłuszczu, a nie chcesz kończyć całego okresu budowania.</p>
    <h3>Zasady</h3>
    <ul class="klist"><li><b>Czas:</b> 3–6 tygodni, nie dłużej. Dłużej to już zwykła redukcja i lepiej ją zrobić wolniej.</li>
    <li><b>Deficyt:</b> 500–750 kcal, tempo ok. 0,75–1% masy ciała na tydzień.</li>
    <li><b>Białko wysoko:</b> 2,2–2,6 g/kg, bo przy dużym deficycie mięśnie potrzebują więcej ochrony.</li>
    <li><b>Tłuszcz:</b> nie niżej niż ok. 0,6 g/kg nawet przez te kilka tygodni.</li>
    <li><b>Trening:</b> te same ciężary, można zmniejszyć liczbę serii o ok. ⅓. Bez nowych rekordów, cel to utrzymać siłę.</li>
    <li><b>Kroki:</b> 10–12 tys. dziennie pomagają zrobić deficyt bez skrajnego cięcia jedzenia.</li></ul>
    <h3>Kiedy go zrobić</h3>
    <ul class="klist"><li>Gdy pas urósł wyraźnie szybciej niż waga albo zniknął zarys brzucha.</li>
    <li>Gdy masa trwa już długo i chcesz „oczyścić” sylwetkę przed kolejnym etapem.</li>
    <li>Przed ważnym wydarzeniem, np. wakacjami, jeśli jesteś w trakcie masy.</li></ul>
    <h3>Po mini-cucie</h3>
    <ul class="klist"><li>Wróć od razu do zera kalorycznego, a po tygodniu do nadwyżki masowej.</li>
    <li>Waga skoczy o 0,5–1 kg od wody i glikogenu. To normalne.</li></ul>
    ${kBox("Mini-cut ma sens tylko wtedy, gdy potem wracasz do masy. Jako główny sposób chudnięcia lepiej sprawdza się zwykła, spokojniejsza redukcja.")}`,
  zero:`<h2>Zero kaloryczne</h2>
    ${phaseBox("zero")}
    <p>Zero kaloryczne to liczba kalorii, przy której waga stoi w miejscu. Składa się z:</p>
    <ul class="klist"><li><b>Podstawowej przemiany materii</b> (ok. 60–70%): oddychanie, serce, mózg.</li>
    <li><b>Codziennej aktywności poza treningiem</b> (NEAT): kroki, praca, wiercenie się. To najbardziej zmienna część, od 200 do nawet 1000 kcal.</li>
    <li><b>Trawienia</b> (ok. 10%). Białko „kosztuje” najwięcej.</li>
    <li><b>Treningu:</b> przy siłowni zwykle 200–400 kcal na sesję.</li></ul>
    <h3>Jak je poznać</h3>
    <ul class="klist"><li>Kalkulator daje punkt startowy z dokładnością ok. ±10%.</li>
    <li>Prawdziwą wartość da się poznać po 2–3 tygodniach: średnie kalorie + zmiana średniej wagi. Dziennik liczy to w Podsumowanie → Waga → „Cel wagi i kalorie”.</li>
    <li>Zero zmienia się w czasie: spada, gdy chudniesz i mniej się ruszasz, a rośnie, gdy przybierasz albo więcej chodzisz.</li></ul>
    <h3>Kiedy jeść na zero</h3>
    <ul class="klist"><li><b>Po redukcji,</b> przez 2–4 tygodnie przed masą. Organizm się stabilizuje, a Ty uczysz się nowej wagi.</li>
    <li><b>Jako przerwa od diety</b> (diet break) w długiej redukcji.</li>
    <li><b>Rekompozycja,</b> czyli jednoczesne budowanie mięśni i spalanie tłuszczu. Działa u początkujących, po powrocie po przerwie i przy wysokim białku (ok. 2 g/kg). U zaawansowanych idzie bardzo wolno i lepiej działają osobne etapy masy i redukcji.</li></ul>
    <h3>Jak to wygląda w praktyce</h3>
    <ul class="klist"><li>Waga i tak będzie się wahać o ±1 kg. Patrz na średnią z 7 dni. Jeśli przez 2 tygodnie trzyma się w granicy ±0,5 kg, jesteś na zerze.</li>
    <li>Trening normalnie, z progresją. Na zerze siła zwykle wraca po redukcji.</li></ul>`,
  food:`<h2>Źródła makroskładników</h2>
    <p>Wartości orientacyjne na 100 g produktu. Przydają się, gdy szukasz zamiennika, np. czym zastąpić kurczaka albo ryż. Konkretne produkty różnią się w zależności od marki.</p>
    <details class="kdet"><summary><h3>Białko</h3></summary>

    <details class="kdet"><summary><h3>Węglowodany</h3></summary>

  supp:`<h2>Suplementy</h2>
    <p>Suplementy to ostatnie kilka procent efektu. Najpierw kalorie, białko, trening i sen.</p>
    <h3>Najlepiej przebadane</h3>
    <ul class="klist"><li><b>Kreatyna (monohydrat):</b> 3–5 g dziennie, codziennie, o dowolnej porze, także w dni wolne. Najlepiej przebadany suplement na siłę i masę mięśniową. Na początku może dodać 0,5–1 kg wody w mięśniach i to nie jest tłuszcz.</li>
    <li><b>Kofeina:</b> kawa albo tabletka ok. 30–60 min przed treningiem poprawia siłę i wydolność. Nie bierz jej po ok. 14–15, bo psuje sen.</li>
    <li><b>Odżywka białkowa:</b> to po prostu jedzenie w proszku. Przydaje się, gdy trudno dobić białko z posiłków.</li></ul>
    <h3>Mogą pomóc</h3>
    <ul class="klist"><li><b>Cytrulina (jabłczan cytruliny):</b> zwykle 6–8 g ok. 30–60 min przed treningiem. U części osób daje trochę więcej powtórzeń w seriach i lepszą „pompę”. Efekt jest mniejszy i mniej pewny niż przy kreatynie.</li>
    <li><b>Beta-alanina:</b> pomaga przy dłuższych seriach (powyżej ok. 60 s). Przy 5×5 daje niewiele. Mrowienie skóry po niej jest niegroźne.</li>
    <li><b>Elektrolity</b> (sód, potas, magnez) przy dużym poceniu, cardio w upale albo redukcji z małą ilością soli.</li></ul>
    <h3>Witaminy i minerały warte uwagi</h3>
    <details class="kdet"><summary><h3>Witamina D</h3></summary><ul class="klist">
      <li><b>Za co odpowiada:</b> wchłanianie wapnia i fosforu, mocne kości, praca mięśni i układ odpornościowy. Wpływa też na samopoczucie i poziom energii.</li>
      <li><b>Przy niedoborze:</b> zmęczenie, słabsza odporność, gorszy nastrój, bóle mięśni, a długofalowo słabsze kości.</li>
      <li><b>Kiedy suplementować:</b> w Polsce od października do kwietnia, bo słońca jest za mało. Dawkę najlepiej dobrać do wyniku badania 25(OH)D. Przyjmuj ją z posiłkiem z tłuszczem.</li></ul></details>
    <details class="kdet"><summary><h3>Omega-3 (EPA i DHA)</h3></summary><ul class="klist">
      <li><b>Za co odpowiadają:</b> serce i naczynia krwionośne, obniżanie trójglicerydów, praca mózgu i wzroku, wyciszanie stanów zapalnych.</li>
      <li><b>W treningu:</b> mogą trochę zmniejszać zakwasy i wspierać regenerację stawów.</li>
      <li><b>Kiedy suplementować:</b> gdy jesz tłuste ryby morskie (łosoś, makrela, śledź) rzadziej niż 2 razy w tygodniu.</li></ul></details>
    <details class="kdet"><summary><h3>Magnez</h3></summary><ul class="klist">
      <li><b>Za co odpowiada:</b> praca mięśni i nerwów, produkcja energii, synteza białek, sen i radzenie sobie ze stresem.</li>
      <li><b>Przy niedoborze:</b> skurcze mięśni, drganie powieki, zmęczenie, gorszy sen, rozdrażnienie.</li>
      <li><b>Kiedy suplementować:</b> gdy jesz mało kasz, orzechów, pestek, strączków i zielonych warzyw albo mocno się pocisz. Najlepiej wieczorem, w formie cytrynianu albo diglicynianu.</li></ul></details>
    <details class="kdet"><summary><h3>Cynk</h3></summary><ul class="klist">
      <li><b>Za co odpowiada:</b> odporność, gojenie się ran, produkcja testosteronu, płodność, zdrowa skóra, włosy i paznokcie, smak i węch.</li>
      <li><b>Przy niedoborze:</b> częste infekcje, słabsza regeneracja, wypadanie włosów, obniżony testosteron.</li>
      <li><b>Kiedy suplementować:</b> przy mało zróżnicowanej diecie (mało mięsa, jaj, pestek) albo intensywnym treningu i dużym poceniu. Bez przesady, bo nadmiar blokuje wchłanianie miedzi.</li></ul></details>
    <details class="kdet"><summary><h3>Witamina B12</h3></summary><ul class="klist">
      <li><b>Za co odpowiada:</b> tworzenie czerwonych krwinek, praca układu nerwowego, produkcja energii i DNA.</li>
      <li><b>Przy niedoborze:</b> anemia, zmęczenie, mrowienie dłoni i stóp, problemy z koncentracją.</li>
      <li><b>Kiedy suplementować:</b> konieczna przy diecie wegańskiej. Przy zwykłej diecie z mięsem, jajami i nabiałem zwykle niepotrzebna.</li></ul></details>
    <details class="kdet"><summary><h3>Żelazo</h3></summary><ul class="klist">
      <li><b>Za co odpowiada:</b> transport tlenu we krwi (hemoglobina) i w mięśniach (mioglobina), a przez to wydolność i poziom energii.</li>
      <li><b>Przy niedoborze:</b> zmęczenie, zadyszka, bladość, słabsza wydolność w treningu i cardio.</li>
      <li><b>Kiedy suplementować:</b> tylko przy potwierdzonym niedoborze (ferrytyna, morfologia). U mężczyzn niedobory są rzadkie, a nadmiar żelaza szkodzi.</li></ul></details>
    <details class="kdet"><summary><h3>Witamina C</h3></summary><ul class="klist">
      <li><b>Za co odpowiada:</b> odporność, produkcja kolagenu (ścięgna, więzadła, skóra), wchłanianie żelaza i ochrona komórek przed stresem oksydacyjnym.</li>
      <li><b>Kiedy suplementować:</b> zwykle nie trzeba. Wystarczą owoce i warzywa (papryka, cytrusy, kiwi, natka). Duże dawki tuż po treningu mogą nawet osłabiać adaptację.</li></ul></details>
    <details class="kdet"><summary><h3>Potas i sód (elektrolity)</h3></summary><ul class="klist">
      <li><b>Za co odpowiadają:</b> gospodarka wodna, ciśnienie krwi, skurcze mięśni i przewodzenie nerwowe.</li>
      <li><b>W treningu:</b> przy dużym poceniu ich brak daje osłabienie, skurcze i bóle głowy. Potas znajdziesz w ziemniakach, bananach, pomidorach i strączkach.</li></ul></details>
    ${kBox("Najrozsądniej raz w roku zrobić podstawowe badania krwi (morfologia, witamina D, ferrytyna, lipidogram) i uzupełniać to, czego faktycznie brakuje.")}
    <h3>Szkoda pieniędzy</h3>
    <ul class="klist"><li>„Spalacze tłuszczu”, BCAA przy wystarczającej ilości białka, większość „boosterów testosteronu” i gainery (to tylko drogie węgle).</li></ul>
    ${kBox("Jeśli przyjmujesz leki albo masz problemy zdrowotne, skonsultuj suplementy z lekarzem.")}`,
  train:`<h2>Zasady treningu siłowego</h2>
    <p>To ogólne zasady, które działają w każdym planie. Konkretne liczby dla Twojego planu (serie, powtórzenia, skoki ciężaru) masz w zakładce Plan.</p>
    <h3>1. Progresja: najważniejsza zasada</h3>
    <ul class="klist"><li>Mięśnie rosną, gdy stopniowo robisz więcej: dokładasz ciężar, powtórzenia albo serie.</li>
    <li>Najprościej tak: gdy zrobisz górną granicę powtórzeń we wszystkich seriach, następnym razem dokładasz ciężar. Dziennik podpowiada to przy każdym ćwiczeniu.</li>
    <li>Na redukcji celem jest utrzymanie ciężarów, a nie bicie rekordów.</li></ul>
    <h3>2. Intensywność, czyli jak blisko upadku</h3>
    <ul class="klist"><li>Kończ większość serii 1–3 powtórzenia przed upadkiem mięśniowym (RIR 1–3). Tak rosną mięśnie, a zmęczenie jest pod kontrolą.</li>
    <li>Do upadku możesz iść w ostatniej serii ćwiczeń izolowanych (wznosy, biceps), a nie w przysiadach czy martwym ciągu.</li></ul>
    <h3>3. Objętość: ile serii</h3>
    <ul class="klist"><li>Ok. 10–20 serii tygodniowo na partię mięśniową to zakres, w którym rośnie większość osób.</li>
    <li>Więcej nie zawsze znaczy lepiej. Jeśli siła spada, a Ty jesteś stale zmęczony, jest za dużo.</li>
    <li>Każdą partię warto trenować 2 razy w tygodniu. W FBW 3× w tygodniu to się dzieje samo.</li></ul>
    <h3>4. Zakresy powtórzeń</h3>
    <ul class="klist"><li><b>1–5 powtórzeń:</b> głównie siła (5×5 na bojach).</li>
    <li><b>6–12:</b> budowa masy, najbardziej „uniwersalny” zakres.</li>
    <li><b>12–20+:</b> też buduje mięśnie, dobre w izolacjach (wznosy, łydki, brzuch) i mniej obciąża stawy.</li>
    <li>Mięśnie rosną w całym zakresie ok. 5–30 powtórzeń, jeśli seria jest blisko upadku.</li></ul>
    <h3>5. Przerwy między seriami</h3>
    <ul class="klist"><li>Ciężkie ćwiczenia wielostawowe: 2–5 min. Krótsze przerwy obniżają ciężar w kolejnych seriach.</li>
    <li>Izolacje: 60–90 s.</li></ul>
    <h3>6. Technika przed ciężarem</h3>
    <ul class="klist"><li>Pełny zakres ruchu i kontrolowane opuszczanie (ok. 2 s). Połowiczne powtórzenia z dużym ciężarem budują gorzej i częściej kończą się kontuzją.</li>
    <li>Nagrywaj czasem serię z boku, żeby sprawdzić technikę. Opisy są w Wiedza → Technika ćwiczeń.</li></ul>
    <h3>7. Rozgrzewka</h3>
    <ul class="klist"><li>5 min lekkiego ruchu (bieżnia, rower), potem 2–4 serie dochodzące w pierwszym ćwiczeniu, np. 40%, 60% i 80% ciężaru roboczego, z coraz mniejszą liczbą powtórzeń.</li></ul>
    <h3>8. Deload i regeneracja</h3>
    <ul class="klist"><li>Co 6–8 tygodni tydzień lżej: te same ćwiczenia, ok. 50–60% ciężaru albo połowa serii.</li>
    <li>Wcześniej, jeśli przez 2 tygodnie siła spada, bolą stawy albo brakuje motywacji.</li></ul>
    <h3>9. Zastój</h3>
    <ul class="klist"><li>Najpierw sprawdź sen, kalorie i białko. Większość zastojów bierze się stamtąd, a nie z planu.</li>
    <li>Potem: zmniejsz ciężar o ok. 10% i buduj od nowa, zmień zakres powtórzeń albo wymień ćwiczenie na podobny wariant (przycisk „⇄ Zamień” w treningu).</li></ul>
    <h3>10. Regularność</h3>
    <ul class="klist"><li>Plan robiony regularnie przez rok da więcej niż „idealny” plan zmieniany co miesiąc. Kalendarz w Podsumowanie → Siła pokazuje, jak Ci idzie.</li></ul>`,
  sleep:`<h2>Sen i regeneracja</h2>
    <ul class="klist"><li><b>7–9 godzin snu.</b> Przy krótkim śnie na redukcji traci się więcej mięśni, a mniej tłuszczu, rośnie też głód.</li>
    <li>Stałe pory snu, także w weekend. Chłodna i ciemna sypialnia, telefon odłożony 30–60 min przed snem.</li>
    <li>Kofeina najpóźniej 8 godzin przed snem, a alkohol mocno psuje jakość snu i regenerację.</li>
    <li>Między treningami tej samej partii zostaw ok. 48 godzin. Przy Twoim planie pon/śr/sob to się zgadza.</li>
    <li>Gdy ciężary spadają przez 2 tygodnie, a Ty jesteś stale zmęczony, zrób tydzień lżej (deload) i sprawdź sen oraz kalorie.</li></ul>`
  };

const CUST=(()=>{
const f=n=>(+n).toFixed(1), L=(a,b,t)=>a+(b-a)*t, P=(a,b,t)=>[L(a[0],b[0],t),L(a[1],b[1],t)];
const limb=(pts,w=7)=>`<polyline points="${pts.map(p=>f(p[0])+","+f(p[1])).join(" ")}" class="fg-halo" stroke-width="${w+3}" fill="none"/><polyline points="${pts.map(p=>f(p[0])+","+f(p[1])).join(" ")}" class="fg-l" stroke-width="${w}" fill="none" stroke-linejoin="round"/>`;

let techSel=null, techView="plan", techGroup="Wszystkie", techQ="";
function techDetail(id,label){
  const t=TECH[id]; if(!t) return "";
  const inPlan=[];for(const d of Object.keys(PLAN))for(const e of PLAN[d])if(e.id===id||(TECH[e.id]===t))inPlan.push(d);
  const pe=Object.values(PLAN).flat().find(e=>e.id===id||TECH[e.id]===t);
  const libName=TECH_LIB.flatMap(g=>g[1]).find(x=>x[0]===id)?.[1];
  const name=(techView==="plan"&&pe?pe.name:null)||libName||pe?.name||id;
  const group=TECH_LIB.find(g=>g[1].some(x=>x[0]===id))?.[0];
  const sub=inPlan.length?`W Twoim planie: trening ${[...new Set(inPlan)].join(" i ")}${pe?` · ${pe.time?pe.sets+"× "+pe.lo+"–"+pe.hi+" s":pe.sets+"×"+(pe.lo===pe.hi?pe.hi:pe.lo+"–"+pe.hi)}`:""}`:(group?`${group} · spoza planu`:"");
  return `<div class="card stack" id="tech-detail">
    <div><div class="label">${esc(sub)}</div><h2>${esc(name)}</h2></div>
    ${FG.html(id,t.main,t.sec)}
    <div class="tech-grid">
      <div class="stack" style="gap:8px">${bodySVG(t.main,t.sec)}
        <div class="legend"><span><i class="lg main"></i>główne: ${esc(t.main.map(m=>MUSCLE_NAMES[m]).join(", "))}</span>${t.sec.length?`<span><i class="lg sec"></i>pomocnicze: ${esc(t.sec.map(m=>MUSCLE_NAMES[m]).join(", "))}</span>`:""}</div></div>
      <div class="stack" style="gap:14px">
        <div><h3>Jak wykonać</h3><ol class="steps">${t.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol></div>
        <div><h3>Najczęstsze błędy</h3><ul class="errs">${t.err.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <a class="btn ghost small vidlink" href="https://www.youtube.com/results?search_query=${encodeURIComponent(name+" technika")}" target="_blank" rel="noopener">▶ Zobacz wideo z techniką</a>
      </div>
    </div>
    ${varGuideHTML(id)}${legGuideHTML(id)}
  </div>`;
}
function techLibList(){
  const q=norm(techQ.trim());
  const groups=TECH_LIB.filter(g=>techGroup==="Wszystkie"||g[0]===techGroup).map(([g,l])=>[g,l.filter(x=>TECH[x[0]]&&(!q||norm(x[1]+" "+g+" "+TECH[x[0]].main.concat(TECH[x[0]].sec).map(m=>MUSCLE_NAMES[m]).join(" ")).includes(q)))]).filter(g=>g[1].length);
  if(!groups.length) return `<div class="empty">Nie znalazłem takiego ćwiczenia.</div>`;
  return groups.map(([g,l])=>`<div class="stack" style="gap:6px"><span class="label">${g} · ${l.length}</span><div class="chips">${l.map(([id,n])=>`<button data-act="tech-sel" data-id="${id}" aria-pressed="${id===techSel}">${esc(n)}</button>`).join("")}</div></div>`).join("");
}
function renderTech(){ renderTech0(); FG.start(); }
function renderTech0(){
  const el=document.getElementById("view-tech"); if(!el) return;
  const chooser=`<div class="kgridtopics">${KNOW.map(([k,t])=>`<button class="ktopic" data-act="know" data-k="${k}" aria-pressed="${knowTopic===k}"><b>${t}</b></button>`).join("")}</div>`;
  if(knowTopic!=="tech"){ el.innerHTML=chooser+knowArticle(knowTopic); return; }
  const planEx=[];const seen=new Set();
  for(const d of Object.keys(PLAN)) for(const e of PLAN[d]){ if(!TECH[e.id]) continue; planEx.push({...e,day:d}); }
  if(!techSel) techSel=planEx[0].id;
  const total=new Set(TECH_LIB.flatMap(g=>g[1].map(x=>x[0])).filter(id=>TECH[id])).size;
  const sw=`<div class="qtabs" role="tablist"><button role="tab" data-act="tech-view" data-v="plan" aria-selected="${techView==="plan"}">Mój plan</button><button role="tab" data-act="tech-view" data-v="lib" aria-selected="${techView==="lib"}">Wszystkie ćwiczenia (${total})</button></div>`;
  if(techView==="plan"){
    el.innerHTML=chooser+sw+Object.keys(PLAN).map(d=>`<div class="stack" style="gap:6px"><span class="label">Trening ${d}</span><div class="chips">${PLAN[d].filter(e=>TECH[e.id]).map(e=>`<button data-act="tech-sel" data-id="${e.id}" aria-pressed="${e.id===techSel}">${esc(e.name)}</button>`).join("")}</div></div>`).join("")+techDetail(techSel);
  }else{
    el.innerHTML=chooser+sw+techDetail(techSel)+`<div class="card stack">
      <span class="qs-wrap"><input id="tech-q" type="search" placeholder="Szukaj ćwiczenia, np. wiosło, łydki, triceps" value="${esc(techQ)}" autocomplete="off"><button type="button" class="qs-x" id="tech-qx" aria-label="Wyczyść wyszukiwanie" ${techQ?"":"hidden"}>×</button></span>
      <div class="chips">${["Wszystkie",...TECH_LIB.map(g=>g[0])].map(g=>`<button data-act="tech-group" data-g="${g}" aria-pressed="${g===techGroup}">${g}</button>`).join("")}</div>
      <div class="stack" id="tech-list" style="gap:14px">${techLibList()}</div></div>`;
  }
}
document.addEventListener("click",ev=>{ if(ev.target.closest("#tech-qx")){ techQ=""; const i=document.getElementById("tech-q"); if(i){i.value="";i.focus();} ev.target.closest("#tech-qx").hidden=true; const l=document.getElementById("tech-list"); if(l) l.innerHTML=techLibList(); } });
document.addEventListener("input",ev=>{ if(ev.target.id==="tech-q"){ techQ=ev.target.value; const x=document.getElementById("tech-qx"); if(x) x.hidden=!techQ; const l=document.getElementById("tech-list"); if(l) l.innerHTML=techLibList(); } });
document.addEventListener("click",ev=>{
  const b=ev.target.closest('[data-act="tech-sel"],[data-act="tech-open"],[data-act="tech-view"],[data-act="tech-group"],[data-act="know"],[data-act="wq"],[data-act="ang"],[data-act="legvar"],[data-act="varpick"]'); if(!b) return;
  if(b.dataset.act==="varpick"||b.dataset.act==="legvar"){ techSel=b.dataset.v; varPick={row:null,press:null}; legPick={press:null,bulg:null}; knowTopic="tech"; renderTech(); const d=document.getElementById("tech-detail"); if(d){ d.scrollIntoView({behavior:"smooth",block:"start"}); } return; }

  if(b.dataset.act==="ang"){ angPick[b.dataset.kind]=+b.dataset.d; const y=b.getBoundingClientRect().top; renderTech(); const nb=document.querySelector(`[data-act="ang"][data-kind="${b.dataset.kind}"][data-d="${b.dataset.d}"]`); if(nb) window.scrollBy(0,nb.getBoundingClientRect().top-y); return; }
  const a=b.dataset.act;
  if(a==="wq"){ wqA={...wqA,[b.dataset.q]:b.dataset.v}; renderTech(); return; }
  if(a==="know"){ knowTopic=b.dataset.k; renderTech(); document.getElementById("view-tech").scrollIntoView({block:"start"}); window.scrollBy(0,-10); return; }
  if(a==="tech-view"){ techView=b.dataset.v; renderTech(); return; }
  if(a==="tech-group"){ techGroup=b.dataset.g; renderTech(); return; }
  if(a==="tech-sel"&&!b.dataset.lib){angPick={row:null,press:null};legPick={press:null,bulg:null};varPick={row:null,press:null};} if(a==="tech-sel"&&b.dataset.lib){legPick={press:null,bulg:null};varPick={row:null,press:null};}
  techSel=b.dataset.id; if(b.dataset.lib){techView="lib";techGroup="Wszystkie";techQ="";knowTopic="tech";angPick={row:null,press:null};}
  if(a==="tech-open"){ techView="plan"; knowTopic="tech"; renderTech(); document.querySelector('[data-tab="tech"]').click(); window.scrollTo({top:0}); return; }
  renderTech();
  const d=document.getElementById("tech-detail"); if(d) d.scrollIntoView({behavior:"smooth",block:"start"});
});

document.addEventListener("touchstart",()=>{},{passive:true}); // iOS: włącza efekt :active na dotyk
renderTech();
/* po powrocie do aplikacji: ta sama zakładka, sekcja i miejsce na stronie (jeśli wyszedłeś w ciągu ostatnich 6 h) */
const LSV="sila-5x5-view";
function saveView(){ try{ localStorage.setItem(LSV,JSON.stringify({tab:state.tab,progSec,knowTopic,techView,techSel,techGroup,y:Math.round(window.scrollY),at:Date.now()})) }catch(e){} }
(()=>{let v=null;try{v=JSON.parse(localStorage.getItem(LSV)||"null")}catch(e){}
  if(v&&v.tab&&Date.now()-v.at<6*3600e3){
    if(v.progSec) progSec=v.progSec; if(v.knowTopic) knowTopic=v.knowTopic; if(v.techView) techView=v.techView; if(v.techSel&&TECH[v.techSel]) techSel=v.techSel; if(v.techGroup) techGroup=v.techGroup;
    renderTech(); document.querySelector(`[data-tab="${v.tab}"]`)?.click();
    let moved=false; const mark=()=>{moved=true}; ["touchstart","wheel","keydown"].forEach(e=>window.addEventListener(e,mark,{once:true,passive:true}));
    for(const ms of [60,400,1200,2500]) setTimeout(()=>{ if(!moved&&v.y) window.scrollTo(0,v.y); },ms);
    return; }
  const d=new Date(),wd=d.getDay(),h=d.getHours();const trainDay=[1,3,6].includes(wd);const t=(trainDay&&h>=6&&h<22)?"log":"food";if(t!=="log")document.querySelector(`[data-tab="${t}"]`)?.click();})();
let svT=null; window.addEventListener("scroll",()=>{clearTimeout(svT);svT=setTimeout(saveView,300)},{passive:true});
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") saveView(); });
window.addEventListener("pagehide",saveView);
document.addEventListener("click",()=>setTimeout(saveView,50));
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&state.tab!=="food"&&!document.getElementById("view-log").hidden&&syncPlanned()) renderLog(); });
renderAll();
initStore();
