<!doctype html><html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D1015">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dziennik">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Dziennik treningowy</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0D1015; --surface:#161A21; --surface2:#202630; --line:#2A313C;
  --ink:#EEF1F5; --muted:#98A2B3; --accent:#C8F560; --accent-ink:#0D1015;
  --good:#4ADE9B; --warn:#FFB547; --bad:#FF6B5A;
  --m-kcal:#C8F560; --m-p:#FF8A73; --m-c:#7FB2FF; --m-f:#FFC857;
  --a:#C8F560; --b:#FF8A73; --c:#7FB2FF;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:20px calc(110px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:40px;text-transform:uppercase}
h2{font-size:26px;text-transform:uppercase}
h3{font-size:20px}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.status{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:600;color:var(--muted)}
.pill.deload{background:var(--warn);color:#0D1015}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .dot{background:var(--good)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 12px rgba(0,0,0,.06)}
nav.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;font-weight:600;padding:6px 2px;border-radius:10px;cursor:pointer;min-height:52px;justify-content:center}
nav.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button[aria-selected="true"]{color:var(--accent)}
nav.tabbar button[aria-selected="true"] svg{stroke-width:2.4}
@media (min-width:900px){nav.tabbar{left:50%;right:auto;transform:translateX(-50%);width:600px;bottom:12px;border:1px solid var(--line);border-radius:16px;padding-bottom:6px}}
button{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:10px;padding:12px 18px;min-height:44px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--bad);color:#0D1015}
.btn.small{padding:8px 12px;font-size:14px;min-height:38px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.daypick{display:flex;gap:8px}
.daypick button{width:58px;height:58px;border-radius:50%;border:3px solid var(--line);background:var(--surface);font-family:var(--display);font-size:28px;font-weight:700;color:var(--ink);cursor:pointer}
.daypick button[data-d="A"][aria-pressed="true"]{border-color:var(--a);background:var(--a);color:#0D1015}
.daypick button[data-d="B"][aria-pressed="true"]{border-color:var(--b);background:var(--b);color:#0D1015}
.daypick button[data-d="C"][aria-pressed="true"]{border-color:var(--c);background:var(--c);color:#141922}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}
input[type=number]{width:100%;min-width:0;text-align:center;font-variant-numeric:tabular-nums}
.ex{background:var(--surface);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ex-head h3 .scheme{color:var(--muted);font-weight:600;margin-left:6px}
.target{font-size:14px;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted)}
.target b{color:var(--ink)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:5px;text-transform:uppercase;letter-spacing:.04em}
.tag.up{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.tag.hold{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.new{background:var(--surface2);color:var(--muted)}
.sets{display:grid;grid-template-columns:36px 64px minmax(0,1fr) minmax(0,1fr);gap:6px 8px;align-items:center;max-width:420px}
.sets .lastset{font-size:14px;color:var(--muted);text-align:center;white-space:nowrap;background:var(--surface2);border-radius:8px;padding:10px 2px}
.exfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:center;border-top:1px solid var(--line);padding-top:8px}
.recline{font-size:14px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;font-weight:600}
.sets .n{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.note{font-size:13px;color:var(--muted)}
.savebar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.toast{font-weight:600;color:var(--good)}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plan-card{background:var(--surface);border-radius:12px;padding:16px;border-top:5px solid var(--a)}
.plan-card.B{border-top-color:var(--b)}.plan-card.C{border-top-color:var(--c)}
.plan-card ol{margin:10px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.plan-card li span{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.week div{background:var(--surface);border-radius:8px;padding:8px 4px;text-align:center;font-size:12px;color:var(--muted)}
.week div b{display:block;font-family:var(--display);font-size:22px;color:var(--ink)}
.week .A b{color:var(--a)}.week .B b{color:var(--b)}.week .C b{color:var(--c)}
.rules{background:var(--surface);border-radius:12px;padding:18px 20px}
.rules dl{margin:0;display:grid;grid-template-columns:minmax(110px,160px) 1fr;gap:10px 18px}
.rules dt{font-family:var(--display);font-size:17px;font-weight:600;text-transform:uppercase}
.rules dd{margin:0;max-width:60ch}
@media (max-width:520px){.rules dl{grid-template-columns:1fr;gap:2px}.rules dd{margin-bottom:10px}h1{font-size:32px}}
.card{background:var(--surface);border-radius:12px;padding:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart{width:100%;height:auto;display:block}
.empty{color:var(--muted);font-size:14px;padding:18px 0;text-align:center}
.hist{display:flex;flex-direction:column;gap:8px}
.hist-item{background:var(--surface);border-radius:10px;padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center}
.hist-item .d{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;font-weight:700;color:#0D1015;background:var(--a)}
.hist-item .d.B{background:var(--b)}.hist-item .d.C{background:var(--c);color:#141922}
.hist-item .sum{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border-radius:10px;padding:12px 14px}
.stat .v{font-family:var(--display);font-size:28px;font-weight:700}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.daynav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.daynav .btn{min-width:42px}
.macros{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.macro .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.macro .v{font-family:var(--display);font-size:26px;font-weight:700}
.macro .of{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.over{background:var(--warn)}
.macro .top{flex-wrap:wrap;column-gap:8px}
.macro .v{white-space:nowrap}
.macro .of{white-space:nowrap}
.macro .over-t{color:var(--warn);font-weight:700}
.bar .lo-mark{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--ink);opacity:.35;border-radius:1px}
.addform{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px 10px;align-items:end}
.addform label{display:flex;flex-direction:column;gap:4px;min-width:0}
.addform .wide{grid-column:span 3}
.addform .mid{grid-column:span 2}
.addform input,.addform select{width:100%;min-width:0}
.addform .per{grid-column:1/-1;font-size:12px;color:var(--muted);margin-bottom:-4px}
@media (max-width:560px){.addform{grid-template-columns:repeat(4,minmax(0,1fr))}.addform .wide{grid-column:1/-1}.addform .mid{grid-column:span 2}}
.meal{background:var(--surface);border-radius:12px;padding:12px 16px}
.meal-sum i{font-style:normal;font-weight:700}
.mtog{width:100%;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;padding:2px 0;display:flex;align-items:baseline;gap:10px}
.mtog:disabled{cursor:default;opacity:1}
.mtog h3{flex:1}
.mtog{flex-wrap:wrap;align-items:center}
.mtog .meal-sum{order:3;flex-basis:100%}
.mtog .chev{order:2}
.chev{color:var(--muted);font-size:14px}
.mhwrap{display:flex;align-items:flex-start;gap:8px}
.mhwrap .mtog{flex:1}
.addmenu{border-top:1px solid var(--line);padding-top:10px;margin-top:8px}
.madd{margin-top:8px;border:1px dashed var(--line);background:transparent;color:var(--accent);font:inherit;font-weight:700;font-size:13px;border-radius:999px;padding:6px 12px;cursor:pointer}
.madd:hover{border-color:var(--accent)}
.meal-empty .meal-head{margin-bottom:0}
.meal-empty h3{opacity:.8}
.ephoto{position:relative;display:inline-flex}
.ephoto img{width:56px;height:56px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ephoto .x{position:absolute;top:-10px;right:-12px;background:var(--surface2);border-radius:999px;padding:0 6px;font-size:16px}
.toolgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tooltile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit}
.tooltile span{font-size:12px;color:var(--muted)}
.tooltile[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.meal{background:var(--surface2)!important}
.meal-head{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.fitem{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.fitem:first-of-type{border-top:0}
.fitem .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.fitem .k{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:4px 8px;border-radius:6px}
.x:hover{background:var(--surface2);color:var(--bad)}
.goals{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.goals label{display:flex;flex-direction:column;gap:4px;width:130px}
.sugg{position:relative}
.sugg-list{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);margin-top:4px;max-height:320px;overflow:auto}
.sugg-list button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:10px 12px;cursor:pointer;border-top:1px solid var(--line)}
.sugg-list button:first-child{border-top:0}
.sugg-list button:hover,.sugg-list button:focus-visible{background:var(--surface2)}
.sugg-list .src{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.qtabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:8px}
.qtabs button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;padding:6px 4px;border-radius:6px;cursor:pointer;font-size:14px}
.qtabs button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.qrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.star{border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--line);padding:2px 4px}
.star.on{color:var(--c)}
.plus{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:6px 10px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.qlist{max-height:380px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-right:4px}
.editgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.editgrid label{display:flex;flex-direction:column;gap:4px;min-width:0}
.editgrid input,.editgrid select{width:100%;min-width:0;max-width:100%;box-sizing:border-box}
.editgrid input[type=date]{-webkit-appearance:none;appearance:none;display:block}
.sumstats{grid-template-columns:repeat(2,minmax(0,1fr))}
.sumstats .v{font-size:24px}
.wtable{width:100%;border-collapse:collapse;font-size:15px}
.wtable th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.wtable td{padding:9px 4px;border-bottom:1px solid var(--line)}
.wtable .r{text-align:right}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.chead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;font-weight:600}
.ccell{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;border-radius:10px;padding:6px 0;cursor:pointer;color:var(--ink);font:inherit;min-height:0}
.ccell:disabled{cursor:default;opacity:.5}
.ccell.today{background:var(--surface2)}
.ccell.sel{outline:2px solid var(--accent);outline-offset:-2px}
.ccell .cnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.cgrid.week .ccell .cnum{font-size:11px}
.cdot{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;font-family:var(--display);font-weight:700;font-size:17px;color:#0D1015}
.cdot.A{background:var(--a)}.cdot.B{background:var(--b)}.cdot.C{background:var(--c);color:#141922}
.cdot.miss{border:2px dashed var(--bad);opacity:.8}
.cdot.plan{border:2px solid var(--line);color:var(--muted)}
.cdot.plA{border-color:var(--a);color:var(--a)}.cdot.plB{border-color:var(--b);color:var(--b)}.cdot.plC{border-color:var(--c);color:var(--c)}
.cdot.none{width:30px;height:30px}
.cdot.mini{width:18px;height:18px;font-size:11px;vertical-align:-4px}
.cpr{position:absolute;bottom:0;left:calc(50% + 8px);line-height:0;background:var(--surface);border-radius:50%;padding:1px}
.kgridtopics{display:flex;flex-wrap:wrap;gap:6px}
.ktopic{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:14px}
.ktopic b{font-weight:600}
.ktopic span{display:none}
.ktopic[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.kart h3{margin-top:10px}
.kart p{margin:0;max-width:65ch}
.klist{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.kbox{background:var(--surface2);border-radius:10px;padding:12px 14px;max-width:65ch}
.kgrid{display:grid;gap:8px}
.kdet{border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.kdet summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between}
.kdet summary::-webkit-details-marker{display:none}
.kdet summary::after{content:"▾";color:var(--muted)}
.kdet[open] summary::after{content:"▴"}
.kdet summary h3{margin:4px 0}
.kdet[open]{padding-bottom:12px}
.kyour{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.kyour-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;margin:8px 0}
.kyour-grid div{display:flex;flex-direction:column}
.kyour-grid b{font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.tech-grid{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:20px;align-items:start}
@media (max-width:620px){.tech-grid{grid-template-columns:1fr}}
.bodymap{width:100%;max-width:250px;height:auto;display:block;margin:0 auto}
.bodymap .m-base{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.bodymap .m-sil{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.bodymap .m-off{fill:color-mix(in srgb,var(--line) 75%,var(--surface2));stroke:var(--surface);stroke-width:.8}.bodymap .m-line{stroke:var(--surface);stroke-width:.8}
.bodymap .m-main{fill:var(--bad);stroke:var(--surface);stroke-width:.8}
.bodymap .m-sec{fill:color-mix(in srgb,var(--bad) 38%,var(--surface2));stroke:var(--surface);stroke-width:.8}
.rowsvg .bm-t,.bodymap .bm-t{font-size:10px;fill:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.rowsvg{width:100%;max-width:360px;height:auto;display:block}.rowfig{display:flex;flex-direction:column;gap:8px}.rowt{font-size:10.5px;fill:var(--ink)}.vidlink{align-self:flex-start;text-decoration:none}
.angp{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.anghd{display:flex;gap:12px;align-items:flex-start}.anghd b{display:block;font-size:15px}.anghd span{font-size:13px;color:var(--muted)}
.angp .angdeg{font-size:26px;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums;flex:none;white-space:nowrap}
.angviews{display:grid;grid-template-columns:1fr 1fr;gap:8px}.angviews figure{margin:0;display:flex;flex-direction:column;gap:2px;align-items:center}

.wk-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wk-t{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.wk-t b{font-size:20px}
.wk-t .note{margin:0;font-size:12px}
.wk-t.good b{color:var(--good)}
.wk-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:110px;align-items:end}
.wk-b{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.wk-col{position:relative;flex:1;width:100%;max-width:28px}
.wk-bar{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 3px 3px;background:var(--line);min-height:2px}
.wk-bar.ok{background:var(--good)}.wk-bar.under{background:var(--m-c)}.wk-bar.over{background:var(--warn)}.wk-bar.none{background:transparent}
.wk-goal{position:absolute;left:-3px;right:-3px;border-top:2px dashed var(--muted);opacity:.7;z-index:1}
.wk-leg{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin:0;font-size:12px}
.wk-leg .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:-6px}
.dot.ok{background:var(--good)}.dot.under{background:var(--m-c)}.dot.over{background:var(--warn)}
.wk-gl{display:inline-block;width:14px;border-top:2px dashed var(--muted);margin-right:-6px}
.fillplan{align-self:flex-start;margin:4px 0 2px}
.ppw{white-space:nowrap;display:flex;align-items:center;gap:4px;margin-top:4px}
.ppw input{width:58px;height:30px;padding:0 4px;text-align:center;font-size:13px}
.exinfo{display:flex;flex-wrap:wrap;gap:6px}
.exinfo span{background:var(--surface2);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted)}
.exinfo b{color:var(--ink)}
.tag.down{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.ex-down{color:var(--bad);font-weight:600}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.35)}
.nextbar[hidden]{display:none}
.nextbar .nb-lbl{display:flex;flex-direction:column;font-size:12px;color:var(--muted);line-height:1.3}
.nextbar .nb-lbl b{color:var(--ink);font-size:14px}
.nextbar .btn{min-width:120px;padding:10px 18px}
.done-card{border:1px solid color-mix(in srgb,var(--good) 45%,transparent)}
.done-top{display:flex;gap:12px;align-items:center}
.done-ic{width:46px;height:46px;border-radius:23px;background:var(--good);color:#0D1015;display:grid;place-items:center;font-size:24px;font-weight:800;flex:none}
.wkses{background:var(--surface2);border-radius:14px;padding:10px 12px}
.wkses.sel{outline:2px solid var(--accent)}
.wkses .fitem{padding:6px 0}
.pa-tog{flex:none;white-space:nowrap}
.pa-foot{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.pa-head.stick{position:sticky;top:calc(env(safe-area-inset-top,0px) + 44px);z-index:5;background:var(--surface);margin:-6px -18px 0;padding:8px 18px;border-bottom:1px solid var(--line)}
.wtimer.long{border-color:color-mix(in srgb,var(--warn) 60%,transparent);background:color-mix(in srgb,var(--warn) 10%,var(--surface))}
.wtimer.long b{color:var(--warn)}
.wlong{font-size:13px;color:var(--warn);font-weight:600;margin-top:-6px}
.grbox{background:var(--surface2);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.grbox .btn{flex:none;white-space:nowrap}
.addprev{background:color-mix(in srgb,var(--accent) 12%,var(--surface2));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:12px;padding:10px 12px;font-size:15px;display:flex;flex-direction:column;gap:2px}
.addprev:empty{display:none}
.mwarn{color:var(--warn);font-weight:600;font-size:13px;margin:2px 0}
.addprev b{font-size:17px}
.pa-row{padding:10px 0;border-top:1px solid var(--line)}
.pa-row:first-child{border-top:0}
.mshare{flex:none;width:40px;height:40px;border:0;border-radius:12px;background:var(--surface);color:var(--muted);display:grid;place-items:center;cursor:pointer;align-self:flex-start;margin-top:2px}
.mshare svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.shareov{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.shareov[hidden]{display:none}
.sharebox{display:flex;flex-direction:column;gap:12px;max-width:440px;width:100%;max-height:100%}
.sharebox img{width:100%;max-height:70vh;object-fit:contain;border-radius:16px;border:1px solid var(--line)}
/* potwierdzenie dodania produktu */
@keyframes qflash{0%{background:color-mix(in srgb,var(--good) 32%,transparent);box-shadow:inset 3px 0 0 var(--good)}70%{background:color-mix(in srgb,var(--good) 14%,transparent);box-shadow:inset 3px 0 0 var(--good)}100%{background:transparent;box-shadow:inset 3px 0 0 transparent}}
.qrow.just-added{animation:qflash 1.8s ease-out both;border-radius:10px}
.plus.ok{background:var(--good)!important;color:#0D1015!important}
@keyframes tpop{0%{transform:translate(-50%,16px) scale(.96);opacity:0}100%{transform:translate(-50%,0) scale(1);opacity:1}}
.addtoast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:55;width:min(92vw,440px);display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface2);border:1px solid color-mix(in srgb,var(--good) 55%,transparent);box-shadow:0 8px 28px rgba(0,0,0,.45);animation:tpop .22s ease-out both}
.addtoast[hidden]{display:none}
.addtoast .ti{width:30px;height:30px;border-radius:15px;background:var(--good);color:#0D1015;display:grid;place-items:center;font-weight:800;flex:none}
.addtoast .tt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.addtoast .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.addtoast .tt span{color:var(--muted);font-size:12.5px;display:block}
.addtoast .tt span b{display:inline;color:var(--ink)}
.addtoast .btn{flex:none}
/* efekt wciśnięcia przy każdym kliknięciu */
button,.btn,label.btn,[data-act],[data-tab],summary,.ccell,.tooltile,.dtile{-webkit-tap-highlight-color:transparent;transition:transform .12s ease,filter .12s ease,opacity .12s ease;touch-action:manipulation}
button:active,.btn:active,label.btn:active,[data-tab]:active,.chips button:active,.qtabs button:active,.seg button:active,.star:active,.x:active,.plus:active,.rnd:active,.madd:active,.techlink:active,.unitbtn:active,.ccell:active,.scanbtn:active,.qs-x:active,.ktopic:active,.sb:active{transform:scale(.93);filter:brightness(.8)}
.ex-top:active,.mtog:active,.tooltile:active,.dtile:active,.remrow .btn:active,.wkses:active,[data-act="fd-qpick"]:active,summary:active,.kdet summary:active{transform:scale(.98);filter:brightness(.85)}
nav.tabbar button:active{transform:scale(.88)}
button:disabled:active,.btn:disabled:active{transform:none;filter:none}
@media (prefers-reduced-motion:reduce){button:active,.btn:active,[data-act]:active{transform:none}}

<script>
const PLANS={
  red:{label:"Redukcja",sub:"Redukcja · FBW A/B · 5×5 · 3 dni w tygodniu",plan:{
  A: [
    {id:"press", name:"Suwnica", sets:5, lo:5, hi:5, inc:10, note:"Na suwnicy skok 10 kg (po 5 kg na stronę)."},
    {id:"fly", name:"Rozpiętki na maszynie", sets:3, lo:12, hi:12, inc:2.5, note:"Izolacja, więc 3×12 zamiast 5×5. Ciężar dokładasz, gdy zrobisz wszystkie serie po 12."},
    {id:"row", name:"Wiosłowanie", sets:5, lo:5, hi:5, inc:2.5},
    {id:"latA", name:"Wznosy bokiem", sets:3, lo:12, hi:12, inc:1, perHand:true, note:"Wpisujesz ciężar jednej hantli."},
    {id:"curlA", name:"Biceps na wyciągu (dolny)", sets:3, lo:8, hi:8, inc:2.5, note:"Robisz w parze z tricepsem (superseria). Wpisujesz ciężar ze stosu wyciągu."},
    {id:"triA", name:"Triceps", sets:3, lo:8, hi:8, inc:2.5},
    {id:"abs", name:"Allahy", sets:3, lo:12, hi:12, inc:5},
  ],
  B: [
    {id:"legext", name:"Wyprosty nóg na maszynie", sets:3, lo:12, hi:12, inc:5, note:"Superseria z uginaniem: seria wyprostów, od razu seria uginania, potem 60–90 s przerwy."},
    {id:"legcurl", name:"Uginanie nóg na maszynie", sets:3, lo:12, hi:12, inc:5, note:"Superseria z wyprostami. Robisz zaraz po serii wyprostów, bez przerwy."},
    {id:"ohpmach", name:"Wyciskanie na barki na maszynie (siedząc)", sets:5, lo:5, hi:5, inc:2.5},
    {id:"pulldown", name:"Ściąganie drążka", sets:4, lo:8, hi:8, inc:2.5, note:"4×8 zamiast 5×5: na maszynie przy 5 powtórzeniach trudno utrzymać technikę."},
    {id:"cgbench", name:"Wyciskanie wąsko", sets:3, lo:8, hi:8, inc:2.5},
    {id:"curlB", name:"Biceps z hantlami z supinacją", sets:3, lo:8, hi:8, inc:2, perHand:true, note:"Wpisujesz ciężar jednej hantli."},
    {id:"abs", name:"Allahy", sets:3, lo:12, hi:12, inc:5}
  ]
},main:[["press","Suwnica"],["ohpmach","Barki (maszyna)"],["row","Wiosłowanie"],["cgbench","Wyciskanie wąsko"]],next:{A:"B",B:"A"},protein:2.2},
  masa:{label:"Masa",sub:"Masa · FBW A/B/C · 3 dni w tygodniu",plan:{
  A: [
    {id:"squat", name:"Przysiad", sets:4, lo:5, hi:6, inc:5},
    {id:"bench", name:"Wyciskanie leżąc", sets:4, lo:6, hi:8, inc:2.5},
    {id:"row", name:"Wiosłowanie sztangą", sets:3, lo:8, hi:10, inc:2.5},
    {id:"latA", name:"Wznosy bokiem", sets:3, lo:12, hi:15, inc:1, perHand:true, note:"Wpisujesz ciężar jednej hantli. Gdy nie ma mniejszego skoku, najpierw dobijaj powtórzenia."},
    {id:"curl", name:"Uginanie ze sztangą", sets:3, lo:10, hi:12, inc:2.5},
    {id:"calfA", name:"Łydki", sets:3, lo:10, hi:15, inc:5}
  ],
  B: [
    {id:"dead", name:"Martwy ciąg klasyczny", sets:3, lo:4, hi:5, inc:5},
    {id:"ohpmach", name:"Wyciskanie na barki na maszynie (siedząc)", sets:4, lo:6, hi:8, inc:2.5},
    {id:"pull", name:"Podciąganie", sets:4, lo:6, hi:10, inc:2.5, note:"Wpisz dodatkowy ciężar. 0 = sama masa ciała."},
    {id:"incl", name:"Wyciskanie hantli na skosie", sets:3, lo:10, hi:12, inc:2, perHand:true, note:"Wpisujesz ciężar jednej hantli."},
    {id:"french", name:"Wyciskanie francuskie", sets:3, lo:10, hi:12, inc:2.5},
    {id:"abs", name:"Allahy", sets:3, lo:12, hi:15, inc:5}
  ],
  C: [
    {id:"legs", name:"Suwnica / przysiad bułgarski", sets:3, lo:8, hi:10, inc:5, note:"Wybierz jedno ćwiczenie i trzymaj się go przez cały cykl."},
    {id:"rdl", name:"Rumuński martwy ciąg", sets:3, lo:8, hi:10, inc:5},
    {id:"dips", name:"Pompki na poręczach", sets:3, lo:8, hi:12, inc:2.5, note:"Wpisz dodatkowy ciężar. 0 = sama masa ciała."},
    {id:"row2", name:"Wiosło hantlem / ściąganie drążka", sets:3, lo:10, hi:12, inc:2.5},
    {id:"latC", name:"Wznosy bokiem", sets:4, lo:15, hi:20, inc:1, perHand:true, note:"Wpisujesz ciężar jednej hantli."},
    {id:"face", name:"Face pull", sets:3, lo:15, hi:20, inc:2.5},
    {id:"hammer", name:"Młotki", sets:3, lo:10, hi:12, inc:2, perHand:true, note:"Wpisujesz ciężar jednej hantli."}
  ]
},main:[["squat","Przysiad"],["bench","Wyciskanie leżąc"],["dead","Martwy ciąg"],["ohpmach","Barki (maszyna)"]],next:{A:"B",B:"C",C:"A"},protein:1.8}
};
let MODE="red", PLAN=PLANS.red.plan, NEXT=PLANS.red.next, MAIN=PLANS.red.main;
const LSM="sila-5x5-mode";
function rng(ex){return ex.lo===ex.hi?ex.hi:ex.lo+"–"+ex.hi}

let sessions = [];          // [{id,date,day,ex:{id:[{w,r}]},bw}]
let store = {mode:"init"};
let dayTouched=false, firstSnap=true;
let state = {tab:"log", day:"A", date:today(), editingId:null, chart:MAIN[0][0], confirmDel:false, toast:""};

function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(n){return (Math.round(n*100)/100).toString().replace(".",",")}
function fmtDate(s){const [y,m,d]=s.split("-");return `${d}.${m}.${y}`}
function sorted(){return sessions.filter(s=>(s.plan||"red")===MODE).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(a.day<b.day?1:-1))}

/* ---------- tryb ---------- */
function applyMode(m,persist){
  if(!PLANS[m]) return;
  const changed=m!==MODE;
  MODE=m; PLAN=PLANS[m].plan; NEXT=PLANS[m].next; MAIN=PLANS[m].main;
  if(changed){ state.chart=MAIN[0][0]; state.editingId=null; state.confirmDel=false; state.toast=""; dayTouched=false; state.day=plannedDay(); autoDone(); if(typeof techSel!=="undefined") techSel=null; }
  try{localStorage.setItem(LSM,m)}catch(e){}
  if(persist && store.mode==="db") store.db.doc("settings/mode").set({mode:m}).catch(()=>{});
  renderAll(); if(typeof renderTech==="function") renderTech(); if(typeof renderFood==="function") renderFood();
}
document.addEventListener("click",ev=>{const b=ev.target.closest('[data-act="mode"]'); if(b) applyMode(b.dataset.m,true);});
try{const lm=localStorage.getItem(LSM); if(lm&&PLANS[lm]){MODE=lm;PLAN=PLANS[lm].plan;NEXT=PLANS[lm].next;MAIN=PLANS[lm].main;state.chart=MAIN[0][0];state.day=Object.keys(PLAN)[0];}}catch(e){}
/* ---------- storage ---------- */
const LS="sila-5x5-sessions";
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){return []}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify(sessions))}catch(e){}}
async function initStore(){
  let db=null;
  try{ db = window.claude?.use ? await window.claude.use("db") : null }catch(e){db=null}
  if(db){
    store={mode:"db",db}; initFood();
    db.doc("settings/swaps").onSnapshot(d=>{ swaps=d.exists?{...d.data()}:{}; renderAll(true); },()=>{});
    db.doc("settings/mode").onSnapshot(d=>{ if(d.exists&&d.data().mode&&d.data().mode!==MODE) applyMode(d.data().mode,false); },()=>{});
    db.collection("sessions").onSnapshot(snap=>{
      sessions = snap.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));
      if(firstSnap && !dayTouched && !state.editingId){ state.day = plannedDay(); autoDone(); const dr=loadDraft(); if(dr&&!state.doneId&&PLAN[dr.day]) state.day=dr.day; } firstSnap=false;
      renderAll(true);
    },err=>{store={mode:"local"};sessions=lsLoad();renderAll();initFood()});
  }else{
    store={mode:"local"}; try{swaps=JSON.parse(localStorage.getItem("sila-5x5-swaps")||"{}")}catch(e){} sessions=lsLoad(); if(!dayTouched && !state.editingId){ state.day=plannedDay(); autoDone(); const dr=loadDraft(); if(dr&&!state.doneId&&PLAN[dr.day]) state.day=dr.day; } renderAll(); initFood();
  }
}
async function saveSession(obj){
  if(store.mode==="db"){
    const {id,...body}=obj;
    await store.db.doc("sessions/"+id).set(body);
    sessions=sessions.filter(s=>s.id!==id).concat([{id,...body}]); // od razu lokalnie, nie czekając na odświeżenie z bazy
  }else{
    sessions=sessions.filter(s=>s.id!==obj.id); sessions.push(obj); lsSave();
  }
}
async function deleteSession(id){
  if(store.mode==="db"){ await store.db.doc("sessions/"+id).delete(); sessions=sessions.filter(s=>s.id!==id); }
  else { sessions=sessions.filter(s=>s.id!==id); lsSave(); }
}

/* ---------- logic ---------- */
function suggestDay(){const s=sorted()[0];return s?NEXT[s.day]:"A"}
function plannedDay(){const d=suggestDay();return PLAN[d]?d:Object.keys(PLAN)[0]}
function doneToday(){const t=today();return sorted().some(x=>x.date===t)}
let planDate=today();
function syncPlanned(){ if(state.editingId||(dayTouched&&planDate===today())) return false; const t=today(), od=state.date; if(state.date===planDate||!state.date) state.date=t; planDate=t; dayTouched=false; const d=plannedDay(), dn=state.doneId; autoDone(); const dr=loadDraft(); const dd=dr&&!state.doneId&&PLAN[dr.day]?dr.day:d; const ch=dd!==state.day||od!==state.date||dn!==state.doneId; state.day=dd; return ch; }
function lastFor(exId, beforeId){
  for(const s of sorted()){
    if(s.id===beforeId) continue;
    if(state.editingId && s.date>state.date) continue;
    const sets=(s.ex||{})[exId];
    if(sets && sets.some(x=>x.r>0)) return {date:s.date,sets:sets.filter(x=>x.r>0)};
  }
  return null;
}
function recentFor(exId,n){
  const out=[];
  for(const s of sorted()){
    if(s.id===state.editingId) continue;
    if(state.editingId && s.date>state.date) continue;
    const sets=((s.ex||{})[exId]||[]).filter(x=>x.r>0);
    if(sets.length) out.push(sets);
    if(out.length>=n) break;
  }
  return out;
}
function target(ex){
  const last=lastFor(ex.id,state.editingId);
  if(last && ex.time){ const allHit=last.sets.length>=ex.sets&&last.sets.every(x=>x.r>=ex.hi); return {kind:allHit?"up":"hold",w:Math.max(...last.sets.map(x=>+x.w||0)),last,time:true}; }
  if(last && !ex.time){
    const rec=recentFor(ex.id,3);
    const top=sets=>Math.max(...sets.map(x=>+x.w||0));
    const failed=sets=>!(sets.length>=ex.sets&&sets.every(x=>x.r>=ex.hi));
    const avgR=sets=>sets.reduce((a,x)=>a+(+x.r||0),0)/Math.max(1,ex.sets);
    const step=w=>Math.max(ex.inc,Math.round(w*0.1/ex.inc)*ex.inc);
    const w0=rec.length?top(rec[0]):0;
    // wyraźny spadek formy: 2 ostatnie treningi na tym samym ciężarze, średnio 2+ powtórzenia poniżej dolnej granicy

  const bd=sessionBadges(sel);
  const exs=(PLANS[sel.plan||"red"]?.plan[sel.day]||[]).filter(e=>(sel.ex||{})[e.id]);
  const extra=Object.keys(sel.ex||{}).filter(id=>!exs.some(e=>e.id===id));
  return [...exs.map(e=>e.id),...extra].map(id=>{const sets=(sel.ex[id]||[]).filter(x=>x.r>0||x.w>0);const b=bd[id];
    return `<div class="fitem"><div><div><b>${esc(exName(id))}</b> ${b==="pr"?`${TROPHY} <span class="note" style="color:var(--c);font-weight:700">rekord</span>`:b==="up"?`<span style="color:var(--good);font-weight:700">↑ więcej ciężaru</span>`:""}</div><div class="m">${sets.map(x=>`${fmt(+x.w||0)}×${x.r}`).join(" · ")}${exDef(id)?.perHand?" (kg / ręka)":""} · obj. ${fmtKg(exVolume(id,sets))} kg</div></div><span></span><span></span></div>`}).join("")||`<div class="note">Brak wpisanych serii.</div>`;
}
function sessMeta(sel){
  const prev=sessions.filter(x=>x.date<sel.date&&x.day===sel.day&&(x.plan||"red")===(sel.plan||"red")).sort((a,b)=>a.date<b.date?1:-1)[0];
  const d=prev?sessVolume(sel)-sessVolume(prev):null;
  return `${sel.dur?`Czas: ${sel.dur} min · `:""}Objętość: ${fmtKg(sessVolume(sel))} kg${d!=null?` (${d>=0?"+":"−"}${fmtKg(Math.abs(d))} kg vs poprzedni trening ${sel.day})`:""}`;
}
function nextTrainDate(from){let d=shiftDate(from,1);for(let i=0;i<8;i++){if([1,3,6].includes(new Date(d+"T12:00:00").getDay()))return d;d=shiftDate(d,1)}return null}
function doneHTML(s){
  const bd=sessionBadges(s), pr=Object.values(bd).filter(v=>v==="pr").length, up=Object.values(bd).filter(v=>v==="up").length;
  const nSets=Object.values(s.ex||{}).reduce((a,l)=>a+l.filter(x=>x.r>0).length,0);
  const nx=NEXT[s.day], nd=s.date===today()?nextTrainDate(today()):null;
  const wd=d=>new Date(d+"T12:00:00").toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"numeric"});
  return `<div class="card stack done-card">
    <div class="done-top"><span class="done-ic" aria-hidden="true">✓</span><div><div class="label">${esc(PLANS[s.plan||"red"].label)} · ${s.date===today()?"dziś":fmtDate(s.date)}</div><h2>Trening ${s.day} zrobiony</h2></div></div>
    <div class="logstats">
      <div class="lstat"><span class="label">Czas</span><b class="num">${s.dur?s.dur+" min":"–"}</b></div>
      <div class="lstat"><span class="label">Serie</span><b class="num">${nSets}</b></div>
      <div class="lstat"><span class="label">Objętość</span><b class="num">${fmtKg(sessVolume(s))} kg</b></div>
    </div>
    ${pr||up?`<div class="note" style="margin:0">${pr?`${TROPHY} <b>${pr} ${pr===1?"rekord":pr<5?"rekordy":"rekordów"}</b>`:""}${pr&&up?" · ":""}${up?`<span style="color:var(--good);font-weight:700">↑ więcej ciężaru w ${up} ${up===1?"ćwiczeniu":"ćwiczeniach"}</span>`:""}</div>`:""}
    <div class="note" style="margin:0">${sessMeta(s)}</div>
    <div>${sessRowsHTML(s)}</div>
    ${nd?`<div class="nb-step"><b>Następny:</b> Trening ${nx}, ${wd(nd)}.</div>`:""}
    <div class="row"><button class="btn" data-act="fd-share-tr" data-id="${esc(s.id)}">📤 Udostępnij</button><button class="btn ghost" data-act="done-edit">✎ Edytuj trening</button><button class="btn ghost" data-act="new">Nowy trening</button></div>
  </div>`;
}
function autoDone(){const t=today();const td=sorted().find(x=>x.date===t);state.doneId=(td&&state.skipDone!==t&&!state.editingId)?td.id:null}
/* przycisk „Dalej” nad klawiaturą: ciężar → powtórzenia → następna seria → następne ćwiczenie */
const NB=(()=>{
  let bar=null, cur=null, hideT=null;
  const list=()=>[...document.querySelectorAll("#view-log .sets input")];
  function mk(){ if(bar) return bar; bar=document.createElement("div"); bar.className="nextbar"; bar.hidden=true;
    bar.innerHTML=`<span class="nb-lbl" id="nb-lbl"></span><button type="button" class="btn" id="nb-go">Dalej ›</button>`;
    document.body.appendChild(bar);
    const go=bar.querySelector("#nb-go");
    go.addEventListener("pointerdown",e=>e.preventDefault()); go.addEventListener("mousedown",e=>e.preventDefault());
    go.addEventListener("click",()=>next());
    if(window.visualViewport){visualViewport.addEventListener("resize",place);visualViewport.addEventListener("scroll",place);}
    return bar; }
  function place(){ if(!bar||bar.hidden) return; const vv=window.visualViewport; if(vv){ bar.style.top=(vv.offsetTop+vv.height-bar.offsetHeight)+"px"; bar.style.bottom="auto"; } }
  function parts(el){const m=el.id.match(/^in-(.+)-(\d+)-([wr])$/);return m?{ex:m[1],i:+m[2],k:m[3]}:null}
  function label(el){const p=parts(el);if(!p)return "";const exEl=el.closest(".ex");const n=exEl?+exEl.dataset.sets:0;const L=list(),ix=L.indexOf(el),nx=L[ix+1];
    const now=`Seria ${p.i+1}/${n} · ${p.k==="w"?"ciężar":"powtórzenia"}`;
    const then=p.k==="w"?"potem powtórzenia":p.i+1<n?"potem seria "+(p.i+2):nx?"potem następne ćwiczenie":"potem zapis";
    return `<b>${now}</b><span>${then}</span>`;}
  function show(el){ mk(); clearTimeout(hideT); cur=el; bar.hidden=false; bar.querySelector("#nb-lbl").innerHTML=label(el); const L=list(); bar.querySelector("#nb-go").textContent=L.indexOf(el)===L.length-1?"Gotowe ✓":"Dalej ›"; place(); }
  function hide(){ hideT=setTimeout(()=>{ const a=document.activeElement; if(!(a&&a.closest&&a.closest("#view-log .sets"))){ if(bar) bar.hidden=true; cur=null; } },120); }
  function openEx(id){ state.openEx=id; document.querySelectorAll("#view-log .ex[data-ex]").forEach(el=>{const o=el.dataset.ex===id;el.classList.toggle("open",o);el.querySelector(".ex-body").hidden=!o;el.querySelector(".ex-top").setAttribute("aria-expanded",o)}); }
  function ensureVisible(el){ const vv=window.visualViewport, top=vv?vv.offsetTop:0, h=vv?vv.height:window.innerHeight; const r=el.getBoundingClientRect(); const barH=bar&&!bar.hidden?bar.offsetHeight:0;
    if(r.top<70||r.bottom>h-barH-12) window.scrollBy(0,r.top-Math.min(h*0.35,180)); }
  function next(){
    const el=cur||document.activeElement; if(!el||!el.id) return; const L=list(), ix=L.indexOf(el); if(ix<0) return; const p=parts(el);
    if(p.k==="w"&&el.value===""){const ph=parseFloat((el.placeholder||"").replace(",","."));if(!isNaN(ph)&&ph>0){el.value=ph;}}
    const nx=L[ix+1];
    if(!nx){ el.blur(); if(bar) bar.hidden=true; updateLogLive(); saveDraft(); document.querySelector("#view-log .savebar")?.scrollIntoView({block:"center"}); return; }
    const q=parts(nx);
    if(q.k==="w"&&nx.value===""&&q.ex===p.ex){ const pw=document.getElementById(`in-${p.ex}-${p.i}-w`); if(pw&&pw.value!=="") nx.value=pw.value; }
    if(q.ex!==p.ex){ openEx(q.ex); const exEl=nx.closest(".ex"); if(exEl){ const r=exEl.getBoundingClientRect(); window.scrollBy(0,r.top-70); } }
    nx.focus({preventScroll:true}); try{nx.select()}catch(e){}
    ensureVisible(nx); updateLogLive(); saveDraft(); show(nx);
  }
  document.addEventListener("focusin",ev=>{const t=ev.target; if(t&&t.matches&&t.matches("#view-log .sets input")) show(t);});
  document.addEventListener("focusout",ev=>{const t=ev.target; if(t&&t.matches&&t.matches("#view-log .sets input")) hide();});
  document.addEventListener("keydown",ev=>{const t=ev.target; if(ev.key==="Enter"&&t&&t.matches&&t.matches("#view-log .sets input")){ev.preventDefault();cur=t;next();}});
  return {next};
})();
/* stoper treningu: start zapisany lokalnie (przeżywa zamknięcie apki), zatrzymuje się przy zapisie */
const WLONG=100*60000; // po tylu minutach pytamy, czy trening się nie skończył
function wTimerStart(){let v=0;try{v=+localStorage.getItem("sila-5x5-wstart")||0}catch(e){}return v||window.__wstDb||0}
function wTimerSet(v){try{v?localStorage.setItem("sila-5x5-wstart",String(v)):localStorage.removeItem("sila-5x5-wstart")}catch(e){} window.__wst=v||0; window.__wstDb=v||0;
  // zapis w bazie: dzięki temu przypomnienie na telefon wie, że trening trwa
  if(store.mode==="db") store.db.doc("settings/workout").set({start:v||null,at:Date.now(),date:today()}).catch(()=>{});
  renderRemind();}
function wLongHTML(ms){return ms>=WLONG?`<div class="wlong">Trening trwa już ponad ${Math.floor(ms/3600000)} h ${Math.floor(ms%3600000/60000)} min. Skończyłeś, a zapomniałeś zapisać? <button class="techlink" data-act="wt-tosave">Zapisz trening ›</button></div>`:""}
function wFmt(ms){const s=Math.max(0,Math.floor(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":":"")+String(m).padStart(h?2:1,"0")+":"+String(x).padStart(2,"0")}
function wTimerHTML(){const st=wTimerStart()||window.__wst||0;
  return st?`<div class="wtimer on ${Date.now()-st>=WLONG?"long":""}"><div><span class="label">Trening trwa</span><b class="num" id="wtimer">${wFmt(Date.now()-st)}</b></div><button class="btn ghost small" data-act="wt-cancel">Anuluj stoper</button></div><div id="wlong">${wLongHTML(Date.now()-st)}</div>`
    :`<button class="btn wstart" data-act="wt-start">▶ Start treningu</button>`}
setInterval(()=>{const el=document.getElementById("wtimer");const st=wTimerStart()||window.__wst;if(el&&st){const ms=Date.now()-st;el.textContent=wFmt(ms);if(ms>=WLONG){el.closest(".wtimer")?.classList.add("long");const L=document.getElementById("wlong");if(L&&!L.firstChild)L.innerHTML=wLongHTML(ms);}}},1000);
setInterval(()=>{const st=wTimerStart();if(st&&Date.now()-st>=WLONG&&!document.querySelector('[data-k="workout"]'))renderRemind()},30000);
function updateLogLive(){
  const root=document.getElementById("view-log"); if(!root) return;
  let exD=0, setsD=0, vol=0;
  root.querySelectorAll(".ex[data-ex]").forEach(el=>{
    const id=el.dataset.ex, n=+el.dataset.sets; let d=0; const ph=exDef(id)?.perHand?2:1;
    for(let i=0;i<n;i++){const w=document.getElementById(`in-${id}-${i}-w`),r=document.getElementById(`in-${id}-${i}-r`);if(!w||!r)continue;
      w.classList.toggle("filled",w.value!=="");r.classList.toggle("filled",r.value!=="");
      if(r.value!==""&&+r.value>0){d++;vol+=(+w.value||0)*(+r.value)*ph}}
    setsD+=d; const done=d>=n; if(done) exD++;
    el.classList.toggle("done",done); el.classList.toggle("started",d>0&&!done);
    const ck=el.querySelector(".ex-check"); if(ck) ck.textContent=done?"✓":(d?`${d}/${n}`:[...root.querySelectorAll(".ex[data-ex]")].indexOf(el)+1);
  });
  const set=(i,v)=>{const e=document.getElementById(i);if(e)e.textContent=v};
  const tot=root.querySelectorAll(".ex[data-ex]").length, totS=[...root.querySelectorAll(".ex[data-ex]")].reduce((a,e)=>a+ +e.dataset.sets,0);
  set("ls-ex",`${exD} / ${tot}`); set("ls-sets",`${setsD} / ${totS}`); set("ls-vol",`${fmtKg(vol)} kg`);
}
document.addEventListener("input",ev=>{ if(ev.target.id&&ev.target.id.startsWith("in-")){ updateLogLive(); clearTimeout(window.__dT); window.__dT=setTimeout(saveDraft,400); } });

function renderPlan(){ if(MODE==="masa") renderPlanMasa(); else renderPlanRed(); document.getElementById("view-plan").insertAdjacentHTML("beforeend",remindersHTML()+backupHTML()); }
let bk={msg:"",pending:null,busy:false};
function backupHTML(){
  const n=sessions.length, fd=Object.keys(food).length, wd=Object.values(activity).filter(a=>a.bw>0).length;
  return `<div class="card stack" id="backup"><h2>Kopia zapasowa</h2>
    <p class="note" style="margin:0">Zapisuje wszystko do jednego pliku .json: treningi (${n}), dni z jedzeniem (${fd}), pomiary wagi (${wd}), Twoje produkty i posiłki, cele i zamiany ćwiczeń. Rób to np. raz w miesiącu i trzymaj plik na dysku.</p>
    <div class="row"><button class="btn" data-act="bk-export" ${bk.busy?"disabled":""}>Pobierz kopię</button><label class="btn ghost" style="cursor:pointer">Przywróć z pliku<input type="file" id="bk-file" accept=".json,application/json" hidden></label></div>
    ${bk.pending?`<div class="addmenu stack" style="gap:8px"><b>Przywrócić dane z pliku?</b><span class="note">Plik z ${esc(bk.pending.exported?fmtDate(bk.pending.exported.slice(0,10)):"?")}: treningi ${(bk.pending.sessions||[]).length}, dni z jedzeniem ${Object.keys(bk.pending.food||{}).length}, dni z aktywnością/wagą ${Object.keys(bk.pending.activity||{}).length}. Wpisy z tych samych dni zostaną zastąpione wersją z pliku, reszta zostaje bez zmian.</span>
      <div class="row"><button class="btn" data-act="bk-import" ${bk.busy?"disabled":""}>Tak, przywróć</button><button class="btn ghost" data-act="bk-cancel">Anuluj</button></div></div>`:""}
    <div class="note" id="bk-msg" style="font-weight:600">${esc(bk.msg)}</div></div>`;

function backupData(){
  return {app:"dziennik-treningowy",version:1,exported:new Date().toISOString(),mode:MODE,sessions,food,activity,products,recipes,targets,swaps};
}
async function doExport(){
  const json=JSON.stringify(backupData(),null,1), fn=`dziennik-kopia-${today()}.json`;
  let dl=null; try{dl=window.claude?.use?await window.claude.use("downloads"):null}catch(e){dl=null}
  if(dl){ try{ await dl.save({filename:fn,data:json}); return "Kopia zapisana: "+fn; }catch(e){ if(e&&e.code==="declined") return "Anulowano."; if(e&&e.code==="rate_limited") return "Poczekaj chwilę i spróbuj jeszcze raz."; } }
  try{ const u=URL.createObjectURL(new Blob([json],{type:"application/json"})); const a=document.createElement("a"); a.href=u; a.download=fn; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),5000); return "Pobieranie: "+fn; }catch(e){ return "Nie udało się zapisać pliku w tym widoku."; }
}
async function doImport(d){
  const S=d.sessions||[], F=d.food||{}, A=d.activity||{}, P=d.products||{}, R=d.recipes||{};
  if(store.mode==="db"){
    const db=store.db, jobs=[];
    for(const x of S){ const {id,...b}=x; if(id) jobs.push(db.doc("sessions/"+id).set(b)); }
    for(const [k,v] of Object.entries(F)) if(Array.isArray(v)&&v.length) jobs.push(db.doc("food/"+k).set({items:v}));
    for(const [k,v] of Object.entries(A)) jobs.push(db.doc("activity/"+k).set(v));
    for(const [k,v] of Object.entries(P)) jobs.push(db.doc("products/"+k).set(v));
    for(const [k,v] of Object.entries(R)) jobs.push(db.doc("recipes/"+k).set(v));
    if(d.targets) jobs.push(db.doc("settings/targets").set(d.targets));
    if(d.swaps) jobs.push(db.doc("settings/swaps").set(d.swaps));
    if(d.mode) jobs.push(db.doc("settings/mode").set({mode:d.mode}));
    const res=await Promise.allSettled(jobs); const bad=res.filter(r=>r.status==="rejected").length;
    return bad?`Przywrócono, ale ${bad} z ${jobs.length} wpisów się nie zapisało. Spróbuj jeszcze raz.`:`Przywrócono ${jobs.length} wpisów.`;
  }
  const m=new Map(sessions.map(x=>[x.id,x])); for(const x of S) if(x.id) m.set(x.id,x); sessions=[...m.values()]; lsSave();
  Object.assign(food,F); Object.assign(activity,A); Object.assign(products,P); Object.assign(recipes,R); if(d.targets) targets={...d.targets}; if(d.swaps) swaps={...d.swaps};
  lsSet(LSF,food); lsSet(LSA,activity); lsSet(LSP,products); lsSet(LSR,recipes); lsSet(LST,targets); try{localStorage.setItem("sila-5x5-swaps",JSON.stringify(swaps))}catch(e){}
  if(d.mode&&PLANS[d.mode]) applyMode(d.mode,false); foodChanged(); renderAll();
  return "Przywrócono dane z pliku.";
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest('[data-act^="bk-"]'); if(!b) return; const a=b.dataset.act;
  if(a==="bk-cancel"){ bk.pending=null; bk.msg=""; renderPlan(); return; }
  if(a==="bk-export"){ bk.busy=true; bk.msg="Przygotowuję plik…"; renderPlan(); bk.msg=await doExport(); bk.busy=false; renderPlan(); return; }
  if(a==="bk-import"&&bk.pending){ bk.busy=true; bk.msg="Przywracam…"; renderPlan(); try{ bk.msg=await doImport(bk.pending); }catch(e){ bk.msg="Nie udało się przywrócić danych."; } bk.pending=null; bk.busy=false; renderPlan(); return; }
});
document.addEventListener("change",ev=>{
  if(ev.target.id!=="bk-file") return; const f=ev.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result); if(d.app!=="dziennik-treningowy") throw 0; bk.pending=d; bk.msg=""; }catch(e){ bk.pending=null; bk.msg="To nie jest plik kopii z tego dziennika."; } renderPlan(); document.getElementById("backup")?.scrollIntoView({block:"center"}); }; r.readAsText(f);
});
function renderPlanRed(){
  const card=(d)=>`<div class="plan-card ${d}"><div class="label">Trening</div><h2>${d}</h2><ol>${PLAN[d].map(e=>`<li>${esc(e.name)} <span>${e.time?e.sets+"× "+e.lo+"–"+e.hi+" s":e.sets+"×"+e.hi}</span></li>`).join("")}</ol></div>`;
  const wk=(a)=>[["Pon",a[0]],["Wt",""],["Śr",a[1]],["Czw",""],["Pt",""],["Sob",a[2]],["Nd",""]].map(([n,d])=>`<div class="${d}">${n}<b>${d||"–"}</b></div>`).join("");
  document.getElementById("view-plan").innerHTML=`
  <div><h2>Rotacja</h2>
  <div class="label" style="margin-top:8px">Tydzień 1</div><div class="week">${wk(["A","B","A"])}</div>
  <div class="label" style="margin-top:8px">Tydzień 2</div><div class="week">${wk(["B","A","B"])}</div>
  <p class="note">Treningi zawsze na zmianę: A, B, A, B. Gdy wypadnie dzień, robisz po prostu następny z kolejki.</p></div>
  <div class="plan-grid">${card("A")}${card("B")}</div>
  <div class="rules"><h2 style="margin-bottom:14px">Zasady</h2><dl>
    <dt>Progresja 5×5</dt><dd>Gdy zrobisz wszystkie 5 serii po 5 powtórzeń, następnym razem dokładasz ciężar: 2,5 kg na wyciskania i wiosłowanie, 10 kg na suwnicę.</dd>
    <dt>Progresja 3×8 / 3×12</dt><dd>To samo na ćwiczeniach dodatkowych: gdy zrobisz wszystkie serie w pełnych powtórzeniach, następnym razem mały skok ciężaru.</dd>
    <dt>Zastój</dt><dd>Na redukcji nie zmniejszasz ciężaru. Jeśli nie wchodzą pełne serie, zostajesz przy tym samym ciężarze i robisz ile się da, np. 5-5-4-4-4. Utrzymanie ciężarów do końca redukcji to sukces.</dd>
    <dt>Intensywność</dt><dd>Serie kończ 1–2 powtórzenia przed upadkiem. Nie trenuj do upadku, na deficycie za bardzo to męczy.</dd>
    <dt>Przerwy</dt><dd>3–5 minut na seriach 5×5, 60–90 sekund na ćwiczeniach 3×8.</dd>
    <dt>Rozgrzewka</dt><dd>Przed suwnicą i wyciskaniem na barki 2–3 serie dochodzące z rosnącym ciężarem, np. 40%, 60%, 80% ciężaru roboczego.</dd>
    <dt>Dieta</dt><dd>2–2,4 g białka na kg masy ciała. Chudnij w tempie 0,5–1% masy ciała tygodniowo. Szybciej oznacza ryzyko utraty mięśni. Waż się rano i wpisuj wagę w Podsumowanie → Waga, a dziennik pokaże tempo.</dd>
    <dt>Sen</dt><dd>7–9 godzin. Bez tego ciężary przestaną rosnąć szybciej niż powinny.</dd>
  </dl></div>`;

function renderPlanMasa(){
  const card=(d)=>`<div class="plan-card ${d}"><div class="label">Trening</div><h2>${d}</h2><ol>${PLAN[d].map(e=>`<li>${esc(e.name)} <span>${e.sets}×${e.lo}–${e.hi}</span></li>`).join("")}</ol></div>`;
  const wk=[["Pon","A"],["Wt",""],["Śr","B"],["Czw",""],["Pt",""],["Sob","C"],["Nd",""]];
  document.getElementById("view-plan").innerHTML=`
  <div><h2>Tydzień</h2><div class="week">${wk.map(([n,d])=>`<div class="${d}">${n}<b>${d||"–"}</b></div>`).join("")}</div>
  <p class="note">Zawsze kolejność A → B → C. Gdy wypadnie dzień, robisz po prostu następny trening z kolejki. Jeden trening to około 60–75 minut.</p></div>
  <div class="plan-grid">${card("A")}${card("B")}${card("C")}</div>
  <div class="rules"><h2 style="margin-bottom:14px">Zasady</h2><dl>
    <dt>Progresja</dt><dd>Gdy we wszystkich seriach zrobisz górną granicę powtórzeń, następnym razem dokładasz ciężar: 2,5 kg na górę ciała, 5 kg na nogi i martwy ciąg. Zakładka Trening liczy to za Ciebie.</dd>
    <dt>Intensywność</dt><dd>Boje kończ 1–2 powtórzenia przed upadkiem. Na izolacjach (wznosy, biceps, triceps, łydki) możesz dojść do upadku w ostatniej serii.</dd>
    <dt>Przerwy</dt><dd>2–3 minuty na przysiadzie, wyciskaniach, martwym i wiosłowaniu. 60–90 sekund na reszcie.</dd>
    <dt>Rozgrzewka</dt><dd>Przed pierwszym bojem 2–3 serie dochodzące z rosnącym ciężarem, np. 40%, 60%, 80% ciężaru roboczego.</dd>
    <dt>Deload</dt><dd>Co 7. tydzień (po 6 tygodniach pracy) robisz te same treningi na około 60% ciężaru. Pasek u góry pokazuje, który to tydzień.</dd>
    <dt>Dieta</dt><dd>Nadwyżka około 300 kcal ponad utrzymanie i 1,6–2 g białka na kg masy ciała. Cel to przyrost 0,25–0,5 kg tygodniowo. Waż się rano i wpisuj wagę w Podsumowanie → Waga, a dziennik pokaże tempo.</dd>
    <dt>Sen</dt><dd>7–9 godzin. Mięśnie rosną w regeneracji, nie na siłowni.</dd>
    <dt>Zastój</dt><dd>Jeśli ćwiczenie stoi w miejscu 3–4 tygodnie, wymień je na podobne (np. wyciskanie leżąc na wyciskanie hantli) albo zrób deload wcześniej.</dd>
  </dl></div>`;
}

function chartSVG(pts,unit,opt={}){
  if(pts.length<2) return `<div class="empty">Zapisz co najmniej 2 treningi z tym ćwiczeniem, żeby zobaczyć wykres.</div>`;
  const ST=opt.step||2.5, W=640,H=240,L=opt.L||46,R=16,T=16,B=34;
  const ys=pts.map(p=>p.v); let lo=Math.min(...ys),hi=Math.max(...ys);
  const pad=Math.max(ST,(hi-lo)*0.15); lo=Math.max(0,Math.floor((lo-pad)/ST)*ST); hi=Math.ceil((hi+pad)/ST)*ST;
  const t0=new Date(pts[0].d).getTime(), t1=Math.max(new Date(pts.at(-1).d).getTime(),t0+864e5);
  const x=d=>L+(new Date(d).getTime()-t0)/(t1-t0)*(W-L-R);
  const y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const ticks=4; let g="";
  for(let i=0;i<=ticks;i++){const v=lo+(hi-lo)*i/ticks;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="var(--muted)">${opt.step?Math.round(v).toLocaleString("pl-PL"):fmt(Math.round(v*10)/10)}</text>`}
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(p.d).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const area=line+`L${x(pts.at(-1).d)},${H-B}L${x(pts[0].d)},${H-B}Z`;
  const last=pts.at(-1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Wykres">${g}
    <path d="${area}" fill="var(--accent)" fill-opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${x(p.d)}" cy="${y(p.v)}" r="3" fill="var(--accent)"/>`).join("")}
    <circle cx="${x(last.d)}" cy="${y(last.v)}" r="6" fill="var(--surface)" stroke="var(--accent)" stroke-width="3"/>
    <text x="${L}" y="${H-10}" font-size="12" fill="var(--muted)">${fmtDate(pts[0].d)}</text>
    <text x="${W-R}" y="${H-10}" font-size="12" fill="var(--muted)" text-anchor="end">${fmtDate(last.d)}</text>
    <text x="${W-R}" y="${T+2}" font-size="12" fill="var(--muted)" text-anchor="end">${unit}</text></svg>`;
}

function collect(){
  const day=state.day, ex={};
  for(const e of effPlan(day)){
    const sets=[];
    for(let i=0;i<e.sets;i++){
      const w=document.getElementById(`in-${e.id}-${i}-w`)?.value??"", r=document.getElementById(`in-${e.id}-${i}-r`)?.value??"";
      if(r!==""&&+r>0) sets.push({w:w===""?0:+w, r:r===""?0:Math.round(+r)});
    }
    if(sets.length) ex[e.id]=sets;
  }
  const ed=state.editingId?sessions.find(x=>x.id===state.editingId):null; const bw=ed?.bw||"";
  // edycja: zachowaj serie ćwiczeń, których nie ma w obecnym planie dnia (np. po zamianie ćwiczenia)
  if(ed&&ed.ex){const ids=new Set(effPlan(day).map(e=>e.id));for(const k in ed.ex) if(!ids.has(k)&&!(k in ex)) ex[k]=ed.ex[k];}
  return {date:document.getElementById("f-date").value||today(), day, ex, bw:bw?+bw:null, plan:MODE};
}

/* asystent progresu: co zrobić z ciężarem na następnym treningu, na podstawie ostatnich wyników */
let paOpen=false;
function progressAssistantHTML(){
  const ed=state.editingId; state.editingId=null;
  const seen=new Set(), rows=[];
  for(const d of Object.keys(PLAN)) for(const ex of effPlan(d)){ if(seen.has(ex.id)||ex.time) continue; seen.add(ex.id);
    const t=target(ex); if(t.kind==="new"){rows.push({ex,d,t,trend:null});continue}
    const hist=sorted().filter(s=>(s.ex||{})[ex.id]&&s.ex[ex.id].some(x=>x.r>0));
    const best=s=>Math.max(...s.ex[ex.id].filter(x=>x.r>0).map(x=>e1rm(+x.w||0,+x.r)));
    let trend=null; if(hist.length>=2){const now=best(hist[0]);const old=hist.find(s=>(new Date(hist[0].date)-new Date(s.date))/864e5>=21)||hist.at(-1);const b0=best(old);if(b0>0)trend={p:(now/b0-1)*100,days:Math.round((new Date(hist[0].date)-new Date(old.date))/864e5)}}
    rows.push({ex,d,t,trend}); }
  state.editingId=ed;
  if(!rows.some(r=>r.t.kind!=="new")) return `<div class="card stack"><h2>Asystent progresu</h2><p class="note" style="margin:0">Po pierwszych zapisanych treningach pokażę tu przy każdym ćwiczeniu, czy następnym razem dołożyć ciężar, zostać przy nim, czy go zmniejszyć.</p></div>`;
  const cnt=k=>rows.filter(r=>r.t.kind===k).length;
  const ord={down:0,up:1,keep:2,hold:3,new:4};
  rows.sort((a,b)=>ord[a.t.kind]-ord[b.t.kind]);
  const tag=t=>t.ramp&&t.ramp.first?`<span class="tag new">test → ${fmt(t.w)} kg</span>`:t.kind==="up"?`<span class="tag up">↑ +${fmt(t.w-Math.max(...t.last.sets.map(x=>+x.w||0)))} kg</span>`:t.kind==="down"?`<span class="tag down">↓ −${fmt(t.d)} kg</span>`:t.kind==="keep"?`<span class="tag hold">= utrzymaj</span>`:t.kind==="hold"?`<span class="tag hold">= ten sam</span>`:`<span class="tag new">brak danych</span>`;
  const txt=r=>{const t=r.t,ex=r.ex;if(t.kind==="new")return "Jeszcze nie ma zapisanej serii.";const last=t.last.sets.map(x=>`${fmt(+x.w||0)}×${x.r}`).join(", ");
    const act=t.kind==="up"?`Wszystkie serie zrobione. Następnym razem <b>${fmt(t.w)} kg</b>.`:t.kind==="down"?`Następnym razem <b>${fmt(t.w)} kg</b>. ${t.why}`:t.kind==="keep"?`Zostań przy <b>${fmt(t.w)} kg</b>. Na redukcji utrzymanie ciężaru to sukces.`:t.ramp&&t.ramp.first?`Pierwszy trening był testem ciężaru (piramida), więc jeszcze nie oceniam progresu. Następnym razem zrób wszystkie ${ex.sets} ${ex.sets<5?"serie":"serii"} na <b>${fmt(t.w)} kg</b> (ciężar z ostatniej serii). Po tym treningu zdecyduję o dołożeniu.`:t.ramp?`Na <b>${fmt(t.w)} kg</b> ${t.ramp.n===1?"była tylko 1":"były tylko "+t.ramp.n} z ${ex.sets} serii (piramida). Zostań przy tym ciężarze, aż zrobisz na nim wszystkie serie. Dopiero wtedy dokładasz.`:`Zostań przy <b>${fmt(t.w)} kg</b> i ${ex.lo===ex.hi?`dobij do ${ex.sets}×${ex.hi}`:`dobijaj powtórzenia do ${ex.hi}`}. Potem dokładasz ${fmt(ex.inc)} kg.`;
    return `Ostatnio (${fmtDate(t.last.date)}): <span class="num">${last}</span>. ${act}`};
  const trendTxt=tr=>!tr?"":`<span class="num" style="color:${tr.p>1?"var(--good)":tr.p<-3?"var(--bad)":"var(--muted)"};font-weight:600">${tr.p>=0?"+":"−"}${fmt(Math.abs(Math.round(tr.p*10)/10))}% siły</span> <span class="note">w ${tr.days} dni</span>`;
  const shown=paOpen?rows:rows.slice(0,6);
  return `<div class="card stack" id="pa-card"><div class="row pa-head ${paOpen?"stick":""}" style="justify-content:space-between;flex-wrap:nowrap"><h2>Asystent progresu</h2>${rows.length>6?`<button class="btn small pa-tog" data-act="pa-more" aria-expanded="${paOpen}">${paOpen?"Zwiń ▴":`Wszystkie (${rows.length}) ▾`}</button>`:""}</div>
    <div class="wk-grid">
      <div class="wk-t good"><span class="label">Dołóż ciężar</span><b class="num">${cnt("up")}</b><span class="note">ćwiczeń</span></div>
      <div class="wk-t"><span class="label">Bez zmian</span><b class="num">${cnt("hold")+cnt("keep")}</b><span class="note">dobijaj powtórzenia</span></div>
      ${cnt("down")?`<div class="wk-t" style="grid-column:1/-1"><span class="label">Zmniejsz ciężar</span><b class="num" style="color:var(--bad)">${cnt("down")}</b><span class="note">wyraźny spadek wyników</span></div>`:""}
    </div>
    <div class="stack" style="gap:0">${shown.map(r=>`<div class="pa-row"><div class="row" style="justify-content:space-between;gap:8px;flex-wrap:nowrap"><b>${esc(r.ex.name)} <span class="note">· ${r.d}</span></b>${tag(r.t)}</div><div class="note" style="margin:2px 0 0">${txt(r)}</div>${r.trend?`<div class="note" style="margin:2px 0 0">${trendTxt(r.trend)}</div>`:""}</div>`).join("")}</div>
    <div class="pa-foot"><span class="label">ℹ Jak to działa</span>${rows.length>6&&!paOpen?`<div class="note" style="margin:0">Pokazuję 6 najważniejszych. Resztę rozwiniesz przyciskiem na górze.</div>`:""}
    <p class="note" style="margin:0">Asystent patrzy na ostatnie 3 treningi każdego ćwiczenia. Dokładasz dopiero wtedy, gdy wszystkie serie robocze zrobisz na tym samym, najwyższym ciężarze w górnej granicy powtórzeń. Serie rosnące (piramida) się nie liczą. Jeśli pierwszy trening był piramidą (test ciężaru), następnym razem wszystkie serie robisz na ciężarze z ostatniej serii i dopiero z tego treningu asystent ocenia, czy dołożyć. Zmniejsza ciężar tylko przy wyraźnym spadku (2 treningi z rzędu mocno poniżej zakresu)${MODE==="masa"?" albo po 3 treningach bez postępu":""}. Siła = szacowany maks na 1 powtórzenie. Te same podpowiedzi widzisz w treningu przy każdym ćwiczeniu.</p></div>
  </div>`;
}
document.addEventListener("click",ev=>{ if(ev.target.closest('[data-act="pa-more"]')){ const c=document.getElementById("pa-card"), t0=c?c.getBoundingClientRect().top:null; paOpen=!paOpen; renderProg(); const c2=document.getElementById("pa-card"); if(c2&&t0!=null){ const t1=c2.getBoundingClientRect().top; if(Math.abs(t1-t0)>1) window.scrollBy(0,t1-t0); if(!paOpen&&t0<0) window.scrollBy(0,c2.getBoundingClientRect().top-70); } } });
/* ---------- kalendarz treningów ---------- */
let calView="week", calOff=0, calSel=null;
const TROPHY=`<svg viewBox="0 0 24 24" width="16" height="16" aria-label="Rekord" role="img" style="vertical-align:-3px"><path d="M7 4h10v3a5 5 0 0 1-10 0V4z" fill="var(--c)"/><path d="M7 5H4v1.5A3.5 3.5 0 0 0 7.5 10M17 5h3v1.5A3.5 3.5 0 0 1 16.5 10" fill="none" stroke="var(--c)" stroke-width="1.8"/><path d="M12 12v4M8.5 20h7l-1-4h-5z" fill="var(--c)"/></svg>`;
function calDays(){
  const t=new Date(today()+"T12:00:00");
  if(calView==="week"){const wd=(t.getDay()+6)%7;const mon=new Date(t);mon.setDate(t.getDate()-wd+calOff*7);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d.toISOString().slice(0,10)})}
  const m=new Date(t.getFullYear(),t.getMonth()+calOff,1,12);const days=[];const mm=m.getMonth();while(m.getMonth()===mm){days.push(m.toISOString().slice(0,10));m.setDate(m.getDate()+1)}return days;
}
function sessionBadges(s){
  // rekord: najlepszy szacowany 1RM ćwiczenia wyższy niż we wszystkich wcześniejszych treningach
  const prev=sessions.filter(x=>x.date<s.date);
  const out={};
  for(const [id,sets] of Object.entries(s.ex||{})){
    const done=sets.filter(x=>x.r>0); if(!done.length) continue;
    const best=Math.max(...done.map(x=>e1rm(+x.w||0,+x.r||0))), top=Math.max(...done.map(x=>+x.w||0));
    const hist=prev.map(p=>(p.ex||{})[id]).filter(v=>v&&v.some(x=>x.r>0));
    if(!hist.length){out[id]="first";continue}
    const pb=Math.max(...hist.flat().filter(x=>x.r>0).map(x=>e1rm(+x.w||0,+x.r||0)));
    const lastTop=Math.max(...hist.at(-1).filter(x=>x.r>0).map(x=>+x.w||0));
    const lastSess=prev.filter(p=>(p.ex||{})[id]).sort((a,b)=>a.date<b.date?-1:1).at(-1);
    const lt=lastSess?Math.max(...lastSess.ex[id].filter(x=>x.r>0).map(x=>+x.w||0)):0;
    out[id]=best>pb+0.01&&top>0?"pr":top>lt?"up":"";
  }
  return out;
}
function calendarHTML(){
  const days=calDays(), td=today(), ss=sorted(), first=ss.at(-1)?.date;
  const byDate={}; for(const s of ss) (byDate[s.date]=byDate[s.date]||[]).push(s);
  const planned=d=>[1,3,6].includes(new Date(d+"T12:00:00").getDay());
  // przewidywana kolejność treningów na przyszłe dni planowe
  const fut={}; { let nx=ss[0]?NEXT[ss[0].day]:Object.keys(PLAN)[0]; let d=td; if(byDate[td]) d=shiftDate(td,1); for(let i=0;i<420&&d<=days.at(-1);i++){ if(planned(d)&&!byDate[d]){ fut[d]=nx; nx=NEXT[nx]; } d=shiftDate(d,1); } }
  const doneN=days.filter(d=>byDate[d]).length;
  const plannedN=days.filter(d=>planned(d)&&(d<td||byDate[d])&&first&&d>=first).length + days.filter(d=>byDate[d]&&!planned(d)).length;
  const planTot=calView==="week"?3:days.filter(d=>planned(d)).length;
  const f=new Date(days[0]+"T12:00:00"), l=new Date(days.at(-1)+"T12:00:00");
  const label=calView==="week"?`${f.toLocaleDateString("pl-PL",{day:"numeric",month:"short"})} – ${l.toLocaleDateString("pl-PL",{day:"numeric",month:"short"})}`:f.toLocaleDateString("pl-PL",{month:"long",year:"numeric"});
  const lead=calView==="month"?(f.getDay()+6)%7:0;
  const cell=d=>{const dd=new Date(d+"T12:00:00"), s=byDate[d]?.[0], miss=!s&&planned(d)&&first&&d>=first&&d<td;
    const pl=!s&&planned(d)&&d>=td;
    const inner=s?`<span class="cdot ${s.day}">${s.day}</span>`:miss?`<span class="cdot miss" title="Zaplanowany, niezrobiony"></span>`:pl?`<span class="cdot plan pl${fut[d]||""}" title="Zaplanowany">${fut[d]||""}</span>`:`<span class="cdot none"></span>`;
    const pr=s&&Object.values(sessionBadges(s)).includes("pr");
    return `<button class="ccell ${d===td?"today":""} ${d===calSel?"sel":""}" data-act="cal-sel" data-d="${d}" ${d>td&&!s&&!fut[d]?"disabled":""} aria-label="${fmtDate(d)}${s?`, trening ${s.day}`:""}">
      <span class="cnum">${calView==="week"?["nd","pn","wt","śr","cz","pt","sb"][dd.getDay()]+" ":""}${dd.getDate()}</span>${inner}${pr?`<span class="cpr">${TROPHY}</span>`:""}</button>`};
  let detail="";
  const sel=calSel&&byDate[calSel]?.[0];
  if(calSel){
    if(!sel&&fut[calSel]) detail=`<div class="stack" style="gap:4px"><b>${fmtDate(calSel)} · plan: Trening ${fut[calSel]}</b><div class="note">${effPlan(fut[calSel]).map(e=>esc(e.name)+" "+e.sets+"×"+rng(e)).join(" · ")}</div><div class="note">Kolejność przesunie się, jeśli któryś trening wypadnie.</div></div>`;
    else if(!sel) detail=`<div class="note">${fmtDate(calSel)}: brak zapisanego treningu.</div>`;
    else if(calView!=="week"){
      detail=`<div class="stack" style="gap:4px"><div class="row" style="justify-content:space-between"><b>${fmtDate(sel.date)} · Trening ${sel.day}${sel.bw?` <span class="note num">· ${fmt(sel.bw)} kg</span>`:""}<br><span class="note num">${sessMeta(sel)}</span></b><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="mshare" data-act="fd-share-tr" data-id="${esc(sel.id)}" aria-label="Udostępnij trening jako obrazek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="btn ghost small" data-act="edit" data-id="${esc(sel.id)}">Edytuj</button></span></div>${sessRowsHTML(sel)}</div>`;

  return `<div class="card stack"><div class="row" style="justify-content:space-between"><h2>Kalendarz</h2>
      <div class="qtabs" role="tablist" style="min-width:170px"><button role="tab" data-act="cal-view" data-v="week" aria-selected="${calView==="week"}">Tydzień</button><button role="tab" data-act="cal-view" data-v="month" aria-selected="${calView==="month"}">Miesiąc</button></div></div>
    <div class="daynav" style="justify-content:space-between"><button class="btn ghost small" data-act="cal-prev" aria-label="Wcześniej">‹</button><b class="num">${label}</b><button class="btn ghost small" data-act="cal-next" aria-label="Później" ${calOff>=12?"disabled":""}>›</button>${calOff!==0?`<button class="btn ghost small" data-act="cal-now">Dziś</button>`:""}</div>
    <div class="note"><b class="num">${doneN}/${planTot}</b> ${calView==="week"?"treningi w tym tygodniu":"treningów w miesiącu"}${prCount?` · ${TROPHY} ${prCount} ${prCount===1?"rekord":"rekordy"}`:""}</div>
    <div class="cgrid ${calView}">${calView==="month"?["pn","wt","śr","cz","pt","sb","nd"].map(x=>`<span class="chead">${x}</span>`).join(""):""}${Array.from({length:lead},()=>`<span></span>`).join("")}${days.map(cell).join("")}</div>
    <div class="legend" style="flex-direction:row;flex-wrap:wrap;gap:6px 14px"><span><span class="cdot A mini">A</span> zrobiony</span><span><span class="cdot miss mini"></span> pominięty</span><span><span class="cdot plan mini"></span> zaplanowany</span><span>${TROPHY} rekord</span></div>
    ${detail}
    ${calView==="week"?(()=>{const wdn=d=>new Date(d+"T12:00:00").toLocaleDateString("pl-PL",{weekday:"long"});const L=days.filter(d=>byDate[d]);
      return L.length?`<div class="stack" style="gap:10px"><div class="label">Treningi w tym tygodniu</div>${L.map(d=>byDate[d].map(s=>`<div class="wkses ${d===calSel?"sel":""}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><div><span class="cdot ${s.day} mini">${s.day}</span> <b>${wdn(d)}, ${fmtDate(d)}</b> · Trening ${s.day}<div class="note num" style="margin:2px 0 0">${sessMeta(s)}</div></div><span class="row" style="gap:6px;flex-wrap:nowrap"><button class="mshare" data-act="fd-share-tr" data-id="${esc(s.id)}" aria-label="Udostępnij trening jako obrazek"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></button><button class="btn ghost small" data-act="edit" data-id="${esc(s.id)}">Edytuj</button></span></div>${sessRowsHTML(s)}</div>`).join("")).join("")}</div>`:`<div class="note">W tym tygodniu nie ma jeszcze zapisanego treningu.</div>`})():""}
  </div>`;
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest('[data-act="cal-view"],[data-act="cal-prev"],[data-act="cal-next"],[data-act="cal-sel"],[data-act="cal-now"]'); if(!b) return;
  if(b.dataset.act==="cal-now"){calOff=0;renderProg();return}
  const a=b.dataset.act;
  if(a==="cal-view"){calView=b.dataset.v;calOff=0;}
  if(a==="cal-prev")calOff--;
  if(a==="cal-next"&&calOff<12)calOff++;
  if(a==="cal-sel")calSel=calSel===b.dataset.d?null:b.dataset.d;
  renderProg();
});

/* ---------- podsumowanie kalorii ---------- */
let sumView="week", sumOff=0;
function sumRange(){
  const t=new Date(today()+"T12:00:00");
  if(sumView==="week"){ const wd=(t.getDay()+6)%7; const mon=new Date(t); mon.setDate(t.getDate()-wd+sumOff*7); const days=[]; for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);days.push(d.toISOString().slice(0,10))} return days; }
  const m=new Date(t.getFullYear(),t.getMonth()+sumOff,1,12); const days=[]; const mm=m.getMonth(); while(m.getMonth()===mm){days.push(m.toISOString().slice(0,10)); m.setDate(m.getDate()+1)} return days;
}
function sumTabs(){return `<div class="qtabs" role="tablist" style="min-width:230px">${[["day","Dzień"],["week","Tydzień"],["month","Miesiąc"]].map(([v,l])=>`<button role="tab" data-act="sum-view" data-v="${v}" aria-selected="${sumView===v}">${l}</button>`).join("")}</div>`}
function summaryDayHTML(){
  const d=shiftDate(today(),sumOff), items=food[d]||[], tot=dayTotals(items), goal=kcalGoal(d), G=macroGoals(d);
  const lbl=new Date(d+"T12:00:00").toLocaleDateString("pl-PL",{weekday:"short",day:"numeric",month:"short"});

  const head=`<div class="daynav" style="justify-content:space-between"><button class="btn ghost small" data-act="sum-prev" aria-label="Poprzedni dzień">‹</button><b class="num">${d===today()?"Dziś · ":""}${lbl}</b><button class="btn ghost small" data-act="sum-next" aria-label="Następny dzień" ${sumOff>=0?"disabled":""}>›</button></div>
    <div class="note">${isTrainDay(d)?"Dzień treningowy":"Dzień wolny"}${goal?` · cel ${goal} kcal`:""}</div>`;
  if(!items.length) return head+`<div class="empty">Brak wpisanego jedzenia tego dnia.</div>`;
  const saldo=goal?tot.kcal-goal:null;
  const mk=[["Białko",tot.p,G.p,"var(--m-p)",4],["Węglowodany",tot.c,G.c,"var(--m-c)",4],["Tłuszcze",tot.f,G.f,"var(--m-f)",9]];
  const kP=tot.p*4,kC=tot.c*4,kF=tot.f*9,kS=kP+kC+kF||1;
  const meals=MEALS.map(m=>[m,dayTotals(items.filter(x=>x.meal===m))]).filter(([,t])=>t.kcal>0);
  const maxM=Math.max(...meals.map(([,t])=>t.kcal),1);
  const rngTxt=g=>Array.isArray(g)?`${g[0]}–${g[1]}`:g!=null?Math.round(g):"–";
  const status=(v,g)=>{if(g==null)return"";const lo=Array.isArray(g)?g[0]:g*0.95,hi=Array.isArray(g)?g[1]:g*1.05;return v<lo?`<span class="note">za mało o ${Math.round(lo-v)} g</span>`:v>hi?`<span class="over-t">za dużo o ${Math.round(v-hi)} g</span>`:`<span style="color:var(--good);font-weight:700">✓ w normie</span>`};
  return head+`<div class="stats sumstats">
      <div class="stat"><div class="label">Zjedzone</div><div class="v num">${Math.round(tot.kcal)} kcal</div><div class="note num">${goal?`${Math.round(tot.kcal/goal*100)}% celu`:""}</div></div>
      <div class="stat"><div class="label">Saldo dnia</div><div class="v num" style="color:${saldo>0?"var(--bad)":"var(--ink)"}">${saldo!=null?sgn(saldo)+" kcal":"–"}</div><div class="note">${saldo==null?"":saldo>0?"ponad cel":"poniżej celu"}</div></div>

    <div class="stack" style="gap:6px"><div class="label">Skąd kalorie</div>
      <div style="display:flex;height:14px;border-radius:7px;overflow:hidden"><span style="width:${kP/kS*100}%;background:var(--m-p)"></span><span style="width:${kC/kS*100}%;background:var(--m-c)"></span><span style="width:${kF/kS*100}%;background:var(--m-f)"></span></div>

    </div>`;
}
function summaryHTML(){
  if(sumView==="day") return `<div class="card stack"><div class="row" style="justify-content:space-between"><h2>Podsumowanie</h2>${sumTabs()}</div>${summaryDayHTML()}</div>`;

  const avgP=logged.length?logged.reduce((a,r)=>a+r.p,0)/logged.length:0, avgC=logged.length?logged.reduce((a,r)=>a+r.c,0)/logged.length:0, avgF=logged.length?logged.reduce((a,r)=>a+r.f,0)/logged.length:0;

  // wykres kalorii

  const wdn=["nd","pn","wt","śr","cz","pt","sb"];

      else bars+=`<rect x="${x}" y="${top}" width="${w}" height="${base-top}" rx="3" fill="var(--m-kcal)" opacity=".85"/>`;
    }

    const showLbl=sumView==="week"||dd.getDate()===1||dd.getDate()%5===0;
    if(showLbl) bars+=`<text x="${L+i*bw+bw/2}" y="${H-B+16}" text-anchor="middle" font-size="${sumView==="week"?11:9}" fill="${r.d===td?"var(--ink)":"var(--muted)"}" font-weight="${r.d===td?700:400}">${sumView==="week"?wdn[dd.getDay()]:dd.getDate()}</text>${sumView==="week"?`<text x="${L+i*bw+bw/2}" y="${H-B+29}" text-anchor="middle" font-size="9.5" fill="var(--muted)">${dd.getDate()}.${String(dd.getMonth()+1).padStart(2,"0")}</text>`:""}`;
  });

  // saldo

  let sb=`<line x1="${L}" x2="${W-R}" y1="${y2(0)}" y2="${y2(0)}" stroke="var(--ink)" stroke-dasharray="5 4" opacity=".5"/><text x="${L-6}" y="${y2(0)+4}" text-anchor="end" font-size="10" fill="var(--muted)">0</text><text x="${L-6}" y="${y2(mx*0.8)+4}" text-anchor="end" font-size="10" fill="var(--muted)">+${Math.round(mx*0.8)}</text><text x="${L-6}" y="${y2(-mx*0.8)+4}" text-anchor="end" font-size="10" fill="var(--muted)">−${Math.round(mx*0.8)}</text>`;
  rows.forEach((r,i)=>{ if(!r.has||!r.goal) return; const v=r.kcal-r.goal, x=L+i*bw+pad, w=bw-2*pad; const a=y2(Math.max(0,v)), b=y2(Math.min(0,v)); sb+=`<rect x="${x}" y="${a}" width="${w}" height="${Math.max(1.5,b-a)}" rx="2" fill="${v>0?"var(--bad)":"var(--m-kcal)"}" opacity=".85"/>`; });
  const saldoChart=`<svg class="chart" viewBox="0 0 ${W} ${H2}" role="img" aria-label="Saldo kalorii względem celu">${sb}</svg>`;
  const sgn=v=>(v>0?"+":v<0?"−":"")+Math.abs(Math.round(v));

    ${logged.length?`<div class="stats sumstats">

    :`<div class="empty">Brak wpisanego jedzenia w tym okresie.</div>`}
