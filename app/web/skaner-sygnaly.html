<!doctype html>
<html lang="pl" class="lg-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sygnały skanera</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/glass.css"><script src="/glass.js"></script>
<style>
button,input,select,textarea{font-family:inherit}

:root{--ink:#F4F4F5;--soft:#B4B4BE;--faint:#7A7A86;--pos:#3DDC84;--neg:#FF6B6B;--warn:#F5B25A;--acc:#9FB3FF;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#06070c}
html,body{min-height:100%;color:var(--ink);font:14px/1.45 Geist,system-ui,sans-serif}
body{background:transparent}
.wrap{max-width:1300px;margin:0 auto;padding:22px 20px 60px}
.glass{position:relative;border-radius:20px;padding:16px 18px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em}h1 small{display:block;font-size:13px;color:var(--soft);font-weight:400;letter-spacing:0;margin-top:2px}
h2{font-size:14.5px;font-weight:650;margin:18px 4px 10px;display:flex;gap:8px;align-items:baseline}h2 small{color:var(--faint);font-weight:400;font-size:12px}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.mut{color:var(--faint);font-size:12.5px}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
.c{padding:0!important;overflow:hidden;--d:var(--pos)}.c.S{--d:var(--neg)}
.c .hd{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,color-mix(in oklab,var(--d) 14%,transparent),transparent 60%)}
.c .sym{font:700 22px Geist,system-ui,sans-serif;letter-spacing:-.02em;line-height:1}.c .sym small{display:block;font:500 11.5px 'JetBrains Mono',monospace;color:var(--faint);margin-top:5px;letter-spacing:0}
.dir{font:700 11.5px 'JetBrains Mono',monospace;padding:4px 9px;border-radius:7px}.dir.L{background:rgba(61,220,132,.16);color:var(--pos)}.dir.S{background:rgba(255,107,107,.16);color:var(--neg)}
.c .now{margin-left:auto;text-align:right}.c .now b{display:block;font:700 18px 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}.c .now small{font:12px 'JetBrains Mono',monospace}
.c .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:12px}
.stg{display:flex;gap:4px}.stg span{flex:1;text-align:center;font:600 10.5px Geist,system-ui,sans-serif;padding:5px 2px;border-radius:7px;background:rgba(255,255,255,.05);color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stg span.done{background:color-mix(in oklab,var(--d) 22%,transparent);color:var(--ink)}.stg span.cur{background:var(--d);color:#071;color:#08110c}
.lv{display:grid;grid-template-columns:1.25fr 1fr;gap:8px}
.box{border-radius:12px;padding:9px 11px;background:rgba(255,255,255,.04);border:1px solid var(--line);min-width:0}
.box small{display:block;font:600 10.5px Geist,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.box b{display:block;font:700 15.5px 'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box em{font:12px 'JetBrains Mono',monospace;font-style:normal}
.box.en{border-color:rgba(159,179,255,.35);background:rgba(159,179,255,.08)}.box.sl{border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.06)}
.tps{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.tp{border-radius:10px;padding:7px 9px;background:rgba(61,220,132,.06);border:1px solid rgba(61,220,132,.22)}
.tp small{display:flex;justify-content:space-between;font:600 10.5px Geist,system-ui,sans-serif;color:var(--faint)}.tp b{display:block;font:700 13.5px 'JetBrains Mono',monospace;margin-top:2px}.tp em{font:11px 'JetBrains Mono',monospace;font-style:normal;color:var(--pos)}
.tp.hit{background:rgba(61,220,132,.2);border-color:var(--pos)}.tp.hit small:after{content:"✓";color:var(--pos)}
.lad{position:relative;height:44px;margin:6px 4px 0}
.lad .rail{position:absolute;left:0;right:0;top:18px;height:8px;border-radius:8px;background:rgba(255,255,255,.06)}
.lad .zl,.lad .zp,.lad .ze{position:absolute;top:18px;height:8px}.lad .zl{background:linear-gradient(90deg,rgba(255,107,107,.6),rgba(255,107,107,.15));border-radius:8px 0 0 8px}.lad .zp{background:linear-gradient(90deg,rgba(61,220,132,.15),rgba(61,220,132,.65));border-radius:0 8px 8px 0}
.lad .ze{top:12px;height:20px;border-radius:5px;background:rgba(159,179,255,.35);border:1px solid rgba(159,179,255,.8);min-width:3px}
.lad .m{position:absolute;top:10px;width:2px;height:24px;transform:translateX(-1px)}
.lad .m i{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font:600 9.5px 'JetBrains Mono',monospace;white-space:nowrap;font-style:normal}
.lad .m.sl{background:var(--neg)}.lad .m.sl i{color:var(--neg)}.lad .m.mt{background:var(--pos)}.lad .m.mt i{color:var(--pos)}.lad .m.hit{opacity:.5}
.lad .px{position:absolute;top:30px;transform:translateX(-50%);font:700 10px 'JetBrains Mono',monospace;color:#0b0b12;background:#fff;padding:1px 6px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 10px rgba(0,0,0,.5)}
.lad .px:before{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);border:4px solid transparent;border-bottom-color:#fff;border-top:0}
.meta{display:flex;gap:6px;flex-wrap:wrap}.meta span{font:11.5px Geist,system-ui,sans-serif;color:var(--soft);padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.05)}.meta b{color:var(--ink);font-weight:600}
.adv{padding:10px 12px;border-radius:12px;background:rgba(159,179,255,.08);border:1px solid rgba(159,179,255,.2);font-size:13px;display:flex;gap:8px}
.okx .p{display:grid;grid-template-columns:minmax(0,1.2fr) repeat(3,minmax(0,1fr)) minmax(0,2fr);gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);font-size:13px}
.okx .p:first-of-type{border-top:0}
.al{color:var(--warn);font-weight:600}
.tbl{width:100%;font-size:12.5px}.tbl td,.tbl th{padding:7px 6px;border-top:1px solid var(--line);text-align:left}.tbl th{color:var(--faint);font-weight:500;border:0}
.empty{padding:28px;text-align:center;color:var(--soft)}
.btn{border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:var(--ink);font:600 13px Geist,system-ui,sans-serif;padding:8px 13px;border-radius:999px;cursor:pointer}
code{font:12px 'JetBrains Mono',monospace;background:rgba(255,255,255,.07);padding:1px 5px;border-radius:5px}
@media(max-width:700px){.wrap{padding:16px 14px 50px}.cards{grid-template-columns:minmax(0,1fr)}.okx .p{grid-template-columns:1fr 1fr}.okx .p>:last-child{grid-column:1/-1}.hide-m{display:none}}

.team{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:12px}
.tm{padding:13px 15px!important}.tm h3{font:650 13.5px Geist,system-ui,sans-serif;margin:0 0 6px;display:flex;justify-content:space-between;gap:8px;align-items:center}.tm h3 small{font:500 11px 'JetBrains Mono',monospace;color:var(--faint)}
.tm p{margin:0;font-size:13px;color:var(--soft);line-height:1.5}.tm b{color:var(--ink)}.tm .w{color:var(--warn,#F5B25A)}
.tm ul{margin:4px 0 0;padding:0;list-style:none;font:12px 'JetBrains Mono',monospace;color:var(--soft)}.tm li{padding:3px 0;border-top:1px solid var(--line)}.tm li:first-child{border-top:0}
.fold{cursor:pointer;user-select:none}.fold .chev{display:inline-block;transition:transform .2s;color:var(--faint);margin-right:2px}.fold.closed .chev{transform:rotate(-90deg)}
#cls:has(.tbl:empty){display:none}
#team[hidden]{display:none}#tmh small b{font-weight:600}#tmh .w{color:var(--warn,#F5B25A)}
.c .sym .dir{vertical-align:middle;margin-left:4px;position:relative;top:-2px}
.box .mv{display:inline-block;margin-left:4px;padding:1px 6px;border-radius:5px;background:rgba(255,255,255,.08);color:var(--soft);letter-spacing:0;text-transform:none;font-weight:600}
.box .was{display:block;font:11px 'JetBrains Mono',monospace;color:var(--faint);margin-top:2px}
@media(max-width:700px){
 .wrap{display:flex;flex-direction:column}
 .top{flex-wrap:wrap;gap:8px}.top h1 small{font-size:12.5px}
 .c .hd{padding:12px 14px 10px;gap:8px}.c .sym{font-size:20px}.c .now b{font-size:16px}.c .now small{font-size:11px}
 .c .body{padding:10px 12px 12px;gap:10px}
 .lv{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
 .box{padding:8px 10px}.box b{font-size:14px}.box small{font-size:9.5px;letter-spacing:.05em}
 .tps{grid-template-columns:repeat(auto-fit,minmax(60px,1fr))}.tp{padding:6px 8px}.tp b{font-size:12.5px}
 .stg span{font-size:10px;padding:5px 1px}
 .adv{font-size:12.5px;padding:9px 10px}
 .meta span{font-size:11px}
 .team{grid-template-columns:minmax(0,1fr);gap:8px;margin-top:0}
 .okx{padding:12px 13px!important}.okx .p{gap:4px 10px;font-size:12.5px}
 .tbl{font-size:12px}
 #tmh{flex-wrap:wrap;row-gap:2px}#tmh small{flex-basis:100%;margin-left:18px;white-space:normal}
}
.tp .cl{display:block;font:600 10.5px Geist,system-ui,sans-serif;color:var(--soft);margin-top:3px}.tp.hit .cl{color:var(--pos)}
</style>
</head>
<body class="lg">
<div class="lg-bg" aria-hidden="true"></div>
<div class="wrap">
 <div class="top"><h1>Sygnały<small>Aktualne sygnały skanera z wejściem, SL i celami. Centrum nic nie zleca – tylko pokazuje i przypomina.</small></h1>
  <div><span class="mut" id="upd"></span> <button class="btn" id="rf">↻ Odśwież</button></div></div>
 <section class="glass okx" id="okx" hidden></section>
 <h2 class="fold" id="tmh" role="button" tabindex="0"><span class="chev">▾</span>🧠 Zespół skanera <small id="tms"></small></h2>
 <div class="team" id="team"></div>
 <h2>Aktywne <small id="na"></small></h2>
 <div class="cards" id="act"><div class="glass empty">Ładuję…</div></div>
 <h2 class="fold" id="clh" role="button" tabindex="0"><span class="chev">▾</span>Ostatnio zamknięte <small id="cln">21 dni</small></h2>
 <section class="glass" id="cls"><table class="tbl" id="cl"></table></section>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=x=>x==null?'–':Math.abs(x)>=1000?x.toLocaleString('pl',{maximumFractionDigits:2}):(+x).toPrecision(6).replace(/\.?0+$/,'');
const pc=(a,b,d)=>a&&b?((a/b-1)*100*(d==='SHORT'?-1:1)):null;
const sp=x=>x==null?'':`<span class="${x>=0?'pos':'neg'}">${x>=0?'+':''}${x.toFixed(2)}%</span>`;
const ago=s=>{const t=(Date.now()-new Date(String(s).replace(' ','T')+'Z'))/1000;return t<3600?Math.round(t/60)+' min temu':t<86400?Math.round(t/3600)+' h temu':Math.round(t/86400)+' dni temu'};
function zone(r){const a=r.entry_min,b=r.entry_max;return a!=null&&b!=null&&a!==b?[Math.min(a,b),Math.max(a,b)]:null}
function ladder(r){const d=(r.direction||'').toUpperCase(),tps=[1,2,3,4].map(i=>({i,v:r['tp'+i],hit:r['tp'+i+'_hit']})).filter(t=>t.v),Z=zone(r);
 const sl=r.stop_loss,osl=r.original_stop_loss&&r.original_stop_loss!==sl?r.original_stop_loss:null;
 const vals=[sl,osl,r.entry,r.price,...(Z||[]),...tps.map(t=>t.v)].filter(v=>v!=null);let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*.05||1;lo-=pad;hi+=pad;
 const X=v=>{let p=(v-lo)/(hi-lo)*100;if(d==='SHORT')p=100-p;return Math.max(0,Math.min(100,p))};
 const z=(a,b,c)=>{const x1=X(a),x2=X(b);return `<div class="${c}" style="left:${Math.min(x1,x2)}%;width:${Math.abs(x2-x1)}%"></div>`};
 const far=tps.length?tps[tps.length-1].v:r.entry;
 return `<div class="lad"><div class="rail"></div>${z(osl||sl,r.entry,'zl')}${z(r.entry,far,'zp')}${Z?z(Z[0],Z[1],'ze'):`<div class="ze" style="left:${X(r.entry)}%;width:3px"></div>`}
  ${osl?`<div class="m sl hit" style="left:${X(osl)}%"></div>`:''}<div class="m sl" style="left:${X(sl)}%"><i>SL</i></div>
  ${tps.map(t=>`<div class="m mt ${t.hit?'hit':''}" style="left:${X(t.v)}%"><i>TP${t.i}</i></div>`).join('')}
  ${r.price?`<div class="px" style="left:${X(r.price)}%">${f(r.price)}</div>`:''}</div>`}
function stage(r){const st=(r.status||'').toUpperCase(),tps=[1,2,3,4].filter(i=>r['tp'+i]);
 const inPos=r.tp1_hit||/ACTIVE|FILLED|IN_POSITION|ENTERED|RUNNING/.test(st)||r.break_even_set;
 const sm=innerWidth<600,steps=[sm?'Wejście':'Strefa wejścia',sm?'Pozycja':'W pozycji',...tps.map(i=>'TP'+i)];
 let cur=0;if(inPos)cur=1;tps.forEach((i,k)=>{if(r['tp'+i+'_hit'])cur=2+k+1});cur=Math.min(cur,steps.length-1);
 if(tps.length&&r['tp'+tps[tps.length-1]+'_hit'])cur=steps.length;
 return `<div class="stg">${steps.map((s,i)=>`<span class="${i<cur?'done':i===cur?'cur':''}">${s}</span>`).join('')}</div>`}
// podział pozycji na TP – ta sama reguła co w skanerze (trade_plan_engine: wg reżimu rynku, ostatni TP zamyka resztę)
const TPS={STRONG_TREND:[20,25,25,30],TREND:[25,30,25,20],TRANSITION:[30,35,20,15],RANGE:[40,35,15,10]};
function tpSplit(reg,n){const w=(TPS[(reg||'').toUpperCase()]||TPS.TREND).slice(0,n),t=w.reduce((a,b)=>a+b,0)||1;const o=w.map(x=>Math.round(x/t*100));if(o.length)o[o.length-1]+=100-o.reduce((a,b)=>a+b,0);if(o.length)o[o.length-1]=100;return o}
function card(r){const d=(r.direction||'').toUpperCase(),Z=zone(r),moved=r.original_stop_loss&&r.original_stop_loss!==r.stop_loss;
 const ent=Z?`${f(Z[0])} – ${f(Z[1])}`:`≈ ${f(r.entry)}`;
 const tpl=[1,2,3,4].filter(i=>r['tp'+i]),sp_=tpSplit(r.market_regime,tpl.length);
 const tps=tpl.map((i,k)=>`<div class="tp ${r['tp'+i+'_hit']?'hit':''}"><small>TP${i}</small><b>${f(r['tp'+i])}</b><em>${(()=>{const x=pc(r['tp'+i],r.entry,d);return x==null?'':(x>=0?'+':'')+x.toFixed(2)+'%'})()}</em><span class="cl">➡️ wyjście ${k===tpl.length-1&&tpl.length>1?'100% (reszta)':sp_[k]+'%'}</span></div>`).join('');
 return `<div class="glass c ${d[0]}"><div class="hd"><div class="sym">${esc(r.base)} <span class="dir ${d[0]}">${d}</span><small>${esc(r.timeframe||'')} · ${ago(r.created_at)}</small></div>
   <div class="now">${r.price?`<b>${f(r.price)}</b><small>${sp(r.move)}${r.r_now!=null?` · ${r.r_now>=0?'+':''}${r.r_now}R`:''}</small>`:'<small class="mut">brak ceny</small>'}</div></div>
  <div class="body">${stage(r)}
   <div class="lv"><div class="box en"><small>${Z?'Strefa wejścia':'Wejście (środek strefy)'}</small><b>${ent}</b></div>
    <div class="box sl"><small>Stop loss${moved?' <span class="mv">przesunięty</span>':''}</small><b>${f(r.stop_loss)}</b><em class="${(pc(r.stop_loss,r.entry,d)||0)>=0?'pos':'neg'}">${(()=>{const x=pc(r.stop_loss,r.entry,d);return x==null?'':(x>=0?'+':'')+x.toFixed(2)+'%'})()}</em>${moved?`<span class="was">był ${f(r.original_stop_loss)}</span>`:''}</div>
    <div class="tps">${tps}</div></div>
   ${r.entry&&r.stop_loss?ladder(r):''}
   <div class="adv"><span>💡</span><span>${esc(r.advice||'')}</span></div>
   <div class="meta"><span>elite <b>${r.elite_score!=null?Math.round(r.elite_score):'–'}</b></span><span>R:R <b>${r.risk_reward!=null?(+r.risk_reward).toFixed(2):'–'}</b></span><span>wielkość <b>${r.position_size_percent??'–'}%</b></span>${r.market_regime?`<span>${esc(r.market_regime)}</span>`:''}<span>${esc(r.status||'')}</span></div>
  </div></div>`}
function okx(o){const el=$('okx');el.hidden=false;
 if(!o.configured){el.innerHTML=`<b>🔒 Strażnik pozycji OKX</b><p class="mut" style="margin-top:6px">Żeby centrum porównywało Twoje pozycje na OKX ze skanerem i przypominało o przesunięciu SL, utwórz na OKX klucz API z uprawnieniem <b>tylko „Odczyt”</b> i dopisz do <code>/root/social/.env</code>:<br><code>OKX_RO_KEY=…</code> <code>OKX_RO_SECRET=…</code> <code>OKX_RO_PASSPHRASE=…</code>, potem <code>social-update</code>. Centrum nic nie zleca – zmiany robisz sam w aplikacji OKX.</p>`;return}
 if(o.ok===false){el.innerHTML=`<b>🔒 Pozycje OKX</b><p class="neg" style="margin-top:6px">${esc(o.error)}</p>`;return}
 const warn=/trade|withdraw/.test(o.perm||'')?`<p class="al" style="margin:6px 0">Ten klucz ma uprawnienia „${esc(o.perm)}”. Do podglądu wystarczy „Odczyt” – utwórz nowy klucz tylko do odczytu.</p>`:'';
 el.innerHTML=`<b>🔒 Pozycje OKX</b> <span class="mut">tylko odczyt · ${o.positions.length} otwartych${o.site?' · '+esc(o.site.replace('https://','')):''} · sprawdzane co minutę</span>${warn}
  ${o.positions.map(p=>`<div class="p"><div><b>${esc(p.base)}</b> <span class="dir ${p.dir[0]}">${p.dir}</span> <span class="mut">x${esc(p.lev)}</span></div>
   <div class="mono"><span class="mut">śr.</span> ${f(p.avg)}</div><div class="mono"><span class="mut">SL</span> ${p.sl.length?p.sl.map(f).join(', '):'<span class="neg">brak</span>'}</div>
   <div class="mono">${sp(p.uplr)}</div><div>${p.alert?`<span class="al">${esc(p.alert)}</span>`:`<span class="mut">${esc(p.note||'')}</span>`}</div></div>`).join('')||'<p class="mut" style="margin-top:6px">Brak otwartych pozycji.</p>'}`}
const RES={WIN:'<span class="pos">✓ zysk</span>',PARTIAL_WIN:'<span class="pos">◐ część zysku</span>',LOSS:'<span class="neg">✗ strata</span>',BREAK_EVEN:'⚖️ na zero',BE:'⚖️ na zero',EXPIRED:'<span class="mut">wygasł</span>',INVALIDATED:'<span class="mut">anulowany</span>',CANCELLED:'<span class="mut">anulowany</span>',MISSED:'<span class="mut">bez wejścia</span>'};
async function load(){let D;try{D=await (await fetch('/api/scanner/signals')).json()}catch(e){return}
 if(!D.ok){$('act').innerHTML=`<div class="glass empty">${esc(D.error)}</div>`;return}
 $('na').textContent=D.active.length;$('cln').textContent=`21 dni · ${D.closed.length}`;
 $('act').innerHTML=D.active.map(card).join('')||'<div class="glass empty">Teraz nie ma aktywnych sygnałów. Skaner wysyła max 4 dziennie.</div>';
 $('cl').innerHTML=`<tr><th>Symbol</th><th>Kier.</th><th class="hide-m">Entry</th><th class="hide-m">SL</th><th class="hide-m">TP1</th><th>Wynik</th><th>PnL</th><th class="hide-m">Zamknięty</th></tr>`+
  D.closed.map(r=>`<tr><td><b>${esc(r.symbol.split('/')[0])}</b></td><td><span class="dir ${(r.direction||'?')[0]}">${esc(r.direction)}</span></td><td class="mono hide-m">${zone(r)?f(zone(r)[0])+'–'+f(zone(r)[1]):f(r.entry)}</td><td class="mono hide-m">${f(r.original_stop_loss||r.stop_loss)}</td><td class="mono hide-m">${f(r.tp1)}</td>
   <td>${RES[(r.result||r.status||'').toUpperCase()]||esc(r.result||r.status)}</td><td class="mono">${r.pnl!=null?sp(+r.pnl):''}</td><td class="mut hide-m">${r.closed_at?ago(r.closed_at):''}</td></tr>`).join('');
 okx(D.okx||{});$('upd').textContent='odświeżone '+new Date().toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})}

 `<div class="glass tm"><h3>🔗 Strażnik korelacji<small>co 5 min</small></h3>${(C.warn||[]).length?C.warn.map(w=>`<p class="w">⚠️ ${w.n}× ${esc(w.dir)} na ${esc(w.cls)}: ${esc(w.symbols.join(', '))} (${w.size}% kapitału) – w praktyce jeden zakład.</p>`).join(''):`<p>Otwarte sygnały (${C.open??'–'}) nie dublują ryzyka.</p>`}</div>`+
 `<div class="glass tm"><h3>🗓 Kalendarz makro<small>USA · ważne</small></h3>${M.length?`<ul>${M.map(e=>`<li>${tt(e.t)} · ${esc(e.pl||e.title)}</li>`).join('')}</ul>`:'<p>W tym tygodniu brak ważnych danych z USA (albo kalendarz się jeszcze nie pobrał).</p>'}</div>`+
 `<div class="glass tm"><h3>🏋️ Trener<small>nd 20:30</small></h3>${K.n?`<p>Tydzień: <b>${K.n}</b> pozycji · w strefie <b>${K.in_zone}/${K.zone_checked||'–'}</b> · z SL <b>${K.with_sl}/${K.n}</b></p>${(K.tips||[]).map(t=>`<p class="w">• ${esc(t)}</p>`).join('')}`:'<p>Zbiera Twoje wejścia z OKX (tylko odczyt) – pierwsza ocena w niedzielę.</p>'}</div>`}
team();setInterval(team,60000);
