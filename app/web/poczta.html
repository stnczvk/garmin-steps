<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Poczta</title>
<script>let t='dark';try{t=localStorage.getItem('motyw')||'dark'}catch(e){}if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&display=swap">
<link rel="stylesheet" href="/glass.css"><link rel="stylesheet" href="/v3.css"><script src="/glass.js"></script>
<style>
body{margin:0;color:var(--ink);background:var(--lg-base);font:14px/1.45 Geist,system-ui,sans-serif}
.wrap{max-width:1480px;margin:0 auto;padding:24px 26px 40px}
h1{font-size:26px;font-weight:650;margin:0}.sub{color:var(--soft);margin:6px 0 16px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.t{background:linear-gradient(180deg,var(--v3-s2),var(--v3-s1));border:1px solid var(--line);box-shadow:inset 0 1px 0 var(--v3-hi),var(--v3-sh);border-radius:22px;min-width:0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.q{flex:1 1 220px;min-width:0;background:var(--v3-s1);border:1px solid var(--line);border-radius:12px;padding:9px 12px;color:var(--ink);font:inherit;font-size:13.5px;outline:none}
.sg{display:inline-flex;background:var(--v3-s1);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.sg button{border:0;background:none;color:var(--soft);font:600 12.5px Geist,system-ui;padding:6px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.sg button.on{background:var(--v3-s3);color:var(--ink);box-shadow:inset 0 1px 0 var(--v3-hi)}
.ib{height:36px;border-radius:11px;border:1px solid var(--line);background:var(--v3-s2);color:var(--ink);font:600 13px Geist,system-ui;padding:0 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.ib.pri{background:linear-gradient(135deg,#6e8bff,#b59cff);color:#fff;border-color:transparent}.ib:disabled{opacity:.5}
.ib svg{width:15px;height:15px}
.gr{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:14px;align-items:start;height:calc(100vh - 170px);min-height:420px}
.ls{height:100%;overflow:auto;padding:6px}
.it{display:flex;gap:10px;padding:11px 12px;border-radius:14px;cursor:pointer;border:1px solid transparent;transition:background .15s}
.it:hover{background:rgba(127,127,160,.08)}.it.on{background:color-mix(in srgb,#6e8bff 14%,transparent);border-color:color-mix(in srgb,#6e8bff 40%,transparent)}
.it .d{width:8px;height:8px;border-radius:50%;background:#5ad1ff;margin-top:6px;flex:none;visibility:hidden}.it.un .d{visibility:visible}.it.un b{font-weight:700}
.it .m{flex:1;min-width:0}.it b{display:block;font-weight:550;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{display:block;color:var(--ink);opacity:.85;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.it p{margin:3px 0 0;color:var(--soft);font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .r{text-align:right;flex:none;font-size:11.5px;color:var(--soft)}.ch{display:inline-block;margin-top:5px;font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:20px;background:var(--v3-s3);color:var(--soft)}
.ch.ws{background:rgba(110,139,255,.18);color:#a9b8ff}.ch.et{background:rgba(61,220,132,.15);color:#5fe39b}.ch.pr{background:rgba(255,194,75,.16);color:#ffc24b}.ch.ok{background:rgba(61,220,132,.15);color:#5fe39b}
.pv{height:100%;overflow:auto;padding:20px 22px}
.pv h2{font-size:19px;margin:0 0 6px;line-height:1.3}.pv .fr{color:var(--soft);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai{margin:14px 0;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,#6e8bff 10%,transparent);border:1px solid color-mix(in srgb,#6e8bff 30%,transparent);font-size:13.5px}
.ai b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a9b8ff;margin-bottom:4px}
.bd{white-space:pre-wrap;font-size:13.5px;line-height:1.55;padding:4px 2px 10px;border-bottom:1px solid var(--line)}
.cp{margin-top:14px}.cp label{font-size:12px;font-weight:650;color:var(--soft);letter-spacing:.04em;text-transform:uppercase}
.cp textarea{width:100%;min-height:150px;margin-top:6px;resize:vertical;background:var(--v3-s1);border:1px solid var(--line);border-radius:14px;padding:11px 13px;color:var(--ink);font:inherit;font-size:13.5px;line-height:1.5;box-sizing:border-box}
.ac{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.emp{color:var(--soft);text-align:center;padding:60px 20px}
.back{display:none}
.cf{max-width:460px;display:grid;gap:9px;padding:20px}.cf input{background:var(--v3-s1);border:1px solid var(--line);border-radius:11px;padding:10px 12px;color:var(--ink);font:inherit}
.cf small{color:var(--soft);line-height:1.5}
@media(max-width:860px){
 .wrap{padding:14px 12px calc(100px + env(safe-area-inset-bottom))}h1{font-size:22px}
 .gr{grid-template-columns:1fr;height:auto}.ls{height:auto;max-height:none}.pv{display:none;height:auto}
 body.det .ls{display:none}body.det .pv{display:block}body.det .bar{display:none}.back{display:inline-flex;margin-bottom:12px}
}
</style>
</head>
<body>
<div class="wrap">
 <h1>Poczta</h1>
 <div class="sub" id="sub">Ładuję…</div>
 <div class="bar"><input class="q" id="q" placeholder="Szukaj: nadawca, temat, treść…" autocomplete="off">
  <div class="sg" id="fl"><button data-f="all" class="on">Wszystkie</button><button data-f="un">Nieprzeczytane</button><button data-f="wspolpraca">Współprace</button><button data-f="etsy">Etsy</button><button data-f="praca">Praca</button><button data-f="inne">Inne</button></div>
  <button class="ib" id="rf" title="Sprawdź teraz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Sprawdź</button></div>
 <div class="gr" data-noicon><div class="t ls" id="ls"></div><div class="t pv" id="pv"><div class="emp">Wybierz wiadomość z listy.</div></div></div>
</div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T=(m,e)=>window.toast?toast(m,e):alert(m);
const CAT={wspolpraca:['Współpraca','ws'],etsy:['Etsy','et'],praca:['Praca','pr'],konto:['Konto',''],newsletter:['Newsletter',''],spam:['Spam',''],inne:['Inne','']};
let D=null,F='all',SEL=null;
const name=x=>(x.from||'').split('<')[0].replace(/"/g,'').trim()||x.addr;
const when=t=>{const d=new Date(t*1000),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('pl',{day:'numeric',month:'short'})};
async function load(){const r=await fetch('/api/mail').then(r=>r.json()).catch(()=>null);D=r;
 if(!r){$('sub').textContent='Poczta niedostępna.';return}
 if(!r.configured){$('sub').textContent='Poczta nie jest połączona.';$('ls').innerHTML=`<div class="cf"><b>Połącz pocztę iCloud</b><input id="ce" type="email" placeholder="adres iCloud" autocomplete="off"><input id="cpw" type="password" placeholder="hasło dla aplikacji" autocomplete="new-password"><button class="ib pri" id="cc">Połącz</button><small>Hasło dla aplikacji: account.apple.com → Logowanie i bezpieczeństwo → Hasła dla aplikacji. Zostaje tylko na serwerze centrum.</small></div>`;
  $('cc').onclick=async()=>{const x=await fetch('/api/mail/cfg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('ce').value,password:$('cpw').value})}).then(r=>r.json()).catch(()=>({ok:false}));if(!x.ok)return T(x.error||'Nie udało się',1);T('Połączono – pobieram maile…');setTimeout(load,9000)};return}
 const m=r.at?Math.round((Date.now()/1000-r.at)/60):null;
 $('sub').innerHTML=`${esc(r.email)} · ${r.unread?`<b>${r.unread} nieprzeczytane</b>`:'wszystko przeczytane'}${m!=null?` · sprawdzono ${m<1?'przed chwilą':m+' min temu'}`:''}${r.error?` · <span style="color:var(--bad)">błąd: ${esc(r.error)}</span>`:''}`;
 list();if(SEL)show(SEL,true)}
function list(){const q=$('q').value.trim().toLowerCase();
 const L=(D?.items||[]).filter(x=>F==='all'||(F==='un'?!x.seen:F==='inne'?!['wspolpraca','etsy','praca'].includes(x.cat):x.cat===F)).filter(x=>!q||(x.from+' '+x.subject+' '+x.body+' '+(x.summary||'')).toLowerCase().includes(q));
 $('ls').innerHTML=L.length?L.map(x=>{const c=CAT[x.cat]||CAT.inne;return `<div class="it${x.seen?'':' un'}${SEL===x.uid?' on':''}" data-u="${esc(x.uid)}"><i class="d"></i><div class="m"><b>${esc(name(x))}</b><small>${esc(x.subject)}</small><p>${esc(x.summary||(x.body||'').slice(0,140))}</p></div><div class="r">${when(x.ts)}<br><span class="ch ${x.replied?'ok':c[1]}">${x.replied?'odpowiedziano':c[0]}</span></div></div>`}).join(''):'<div class="emp">Brak wiadomości.</div>'}
function show(u,keep){const x=(D?.items||[]).find(i=>i.uid===u);if(!x)return;SEL=u;document.body.classList.add('det');
 const draftKeep=keep&&$('rt')?$('rt').value:null;
 $('pv').innerHTML=`<button class="ib back" id="bk">‹ Wróć</button><h2>${esc(x.subject)}</h2><div class="fr"><b style="color:var(--ink)">${esc(name(x))}</b><span>&lt;${esc(x.addr)}&gt;</span><span>· ${new Date(x.ts*1000).toLocaleString('pl',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</span></div>
  ${x.summary?`<div class="ai"><b>W skrócie</b>${esc(x.summary)}</div>`:''}<div class="bd">${esc(x.body||'(brak treści)')}</div>
  <div class="cp"><label>Odpowiedź</label><textarea id="rt" placeholder="Napisz odpowiedź…">${esc(draftKeep??x.draft??'')}</textarea>
  <div class="ac"><button class="ib pri" data-a="reply">Wyślij odpowiedź</button><button class="ib" data-a="draft">Nowy szkic AI</button><button class="ib" data-a="${x.seen?'unseen':'open'}">${x.seen?'Oznacz jako nieprzeczytane':'Oznacz jako przeczytane'}</button></div></div>`;
 $('bk').onclick=()=>{document.body.classList.remove('det');SEL=null;list()};
 list();if(!x.seen&&!keep){x.seen=true;fetch(`/api/mail/${encodeURIComponent(u)}/open`,{method:'POST'});setTimeout(()=>{list();show(u,true)},50)}}
$('ls').addEventListener('click',e=>{const it=e.target.closest('.it');if(it)show(it.dataset.u)});
$('pv').addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||!SEL)return;const a=b.dataset.a,x=D.items.find(i=>i.uid===SEL);
 if(a==='reply'){const t=$('rt').value.trim();if(!t)return T('Napisz odpowiedź',1);if(!confirm(`Wysłać odpowiedź do ${x.addr}?`))return}
 b.disabled=true;const r=await fetch(`/api/mail/${encodeURIComponent(SEL)}/${a}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:$('rt')?.value||''})}).then(r=>r.json()).catch(()=>({ok:false,error:'brak połączenia'}));b.disabled=false;
 if(!r.ok)return T(r.error||'Nie udało się',1);
 if(a==='draft'){$('rt').value=r.draft||'';x.draft=r.draft;return T('Nowy szkic gotowy')}
 if(a==='reply'){x.replied=true;T('Wysłano ✉️');window.confettiAt&&confettiAt(b,40)}
 if(a==='unseen')x.seen=false;if(a==='open')x.seen=true;list();show(SEL,true)});
$('fl').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;F=b.dataset.f;$('fl').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));list()};
$('q').oninput=list;
$('rf').onclick=async()=>{await fetch('/api/mail/refresh',{method:'POST'});T('Sprawdzam pocztę…');setTimeout(load,9000)};
window.load=load;load();setInterval(()=>{if(!document.hidden&&!(document.activeElement&&document.activeElement.id==='rt'))load()},60000);
</script>
</body>
</html>
