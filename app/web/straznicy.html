<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Strażnicy</title>
<script>let t='dark';try{t=localStorage.getItem('motyw')||'dark'}catch(e){}if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="/glass.css"><script src="/glass.js"></script>
<style>
:root{--ink:#F4F4F5;--soft:#B4B4BE;--faint:#7A7A86;--ok:#3DDC84;--warn:#F5B25A;--fail:#FF5C6C;--idle:#6B7088;--line:rgba(255,255,255,.08)}
:root[data-theme=light]{--ink:#0B0B12;--soft:#4A4A57;--faint:#80808C;--ok:#16A34A;--warn:#C27A06;--fail:#DC2F45;--idle:#9CA0B0;--line:rgba(0,0,0,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#06070c}html[data-theme=light]{background:#eef0f8}
html,body{min-height:100%;color:var(--ink);font:14px/1.45 Geist,system-ui,sans-serif}
body{background:transparent}
.wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
.glass{position:relative;border-radius:22px;padding:16px 18px}
.top{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-bottom:18px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px 'JetBrains Mono',monospace}
.top h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:-.02em}
.top p{color:var(--soft);margin-top:3px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;color:var(--soft)}
.chip i{width:8px;height:8px;border-radius:50%}
.top .btns{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid rgba(255,255,255,.15);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.04));color:var(--ink);font:600 13px Geist;padding:9px 14px;border-radius:999px;cursor:pointer}
.btn:disabled{opacity:.5}
.area{margin-bottom:16px}
.area h2{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:600;margin:0 4px 10px}
.dots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dot{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 10px 14px;cursor:pointer;transition:transform .25s}
.dot:hover{transform:translateY(-3px)}
.orb{--c:var(--idle);width:64px;height:64px;border-radius:50%;position:relative;display:grid;place-items:center;font-size:26px;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 38%),radial-gradient(circle at 50% 60%,var(--c),color-mix(in oklab,var(--c) 40%,#000) 75%);
 box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 8px 26px -6px var(--c),0 0 32px -6px var(--c);animation:breathe 4s ease-in-out infinite}
.orb:after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);opacity:0;animation:wave 4s ease-out infinite}
.orb span{filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.ok .orb{--c:var(--ok)}.warn .orb{--c:var(--warn);animation-duration:2.2s}.fail .orb{--c:var(--fail);animation-duration:1.1s}.idle .orb{--c:var(--idle);animation:none;opacity:.75}
.warn .orb:after{animation-duration:2.2s}.fail .orb:after{animation-duration:1.1s}.idle .orb:after{display:none}
@keyframes breathe{50%{transform:scale(1.06);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 10px 30px -4px var(--c),0 0 46px -4px var(--c)}}
@keyframes wave{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
.dot b{font-size:14px}.dot small{font-size:11.5px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.9em}
.hist{display:flex;gap:2px;width:100%;max-width:120px;height:10px}
.hist i{flex:1;border-radius:2px;background:var(--idle)}.hist i.ok{background:var(--ok)}.hist i.warn{background:var(--warn)}.hist i.fail{background:var(--fail)}
#sheet{position:fixed;inset:0;z-index:10;background:rgba(4,5,10,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px}
#sheet.open{display:flex}
.sh{width:min(520px,100%);max-height:90vh;overflow:auto;padding:22px;border-radius:24px}
.sh .hd{display:flex;align-items:center;gap:14px;margin-bottom:12px}.sh .orb{width:54px;height:54px;font-size:22px}
.sh h3{font-size:19px}.sh .st{font-size:12.5px;color:var(--soft)}
.sh .msg{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.06);font-size:14px;margin:10px 0}
.sh .hist{max-width:none;height:16px;margin:8px 0 4px}
.sh .x{position:absolute;right:14px;top:12px;background:none;border:0;color:var(--soft);font-size:24px;cursor:pointer}
.plog{font:12px 'JetBrains Mono',monospace;color:var(--soft);margin-top:10px;display:flex;flex-direction:column;gap:5px}
.plog .bad{color:var(--fail)}
.mut{color:var(--faint);font-size:12px}
.stage3d{padding:0!important;overflow:hidden;margin-bottom:16px;position:relative}
#c3{display:block;width:100%;height:min(52vh,460px);min-height:300px;cursor:grab;touch-action:none}
.h3d{position:absolute;top:10px;right:14px;font:11px 'JetBrains Mono',monospace;color:var(--faint)}
.vt{display:inline-flex;gap:2px;padding:3px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line);margin-bottom:14px}
.vt button{border:0;background:transparent;color:var(--soft);font:600 12.5px Geist,system-ui;padding:6px 12px;border-radius:8px;cursor:pointer}
.vt button.on{background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
body.m-office .dash-only{display:none!important}body.m-dash .office-only{display:none!important}
body.m-office #c3{height:calc(100vh - 230px);max-height:none;min-height:340px}
@media(max-width:600px){.wrap{padding:16px 14px 50px}.dots{grid-template-columns:repeat(2,minmax(0,1fr))}.top .btns{margin-left:0;width:100%}.top .btns .btn{flex:1}}
@media(prefers-reduced-motion:reduce){.orb,.orb:after{animation:none}}
</style>
</head>
<body class="lg">
<div class="lg-bg" aria-hidden="true"></div>
<div class="wrap">
 <div class="top">
  <div class="ring" id="ring"></div>
  <div><h1 id="hd">Strażnicy</h1><p id="sub">Każdy pilnuje jednej rzeczy i sprawdza ją co minutę.</p><div class="chips" id="chips"></div></div>
  <div class="btns"><button class="btn" id="test">🔔 Test powiadomień</button><button class="btn" id="run">↻ Sprawdź wszystkich</button></div>
 </div>
 <div class="vt" id="vt"><button data-m="office">🏢 Biuro</button><button data-m="dash">▦ Dashboard</button></div>
 <div class="stage3d glass office-only"><canvas id="c3" aria-label="Centrala ochrony – ekran każdego strażnika"></canvas><span class="h3d">przeciągnij · kliknij ekran</span></div>
 <div id="areas" class="dash-only"></div>
</div>
<div id="sheet"><div class="sh glass" id="sh"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LBL={ok:'w porządku',warn:'uwaga',fail:'problem',idle:'nieaktywny'};
const pl=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<10||n%100>=20))?b:c;
const CH={ok:n=>'w porządku',warn:n=>pl(n,'uwaga','uwagi','uwag'),fail:n=>pl(n,'problem','problemy','problemów'),idle:n=>pl(n,'nieaktywny','nieaktywne','nieaktywnych')};
const ago=t=>{if(!t)return'–';const s=Date.now()/1000-t;return s<90?'przed chwilą':s<3600?Math.round(s/60)+' min temu':s<86400?Math.round(s/3600)+' h temu':Math.round(s/86400)+' dni temu'};
let D=null;
function ring(c){const tot=Object.values(c).reduce((a,b)=>a+b,0)||1,r=42,C=2*Math.PI*r;let off=0;
 const seg=(n,col)=>{if(!n)return'';const l=n/tot*C,s=`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="9" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" stroke-linecap="butt"/>`;off+=l;return s};
 const css=getComputedStyle(document.documentElement);
 $('ring').innerHTML=`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(127,127,140,.18)" stroke-width="9"/>${seg(c.ok,css.getPropertyValue('--ok'))}${seg(c.warn,css.getPropertyValue('--warn'))}${seg(c.fail,css.getPropertyValue('--fail'))}${seg(c.idle,css.getPropertyValue('--idle'))}</svg><b>${c.ok}/${tot}</b>`}
const hist=h=>`<div class="hist">${(h||[]).slice(-24).map(s=>`<i class="${s}"></i>`).join('')}</div>`;
function render(){const G=D.guardians,c=D.count;ring(c);
 $('hd').textContent=c.fail?`${c.fail} ${pl(c.fail,'problem','problemy','problemów')} do sprawdzenia`:c.warn?'Prawie wszystko gra':'Wszystko gra';
 $('chips').innerHTML=['ok','warn','fail','idle'].filter(k=>c[k]).map(k=>`<span class="chip glass"><i style="background:var(--${k})"></i>${c[k]} ${CH[k](c[k])}</span>`).join('');
 const areas=[...new Set(G.map(g=>g.area))];
 $('areas').innerHTML=areas.map(a=>{const gs=G.filter(g=>g.area===a);return`<section class="area"><h2>${esc(gs[0].areaName)}</h2><div class="dots">${gs.map(g=>
  `<div class="dot glass ${g.status||'idle'}" data-id="${g.id}"><div class="orb"><span>${g.icon}</span></div><b>${esc(g.name)}</b><small>${esc(g.msg||'czeka na pierwsze sprawdzenie')}</small>${hist(g.hist)}</div>`).join('')}</div></section>`}).join('');
 document.querySelectorAll('.dot').forEach(d=>d.onclick=()=>open_(d.dataset.id))}
function open_(id){const g=D.guardians.find(x=>x.id===id);
 $('sh').innerHTML=`<button class="x" onclick="$('sheet').classList.remove('open')">×</button><div class="hd ${g.status||'idle'}"><div class="orb"><span>${g.icon}</span></div><div><h3>${esc(g.name)}</h3><div class="st">${LBL[g.status||'idle']} · od ${ago(g.since)} · sprawdzono ${ago(g.at)}</div></div></div>
  <p class="mut">Zadanie: ${esc(g.task)}</p><div class="msg">${esc(g.msg||'–')}</div>
  <p class="mut">Ostatnie 48 sprawdzeń (co minutę)</p><div class="hd ${g.status}" style="margin:0">${hist(g.hist).replace('slice','')}</div>
  ${id==='inbox'?`<div style="margin-top:12px"><button class="btn" id="dg">🔍 Diagnoza połączenia</button><div class="plog" id="dgo"></div></div>`:''}
  ${id==='push'?`<p class="mut" style="margin-top:12px">Ostatnie wysyłki</p><div class="plog">${(D.push_log||[]).map(l=>`<div>${new Date(l.t*1000).toLocaleString('pl',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${l.sent}/${l.subs} · ${esc(l.title)}${l.results.filter(r=>!r.ok).map(r=>`<div class="bad">✗ ${esc(r.host)} ${r.code} ${esc(r.err||'')}</div>`).join('')}</div>`).join('')||'brak'}</div>`:''}`;
 const h=$('sh').querySelector('.hd .hist');if(h)h.innerHTML=(g.hist||[]).map(s=>`<i class="${s}"></i>`).join('');
 $('sheet').classList.add('open');
 const dg=$('dg');if(dg)dg.onclick=async()=>{dg.disabled=true;dg.textContent='Sprawdzam (do 30 s)…';let r;try{r=await (await fetch('/api/guardians/diag')).json()}catch(e){r={hosts:[],log:[]}}
  $('dgo').innerHTML=r.hosts.map(h=>`<div><b>${esc(h.host)}</b> ${h.dns?`<span class="bad">DNS: ${esc(h.dns)}</span>`:`<span class="mut">v4 ${h.v4.length} · v6 ${h.v6.length}</span>`}<div class="${/BŁĄD/.test(h.httpx)?'bad':''}">httpx: ${esc(h.httpx)}</div><div class="${/BŁĄD/.test(h.curl)?'bad':''}">curl: ${esc(h.curl)}</div></div>`).join('')+
   '<p class="mut" style="margin-top:8px">Ostatnie wpisy Inboxu</p>'+r.log.map(l=>`<div class="${l.kind==='error'?'bad':''}">${new Date(l.t*1000).toLocaleString('pl',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · ${esc(l.text)}</div>`).join('');
  dg.disabled=false;dg.textContent='🔍 Sprawdź jeszcze raz';setTimeout(()=>load(true),25000)}}
$('sheet').onclick=e=>{if(e.target.id==='sheet')$('sheet').classList.remove('open')};
addEventListener('keydown',e=>{if(e.key==='Escape')$('sheet').classList.remove('open')});
async function load(run){try{const r=await fetch(run?'/api/guardians/run':'/api/guardians',run?{method:'POST'}:{});if(r.ok){D=await r.json();render();window.sec3d&&sec3d()}}catch(e){}}
$('run').onclick=async e=>{e.target.disabled=true;e.target.textContent='Sprawdzam…';await load(true);e.target.disabled=false;e.target.textContent='↻ Sprawdź wszystkich'};
$('test').onclick=async e=>{e.target.disabled=true;let r;try{r=await (await fetch('/api/social/push/test',{method:'POST'})).json()}catch(x){r={sent:0,subs:0,results:[]}}
 e.target.disabled=false;const bad=(r.results||[]).filter(x=>!x.ok);
 alert(r.subs?`Wysłano na ${r.sent}/${r.subs} urządzeń.`+(bad.length?`\n\nNie doszło:\n`+bad.map(b=>`${b.host}: ${b.code} ${b.err||''}`).join('\n'):'\n\nJeśli nic nie przyszło, sprawdź ustawienia powiadomień w systemie.'):'Żadne urządzenie nie ma włączonych powiadomień.\n\nKliknij 🔔 w nagłówku centrum (na iPhonie: w apce z ekranu początkowego).');load(true)};

// ---- zakładki Biuro / Dashboard (jak w Agencji) ----
(function(){let m='office';try{m=localStorage.getItem('view-'+location.pathname)||'office'}catch(e){}
 window.setMode=x=>{m=x;document.body.classList.toggle('m-office',x==='office');document.body.classList.toggle('m-dash',x==='dash');
  document.querySelectorAll('#vt button').forEach(b=>b.classList.toggle('on',b.dataset.m===x));try{localStorage.setItem('view-'+location.pathname,x)}catch(e){}
  setTimeout(()=>dispatchEvent(new Event('resize')),30)};
 document.querySelectorAll('#vt button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));setMode(m)})();
load();setInterval(load,30000);
// ===== CENTRALA OCHRONY 3D (wybrany wygląd): ekran = strażnik, kolor ramki i pulsu = stan =====

 B(18,.2,13,new THREE.MeshStandardMaterial({map:ft,roughness:.55,metalness:.2}),0,-.2,0);B(18,6.6,.3,M('#11151d',{r:.8}),0,0,-6.6);B(.3,6.6,13,M('#11151d',{r:.8}),-9,0,0);
 // łukowy pulpit operatorów

 const pins=[];for(let i=0;i<8;i++){const x=4+(i%4)*.8,z=3.9+Math.floor(i/4)*1,h=.2+((i*7)%5)*.1;B(.4,h,.4,M('#5a6480',{e:'#1a2a40',ei:.4}),x,.88,z);pins.push(add(new THREE.Mesh(new THREE.SphereGeometry(.08,10,8),new THREE.MeshBasicMaterial({color:'#3ddc84'})),x,.88+h+.14,z))}
 for(let i=0;i<4;i++){const l=add(new THREE.Mesh(new THREE.BoxGeometry(14,.04,.08),new THREE.MeshBasicMaterial({color:'#3a5fa8'})),0,6.4,-5+i*3);l.castShadow=false}
 [-6,0,6].forEach(x=>{const p=new THREE.PointLight(0x9fb0ff,.8,8,2);p.position.set(x,5.2,1);scene.add(p)});const wl=new THREE.PointLight(0x4f8bff,1.4,12,2);wl.position.set(0,3,-4.5);scene.add(wl);
 // ściana ekranów – jeden ekran na strażnika

 function draw(m,t){const g=m.g,x=m.x,w=320,h=190,st=COL[g.status||'idle'];x.fillStyle='#050912';x.fillRect(0,0,w,h);x.strokeStyle='rgba(80,110,170,.18)';for(let k=1;k<6;k++){x.beginPath();x.moveTo(0,k*h/6);x.lineTo(w,k*h/6);x.stroke()}

  x.fillStyle='rgba(166,176,201,.75)';x.font='13px JetBrains Mono, monospace';x.fillText(String(g.msg||'').slice(0,40),12,h-30);x.fillText('sprawdzono '+ago(g.at),12,h-12);
