<!doctype html>
<html lang="pl" class="lg-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agencja AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#161925;--panel:rgba(22,25,38,.92);--line:rgba(255,255,255,.09);--txt:#e8ebf5;--mut:#8b91a8;--acc:#9fd8ff;--ok:#3ddc84;--idle:#6b7088}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font:14px/1.4 Inter,system-ui,sans-serif}
#stars{position:fixed;inset:0;z-index:0}
#scene{position:fixed;inset:0;z-index:1;cursor:grab}
#scene.drag{cursor:grabbing}#scene.hov{cursor:pointer}
#labels{position:fixed;inset:0;z-index:2;pointer-events:none}
.lbl{position:absolute;display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;white-space:nowrap;pointer-events:auto;cursor:pointer;transform:translate(-50%,-100%);backdrop-filter:blur(6px);transition:border-color .2s}
.lbl:hover{border-color:var(--c)}
.lbl .ic{width:26px;height:26px;border-radius:7px;background:var(--c);display:grid;place-items:center;font-size:14px}
.lbl b{font-size:12.5px;display:block}
.lbl small{font:11px 'JetBrains Mono',monospace;color:var(--mut)}
.lbl small i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:4px;box-shadow:0 0 6px var(--ok)}
.brain{text-align:center;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.12em;padding:6px 12px;cursor:default}
.brain span{display:block;font-weight:400;letter-spacing:0;color:var(--mut)}
header{position:fixed;top:12px;left:12px;right:12px;border-radius:18px;z-index:3;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#6b8cff,#c94fc0);display:grid;place-items:center;font-style:normal}
.stats{display:flex;gap:18px;margin-left:auto;font:12px 'JetBrains Mono',monospace;color:var(--mut)}
.stats b{color:var(--txt);font-size:14px;margin-right:4px}
#models{position:fixed;left:12px;bottom:12px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.chip{font:12px 'JetBrains Mono',monospace;padding:5px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer}
.chip.on{color:#111;background:var(--acc);border-color:var(--acc)}
#feed{position:fixed;left:12px;bottom:52px;z-index:3;width:min(340px,calc(100vw - 24px));display:flex;flex-direction:column;gap:4px;pointer-events:none}
.ev{font-size:12px;padding:6px 10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;animation:in .35s ease}
.ev small{color:var(--mut);font-family:'JetBrains Mono',monospace;margin-right:6px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
#mini{position:fixed;right:12px;bottom:12px;z-index:3;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
#mini .t{display:flex;justify-content:space-between;font:10px 'JetBrains Mono',monospace;color:var(--mut);margin-bottom:4px}
#mini canvas{display:block;cursor:pointer}
#mini .z{display:flex;gap:4px;margin-top:6px}
#mini .z button{flex:1;background:#232838;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:3px 0;cursor:pointer}
#panel{position:fixed;top:84px;right:12px;bottom:12px;z-index:4;width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);transform:translateX(calc(100% + 24px));transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;overflow:hidden}
#panel.open{transform:none}
#panel:not(.open){visibility:hidden;transition:transform .35s cubic-bezier(.2,.8,.2,1),visibility 0s .35s}
.ph{padding:16px;border-bottom:1px solid var(--line);position:relative}
.ph:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.ph h2{font-size:18px;display:flex;align-items:center;gap:8px}
.ph p{color:var(--mut);font-size:13px;margin-top:4px}
.x{position:absolute;right:12px;top:12px;background:none;border:0;color:var(--mut);font-size:22px;cursor:pointer}
.list{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}
.ag{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.ag .d{width:9px;height:9px;border-radius:50%;background:var(--idle)}
.ag.run .d{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.ag b{font-size:13.5px}
.ag code{grid-column:2/4;font:11.5px 'JetBrains Mono',monospace;color:var(--acc)}
.ag .m{font:11px 'JetBrains Mono',monospace;color:var(--mut)}
.ag button{grid-column:1/4;margin-top:4px;padding:6px;border-radius:7px;border:1px solid var(--line);background:#232838;color:var(--txt);cursor:pointer;font:600 12px Inter}
.ag.run button{background:transparent;color:var(--mut)}
.ag.soon{opacity:.45}
.sec{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.sec h3{font-size:13px;margin:8px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.btn{font:600 12px Inter;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#232838;color:var(--txt);cursor:pointer}
.btn:disabled{opacity:.5}.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tp{display:flex;gap:8px;justify-content:space-between;padding:8px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
.tp b{font-size:13px;display:block}.tp small{display:block;color:var(--mut);font-size:11.5px}.tp .why{color:var(--acc)}
.tp.used{opacity:.7}.acts{display:flex;flex-direction:column;gap:4px}
.acts button{background:#232838;border:1px solid var(--line);color:var(--txt);border-radius:6px;width:26px;height:24px;cursor:pointer}
.rv{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.rv b{font-size:13px;display:block}.rv small{display:block;font-size:11.5px}
.rv .hk{color:var(--acc)}.sc{min-width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font:700 14px 'JetBrains Mono'}
.sc.ok{background:rgba(61,220,132,.15);color:var(--ok)}.sc.bad{background:rgba(255,123,112,.15);color:#ff7b70}
.mut{color:var(--mut);font-size:12px}.warn{color:#f5b25a;font-size:12.5px;margin:6px 0}
.sw{display:flex;align-items:center;gap:10px;font-size:13px;margin:7px 0;cursor:pointer}
.sw input{display:none}.sw span{width:34px;height:20px;border-radius:20px;background:#343a4d;position:relative;flex:none;transition:.2s}
.sw span:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--ok)}.sw input:checked+span:after{left:17px}
.row{display:flex;align-items:center;gap:8px;font-size:13px;margin:7px 0}.row input{width:54px;background:#232838;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px}
.lessons{font-size:12.5px;line-height:1.5;background:rgba(47,179,165,.08);border:1px solid rgba(47,179,165,.25);border-radius:9px;padding:10px;margin-bottom:4px}
.rt{display:grid;grid-template-columns:minmax(0,1fr) 42px 42px 48px;gap:4px 8px;font-size:12px;align-items:center}
.rt span{color:var(--mut);font-size:11px}.rt a{color:var(--txt);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt b{font:600 12px 'JetBrains Mono';text-align:right}.rt b.g{color:var(--ok)}.rt b.r{color:#ff7b70}
.cm{border:1px solid var(--line);border-radius:9px;padding:8px;margin-bottom:8px}.cm p{font-size:13px;margin:4px 0}
.cm textarea{width:100%;min-height:58px;background:#1b1f2c;border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:6px;font:12.5px Inter;resize:vertical}
details{margin:6px 0}summary{cursor:pointer;font-size:12.5px;color:var(--mut);margin:6px 0}
#vt{display:flex;gap:2px;padding:3px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
#vt button{border:0;background:transparent;color:var(--mut);font:600 12.5px Inter;padding:6px 11px;border-radius:8px;cursor:pointer}
#vt button.on{background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.07));color:var(--txt);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
#dash{position:fixed;inset:76px 0 0 0;z-index:3;overflow:auto;padding:12px 12px 40px;display:none}
body.dash #dash{display:block}body.dash #scene,body.dash #labels,body.dash #mini,body.dash #feed,body.dash #models,body.dash #chartbtn{display:none!important}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;max-width:1500px;margin:0 auto}
.dc{position:relative;border-radius:20px;padding:16px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(255,255,255,.13);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 18px 40px -22px rgba(0,0,0,.8);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);cursor:pointer;transition:transform .25s,border-color .25s;overflow:hidden}
.dc:hover{transform:translateY(-2px);border-color:var(--c)}
.dc:before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:var(--c)}
.dc:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:var(--c);opacity:.13;filter:blur(30px)}
.dh{display:flex;align-items:center;gap:10px}.dh .ic{width:34px;height:34px;border-radius:10px;background:var(--c);display:grid;place-items:center;font-size:17px;flex:none}
.dh b{font-size:15px;display:block}.dh small{color:var(--mut);font-size:12px}
.dh .bd{margin-left:auto;font:600 11px 'JetBrains Mono';padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.08);white-space:nowrap}
.dh .bd.run{background:rgba(61,220,132,.18);color:var(--ok)}
.dm{margin:12px 0 8px;font:700 22px 'JetBrains Mono';letter-spacing:-.02em}.dm small{display:block;font:500 11.5px Inter;color:var(--mut);letter-spacing:0;margin-top:2px}
.dl{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.dl div{display:grid;grid-template-columns:9px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12.5px}
.dl i{width:8px;height:8px;border-radius:50%;background:#4a5068}.dl i.s1{background:#8a93ad}.dl i.s2{background:var(--ok);box-shadow:0 0 8px var(--ok);animation:bl 1.4s infinite}
.dl span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dl em{font:normal 11px 'JetBrains Mono';color:var(--mut)}
.dx{margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes bl{50%{opacity:.4}}
.fg2{display:flex;gap:8px}.fg2 div{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px}.fg2 b{font:700 20px 'JetBrains Mono';display:block}.fg2 small{color:var(--mut);font-size:11px}
.bar2{height:6px;border-radius:6px;background:#232838;overflow:hidden;margin:6px 0}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#f5b25a,#ff7b70)}
.fg2 b.r{color:#ff7b70}
@media(max-width:700px){#dash{inset:118px 0 0 0}.dg{grid-template-columns:minmax(0,1fr)}}
@media(max-width:700px){
 .stats{margin-left:0;width:100%;justify-content:space-between}
 #panel{top:auto;left:12px;right:12px;width:auto;height:62vh;transform:translateY(calc(100% + 80px))}
 #panel.open{transform:none}
 #feed{display:none}
 #mini canvas{width:110px;height:74px}
}
html{background:#06070c}html[data-theme=light]:not(.lg-dark){background:#eef0f8}
</style>

<body class="lg">

<div id="labels"></div>
<header>
 <div class="logo"><i>✦</i>Agencja AI <span style="color:var(--mut);font-weight:400">· social media</span></div>

</header>

<div id="dash"><div class="dg" id="dg"></div></div>
<aside id="panel"><div class="ph"><button class="x" id="px">×</button><h2 id="pt"></h2><p id="pd"></p></div><div class="list" id="pl"></div></aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== DANE: działy i agenci =====
// id: agent backendu (scout/qa/op) albo wf:<regex nazwy workflow n8n>; soon = jeszcze nie działa
const DEPTS=[
 {name:'Research',sub:'Trendy i kolejka tematów dla PozaSkali',color:'#4f6fe0',icon:'🔍',panel:'research',agents:[
  {n:'Trend Scout',m:'Sonnet',s:'trend-analyst + web search',id:'scout'},{n:'SEO Hunter',m:'Haiku',s:'podpowiedzi YT → tytuł, opis, tagi',id:'seo'},{n:'Kopiarz trendów',m:'Sonnet',s:'top Shorts niszy → tematy',id:'trends'}]},
 {name:'Skrypty',sub:'Scenariusz w generatorze n8n',color:'#e0a92e',icon:'✍️',agents:[
  {n:'Scenarzysta',m:'GPT-4.1',s:'n8n · Message a model',id:'wf:^generator$'},{n:'Sędzia n8n',m:'GPT-4.1-mini',s:'n8n · Judge Script',id:'wf:^generator$'}]},
 {name:'Publikacja',sub:'YouTube + Instagram',color:'#c94fc0',icon:'📲',agents:[
  {n:'Publisher',m:'n8n',s:'n8n · Publisher',id:'wf:^publisher$'},{n:'Planer',m:'Sonnet',s:'plan tygodnia w sloty SAFE/EXPERIMENT · nd 18:00',id:'planner'}]},
 {name:'Kreacja',sub:'Lektor, kadry, scena wideo, montaż',color:'#7a5ce0',icon:'🎨',agents:[
  {n:'Lektor',m:'OpenAI TTS',s:'n8n · lektor',id:'wf:^generator$'},{n:'Grafik',m:'OpenAI',s:'n8n · zdjęcie',id:'wf:^generator$'},
  {n:'Kling',m:'Kling',s:'n8n · scena wideo',id:'wf:^generator$'},{n:'Montażysta',m:'FFmpeg',s:'n8n · Montaż film',id:'wf:^montaż film$'}]},
 {name:'Analityka',sub:'Wyniki, retencja i pętla zwrotna',color:'#2fb3a5',icon:'📊',panel:'analytics',agents:[
  {n:'Analityk',m:'n8n',s:'Analytics Collector',id:'wf:^analytics collector$'},{n:'Retencja',m:'Sonnet',s:'krzywa oglądania YT → lekcje',id:'retention'},{n:'Test A/B',m:'',s:'hook A vs B → utrzymanie 3 s',id:'on'},{n:'Raporty',m:'Haiku',s:'centrum · raport tygodnia',id:'on'},{n:'Recykler',m:'Sonnet',s:'kontynuacje najlepszych filmów · śr 18:00',id:'recycle'}]},
 {name:'Kontrola jakości',sub:'Ocena i poprawki scenariusza przed nagraniem',color:'#d94b4b',icon:'🛡️',panel:'qa',agents:[
  {n:'Kontroler',m:'Sonnet',s:'ocena 1–10 + fakty',id:'qa'},{n:'Hook Master',m:'Sonnet',s:'hook-generator',id:'qa'},{n:'Technik',m:'FFmpeg',s:'czarne klatki, cisza, długość',id:'tech'}]},
 {name:'Automatyzacje',sub:'Sterowanie n8n i autopilot',color:'#3fae5a',icon:'⚙️',panel:'ops',agents:[
  {n:'n8n Operator',m:'Haiku',s:'workflow on/off, start',id:'op'},{n:'Error Watch',m:'push',s:'powiadomienia z apki',id:'on'}]},
 {name:'Inbox',sub:'Odpowiedzi na komentarze YouTube i Instagram',color:'#e07a2e',icon:'💬',panel:'inbox',agents:[
  {n:'Komentarze YT',m:'Haiku',s:'odpowiada sam (max 40/dzień)',id:'inbox'},{n:'Komentarze IG',m:'Haiku',s:'odpowiada sam',id:'inbox'}]},
 {name:'Konta prywatne',sub:'Analiza Twoich kont i plan postów (pon. 8:00)',color:'#e6538a',icon:'👤',panel:'private',agents:[
  {n:'Analityk prywatnych',m:'Sonnet',s:'performance-analyst',id:'private'},{n:'Doradca treści',m:'Sonnet',s:'social-content + hook-generator',id:'private'}]}
];
DEPTS.forEach(d=>d.agents.forEach(a=>a.st=0));
const AG_NAMES={scout:'Trend Scout',trends:'Kopiarz trendów',qa:'Kontroler',op:'n8n Operator',n8n:'n8n',seo:'SEO Hunter',tech:'Technik',retention:'Retencja',inbox:'Inbox',private:'Analityk prywatnych',planner:'Planer',recycle:'Recykler'};
const AG_DEPT={trends:0,scout:0,qa:5,op:6,n8n:6,seo:0,tech:5,retention:4,inbox:7,private:8};

// ===== SCENA =====
const el=document.getElementById('scene'),W=()=>innerWidth,H=()=>innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<700?1.5:2));renderer.setSize(W(),H());
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
el.appendChild(renderer.domElement);
const scene=new THREE.Scene(),FR=44,camera=new THREE.OrthographicCamera(-1,1,1,-1,1,500);
const target=new THREE.Vector3(0,0,0),OFF=new THREE.Vector3(60,60,60);
function setFrustum(){const a=W()/H();camera.left=-FR*a/2;camera.right=FR*a/2;camera.top=FR/2;camera.bottom=-FR/2;camera.updateProjectionMatrix()}
function placeCam(){camera.position.copy(target).add(OFF);camera.lookAt(target)}
const Z0=W()<700?.55:1;camera.zoom=Z0;setFrustum();placeCam();

// ===== LOFT KREATYWNY (wybrany wygląd) =====
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
scene.add(new THREE.HemisphereLight(0xffd9b8,0x2b1d2a,.75));
const sun=new THREE.DirectionalLight(0xffb070,1.6);sun.position.set(-30,40,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,far:150});sun.shadow.bias=-.0004;scene.add(sun);

const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:.8,...o});
function box(w,h,d,m,x,y,z,p){const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);me.position.set(x,y,z);me.castShadow=me.receiveShadow=true;p.add(me);return me}
const tint=(c,k,to=0xffffff)=>new THREE.Color(c).lerp(new THREE.Color(to),k);
const S2=Math.SQRT2,S6=Math.sqrt(6),R=15,N=DEPTS.length;
const toWorld=(mx,my)=>({x:(mx*S2+my*S6)/2,z:(my*S6-mx*S2)/2});
const toMap=(x,z)=>({x:(x-z)/S2,y:(x+z)/S6});
function tex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;return t}
function skyTex(){return tex(512,512,(x,W2,H2)=>{const gr=x.createLinearGradient(0,0,0,H2);gr.addColorStop(0,'#ff9a5a');gr.addColorStop(1,'#ffcf8a');x.fillStyle=gr;x.fillRect(0,0,W2,H2);let px=0,s=3;const r=()=>((s=s*9301+49297)%233280)/233280;
 while(px<W2){const bw=W2*(.05+r()*.07),bh=H2*(.25+r()*.45);x.fillStyle='rgba(40,22,30,.88)';x.fillRect(px,H2-bh,bw,bh);for(let yy=H2-bh+6;yy<H2-4;yy+=9)for(let xx=px+3;xx<px+bw-3;xx+=7)if(r()<.25){x.fillStyle='rgba(255,215,140,.9)';x.fillRect(xx,yy,3,4)}px+=bw+2}})}

const rooms=[],agents=[],floors=[],walkers=[],packets=[];
const DESKS=[[-1.5,-1.3],[1.6,-1.3],[-1.5,1.5],[1.6,1.5]],DESKS5=[[-2.25,-1.3],[0,-1.3],[2.25,-1.3],[-1.2,1.5],[1.2,1.5]];
function figure(color,s=1){const g=new THREE.Group(),bm=mat(color,{roughness:.55});
 const b=new THREE.Mesh(new THREE.CylinderGeometry(.22*s,.3*s,.75*s,14),bm);b.position.y=.38*s;

   ${A&&!A.ai?'<p class="warn">Brak klucza AI (OPENAI_API_KEY w /root/social/.env) – agenci nie mają mózgu.</p>':''}
   <h3>Generator n8n</h3>${!L?'<p class="mut">Sprawdzam…</p>':!L.ok?`<p class="warn">${esc(L.error||'Nie znalazłem generatora')}</p>`:
   `<p>${esc(L.generator)}: ${L.connected?'<b style="color:var(--ok)">podpięty</b>':'<b>niepodpięty</b>'}${L.montage?` · ${esc(L.montage)}: ${L.montage_connected?'<b style="color:var(--ok)">kontrola techniczna</b>':'<b>bez kontroli</b>'}`:''}</p>
   <div class="btns">${L.connected&&L.montage&&!L.montage_connected?'<button class="btn" id="lk-up">Zaktualizuj podpięcie</button>':''}<button class="btn" id="lk">${L.connected?'Odepnij agencję':'Podepnij agencję'}</button>${L.connected?'<button class="btn" id="run">▶ Uruchom generator teraz</button>':''}</div>`}
   <label class="sw"><input type="checkbox" id="inb" ${A?.settings.inbox!==false?'checked':''}><span></span>Inbox czyta komentarze</label>
   <label class="sw"><input type="checkbox" id="inba" ${A?.settings.inbox_auto!==false?'checked':''}><span></span>…i odpowiada sam (inaczej szkice)</label>
   <label class="sw"><input type="checkbox" id="abx" ${A?.settings.ab!==false?'checked':''}><span></span>Test A/B hooków (co drugi film)</label>
   <h3>Koszty AI dziś</h3>${(c=>c?`<div class="fg2"><div><b class="${c.today>=c.limit?'r':''}">${c.today.toFixed(2)} $</b><small>z limitu ${c.limit} $ · ${c.calls} wywołań</small></div><div><b>${c.days.slice(-7).reduce((s,d)=>s+d.usd,0).toFixed(2)} $</b><small>ostatnie 7 dni</small></div></div>
    <div class="bar2"><i style="width:${Math.min(100,c.today/c.limit*100)}%"></i></div>
    ${Object.keys(c.by_agent).length?`<p class="mut">${Object.entries(c.by_agent).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${esc(AG_NAMES[k]||k)} ${v.toFixed(3)} $`).join(' · ')}</p>`:''}
    <label class="row">Dzienny limit <input type="number" id="lim" min="0.1" max="50" step="0.1" value="${c.limit}"> $ – po przekroczeniu agenci czekają do północy</label>`:'')(A?.costs)}
   <h3>Kopie zapasowe<button class="btn" id="go-bk">Zrób teraz</button></h3><p class="mut">Codziennie 3:30, trzymane 14 ostatnich (kolejka, raporty, dziennik, ustawienia).</p>
   ${(A?.backups||[]).slice(0,4).map(b=>`<div class="tp used"><div><b><a href="/api/agency/backup/${esc(b.name)}" style="color:inherit">⬇ ${esc(b.name)}</a></b><small>${b.kb} KB · ${ago(b.at)} temu</small></div></div>`).join('')||'<p class="mut">Jeszcze nie ma kopii.</p>'}
   <h3>Workflow</h3>${P?.ok?P.workflows.filter(w=>!/clip|kopia|\d$/i.test(w.name)).map(w=>`<label class="sw"><input type="checkbox" data-w="${w.id}" ${w.active?'checked':''}><span></span>${esc(w.name)}</label>`).join(''):'<p class="mut">Brak danych z n8n.</p>'}</div>`;
 }
 if(!d.panel&&P?.ok){const ids=d.agents.filter(a=>a.id?.startsWith('wf:')).map(a=>new RegExp(a.id.slice(3),'i'));
  const ex=P.executions.filter(e=>ids.some(r=>r.test(e.workflow))).slice(0,6);
  if(ex.length)h+=`<div class="sec"><h3>Ostatnie uruchomienia</h3>`+ex.map(e=>`<div class="tp used"><div><b>${esc(e.workflow)} · ${({success:'sukces',error:'błąd',running:'działa'})[e.status]||e.status}</b><small>${new Date(e.startedAt).toLocaleString('pl',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</small></div></div>`).join('')+'</div>'}
 $('pl').innerHTML=h;
 const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
 on('go-res',async()=>{await post('/api/agency/research');setTimeout(poll,1500)});
 on('go-plan',async()=>{await post('/api/agency/agent/planner');setTimeout(poll,1500)});
 on('go-rec',async()=>{await post('/api/agency/agent/recycle');setTimeout(poll,1500)});
 $('pl').querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{await post('/api/agency/topics/'+b.dataset.t,{action:b.dataset.a});poll()});
 const ap=$('ap');if(ap)ap.onchange=async()=>{await post('/api/agency/settings',{autopilot:ap.checked});poll()};
 const ms=$('ms');if(ms)ms.onchange=async()=>{await post('/api/agency/settings',{min_score:+ms.value});poll()};
 on('lk',async e=>{e.target.disabled=true;e.target.textContent='Chwila…';const r=await post('/api/agency/link/'+(LINK.connected?'disconnect':'connect')).catch(()=>({ok:false,error:'błąd sieci'}));
  if(!r.ok)alert('Nie wyszło: '+(r.error||''));await loadLink();poll()});
 on('lk-up',async e=>{e.target.disabled=true;e.target.textContent='Chwila…';const r=await post('/api/agency/link/connect').catch(()=>({ok:false}));if(!r.ok)alert('Nie wyszło: '+(r.error||''));await loadLink();poll()});
 const lim=$('lim');if(lim)lim.onchange=async()=>{await post('/api/agency/settings',{daily_limit:+lim.value});poll()};
 on('go-bk',async e=>{e.target.disabled=true;await post('/api/agency/backup');poll()});
 on('go-tr',async()=>{await post('/api/agency/trends');setTimeout(poll,2500)});
 const abx=$('abx');if(abx)abx.onchange=async()=>{await post('/api/agency/settings',{ab:abx.checked});poll()};
 on('go-priv',async()=>{await post('/api/agency/private');setTimeout(poll,2000)});
 on('go-ret',async()=>{await post('/api/agency/retention');setTimeout(poll,1500)});
 on('go-inb',async()=>{await post('/api/agency/inbox-run');setTimeout(poll,2000)});
 const inba=$('inba');if(inba)inba.onchange=async()=>{await post('/api/agency/settings',{inbox_auto:inba.checked});poll()};
 const inb=$('inb');if(inb)inb.onchange=async()=>{await post('/api/agency/settings',{inbox:inb.checked});poll()};
 $('pl').querySelectorAll('[data-send]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.send,t=$('pl').querySelector(`textarea[data-c="${id}"]`).value;
  const r=await post('/api/agency/inbox/'+id,{reply:t});if(!r.ok){alert(r.error||'Nie wysłano');b.disabled=false}poll()});
 $('pl').querySelectorAll('[data-skip]').forEach(b=>b.onclick=async()=>{await post('/api/agency/inbox/'+b.dataset.skip,{action:'skip'});poll()});
 on('run',async e=>{if(!confirm('Uruchomić generator teraz? Powstanie dodatkowy film (koszt API).'))return;e.target.disabled=true;const r=await post('/api/agency/run/generator');e.target.textContent=r.ok?'Wystartował ✓':'Nie udało się';poll()});
 $('pl').querySelectorAll('[data-w]').forEach(c=>c.onchange=async()=>{await post(`/api/agency/n8n/${c.dataset.w}/${c.checked?'activate':'deactivate'}`);setTimeout(poll,800)});
}
async function loadLink(){try{LINK=await api('/api/agency/link')}catch(e){LINK={ok:false,error:'Brak połączenia'}}if(openI>=0)renderPanel(openI)}
function openPanel(i){openI=i;renderPanel(i);$('panel').classList.add('open');const r=rooms[i];target.set(r.p.x,0,r.p.z);placeCam();if(DEPTS[i].panel==='ops')loadLink()}
$('px').onclick=()=>{$('panel').classList.remove('open');openI=-1};
addEventListener('keydown',e=>{if(e.key==='Escape')$('px').onclick()});
function log(i,t,when){const d=DEPTS[i],e=document.createElement('div');e.className='ev';e.style.setProperty('--c',d.color);
 const tm=when?new Date(when*1000):new Date();e.innerHTML=`<small>${tm.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'})}</small>${esc(t)}`;
 const f=$('feed');f.prepend(e);while(f.children.length>4)f.lastChild.remove()}
['Wszystkie','GPT','n8n'].forEach(m=>{const c=document.createElement('button');c.className='chip'+(m===filter?' on':'');c.textContent=m;
 c.onclick=()=>{filter=m;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));refresh()};$('models').appendChild(c)});

// prawdziwy stan agencji + n8n
async function poll(){
 try{A=await api('/api/agency/state')}catch(e){}
 if(A?.models)DEPTS.forEach(d=>d.agents.forEach(x=>{x.tier=x.tier||({Sonnet:'smart',Haiku:'fast'})[x.m];if(x.tier)x.m=String(A.models[x.tier]).replace(/^claude-/,'').replace(/-\d{8}$/,'')}));
 try{P=await api('/api/pozaskala/status')}catch(e){}
 if(A){const L=A.log.slice().reverse();L.forEach(e=>{const k=e.t+e.agent;if(seenLog.has(k))return;seenLog.add(k);
  if(!firstLog||L.indexOf(e)>=L.length-4)log(AG_DEPT[e.agent]??6,`${AG_NAMES[e.agent]||e.agent}: ${e.text}`,e.t)})}
 if(P?.ok)P.executions.slice(0,firstLog?2:15).reverse().forEach(e=>{const k='x'+e.id+e.status;if(seenLog.has(k))return;seenLog.add(k);
  log(6,`n8n · ${e.workflow}: ${({success:'✓ sukces',error:'✗ błąd',running:'▶ działa'})[e.status]||e.status}`,Date.parse(e.startedAt)/1000)});
 firstLog=false;refresh()}
poll();setInterval(poll,15000);


function deptMetric(i){const d=DEPTS[i],L=(A?.log||[]).find(e=>(AG_DEPT[e.agent]??6)===i),x=L?`${ago(L.t)} temu · ${L.text}`:'';
 const lastEx=re=>{const e=P?.executions?.find(e=>re.test(e.workflow));return e?{v:({success:'✓ sukces',error:'✗ błąd',running:'▶ działa'})[e.status]||e.status,l:`${e.workflow} · ${new Date(e.startedAt).toLocaleString('pl',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}`}:{}};
 const today=new Date().toDateString();
 switch(d.panel||d.name){
  case 'research':return{v:A?A.queue.length:'–',l:'tematów w kolejce'+(A?.queue?.[0]?' · następny: '+A.queue[0].topic.slice(0,40):''),x};
  case 'Skrypty':return{...lastEx(/^generator$/i),x};
  case 'Publikacja':return{...lastEx(/^publisher$/i),x};
  case 'Kreacja':return{...lastEx(/monta/i),x};
  case 'analytics':return{v:A?.retention?.length?Math.round(A.retention.reduce((s,r)=>s+r.hold3s,0)/A.retention.length)+'%':'–',l:'średnio zostaje po 3 s',x:A?.ab?.verdict||x};
  case 'qa':return{v:A?.avg_score!=null?A.avg_score+'/10':'–',l:'średnia ocena scenariuszy'+(A?.tech?.[0]?' · technika: '+(A.tech[0].ok?'OK':'błąd'):''),x};
  case 'ops':return{v:A?(A.settings.autopilot?'ON':'OFF'):'–',l:'autopilot · '+(P?.ok?P.workflows.filter(w=>w.active).length+' workflow aktywnych':'n8n offline'),x:A?.costs?`koszt AI dziś ${A.costs.today.toFixed(2)} $ / ${A.costs.limit} $`:x};
  case 'inbox':{const it=A?.inbox||[],sent=it.filter(c=>c.status==='sent'&&new Date(c.t*1000).toDateString()===today).length,dr=it.filter(c=>c.status==='draft').length;return{v:sent,l:`odpowiedzi dziś${dr?' · '+dr+' czeka':''}`,x}}
  case 'private':{const r=A?.private?.[0];return{v:r?r.accounts.reduce((s,a)=>s+(a.followers||0),0).toLocaleString('pl'):'–',l:r?'obserwujących · raport '+ago(r.at)+' temu':'brak raportu',x}}
 }return{x}}
// ===== DASHBOARD agentów (widok kart zamiast biura 3D) =====
let MODE='office';try{MODE=localStorage.getItem('view-'+location.pathname)||'office'}catch(e){}
function setMode(m){MODE=m;document.body.classList.toggle('dash',m==='dash');document.querySelectorAll('#vt button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 try{localStorage.setItem('view-'+location.pathname,m)}catch(e){}if(m==='dash')renderDash()}
document.querySelectorAll('#vt button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
function renderDash(){if(MODE!=='dash')return;
 $('dg').innerHTML=DEPTS.map((d,i)=>{const run=d.agents.filter(a=>a.st===2).length,on=d.agents.filter(a=>a.st).length,m=deptMetric(i)||{};
  return `<div class="dc" data-i="${i}" style="--c:${d.color}"><div class="dh"><span class="ic">${d.icon}</span><div><b>${esc(d.name)}</b><small>${esc(d.sub)}</small></div>
   <span class="bd ${run?'run':''}">${run?run+' pracuje':on+'/'+d.agents.length+' aktywnych'}</span></div>
   ${m.v!=null?`<div class="dm">${m.v}<small>${esc(m.l||'')}</small></div>`:''}
   <div class="dl">${d.agents.map(a=>`<div><i class="s${a.st}"></i><span>${esc(a.n)}</span><em>${esc(a.m||'')}</em></div>`).join('')}</div>
   ${m.x?`<div class="dx">${esc(m.x)}</div>`:''}</div>`}).join('');
 $('dg').querySelectorAll('.dc').forEach(c=>c.onclick=()=>openPanel(+c.dataset.i))}

// ===== STEROWANIE =====
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();let drag=null,hover=-1;
function pick(e){mv.set(e.clientX/W()*2-1,-(e.clientY/H())*2+1);ray.setFromCamera(mv,camera);const h=ray.intersectObjects(floors);return h.length?h[0].object.userData.i:-1}
el.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,m:0};el.setPointerCapture(e.pointerId)});
el.addEventListener('pointermove',e=>{
 if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.m+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;
  if(drag.m>4){el.classList.add('drag');const k=(camera.top-camera.bottom)/(camera.zoom*H()),w=toWorld(-dx*k,-dy*k);target.x+=w.x;target.z+=w.z;placeCam()}return}
 hover=pick(e);el.classList.toggle('hov',hover>=0)});
el.addEventListener('pointerup',e=>{el.classList.remove('drag');if(drag&&drag.m<=4){const i=pick(e);if(i>=0)openPanel(i)}drag=null});
const setZoom=z=>{camera.zoom=Math.min(3,Math.max(.35,z));camera.updateProjectionMatrix()};
el.addEventListener('wheel',e=>{e.preventDefault();setZoom(camera.zoom*(e.deltaY<0?1.1:.9))},{passive:false});
$('zi').onclick=()=>setZoom(camera.zoom*1.2);$('zo').onclick=()=>setZoom(camera.zoom/1.2);
$('zr').onclick=()=>{target.set(0,0,0);placeCam();setZoom(Z0)};
addEventListener('resize',()=>{renderer.setSize(W(),H());setFrustum();stars()});

// minimapa
const mc=$('mc'),mx=mc.getContext('2d'),MS=150/52;
function mini(){mx.clearRect(0,0,150,100);
 rooms.forEach((r,i)=>{const m=toMap(r.p.x,r.p.z);mx.fillStyle=DEPTS[i].color;mx.fillRect(75+m.x*MS-7,50+m.y*MS*1.6-4,14,8)});
 mx.fillStyle='#cfefff';mx.beginPath();mx.arc(75,50,3,0,7);mx.fill();
 const t=toMap(target.x,target.z),vw=(camera.right-camera.left)/camera.zoom*MS,vh=(camera.top-camera.bottom)/camera.zoom*MS*1.6;
 mx.strokeStyle='rgba(255,255,255,.6)';mx.strokeRect(75+t.x*MS-vw/2,50+t.y*MS*1.6-vh/2,vw,vh);
 $('zl').textContent=Math.round(camera.zoom/Z0*100)+'%'}
mc.onclick=e=>{const b=mc.getBoundingClientRect(),sx=(e.clientX-b.left)*150/b.width,sy=(e.clientY-b.top)*100/b.height;
 const w=toWorld((sx-75)/MS,(sy-50)/(MS*1.6));target.set(w.x,0,w.z);placeCam()};

// gwiazdy
function stars(){const c=$('stars'),x=c.getContext('2d');c.width=W();c.height=H();
 const gr=x.createRadialGradient(W()/2,H()/2,0,W()/2,H()/2,Math.max(W(),H())*.7);gr.addColorStop(0,'#2a1c22');gr.addColorStop(1,'#120c10');
 x.fillStyle=gr;x.fillRect(0,0,W(),H())}
stars();refresh();

// ===== PĘTLA =====
const clock=new THREE.Clock(),v=new THREE.Vector3();
function project(p,e){v.copy(p).project(camera);e.style.left=(v.x+1)/2*W()+'px';e.style.top=(1-v.y)/2*H()+'px'}
(function loop(){const t=clock.getElapsedTime();
 rooms.forEach((r,i)=>{r.lift+=((i===hover?.35:0)-r.lift)*.15;r.g.position.y=r.lift;v.set(r.p.x-1.2,4.6+r.lift,r.p.z-1.2);project(v,labels[i])});
 project(new THREE.Vector3(0,4.6,0),brain);
 agents.forEach(o=>{o.f.head.position.y=.98*.95+(o.a.st?Math.sin(t*6+o.ph)*.04:0);if(o.a.st)o.sm.color.offsetHSL(0,0,Math.sin(t*8+o.ph)*.004)});
 walkers.forEach(w=>{let k=(t*w.sp+w.o)%2;k=k>1?2-k:k;w.w.g.position.lerpVectors(w.from,w.to,k);w.w.g.position.y=.06+Math.abs(Math.sin(t*8))*.06;
  w.w.g.rotation.y=Math.atan2(w.to.x-w.from.x,w.to.z-w.from.z)+((t*w.sp+w.o)%2>1?Math.PI:0)});
 packets.forEach(p=>{const k=(t*.25+p.o)%1;p.pk.position.lerpVectors(p.from,p.to,k);p.pk.position.y=.45});
 rings.forEach((r,k)=>r.rotation.z=t*(k%2?-.3:.4));orbits.forEach((o,k)=>{o.rotation.y=t*.5+k;o.rotation.x+=.003});
 core.scale.setScalar(1+Math.sin(t*2)*.04);core.rotation.y=t*.4;holo.rotation.y=t*.3;_bars(t);pl.intensity=1.4+Math.sin(t*2)*.3;
 if(MODE!=="dash"&&window.CENTRUM_ACTIVE!==false&&!document.hidden){mini();renderer.render(scene,camera)}requestAnimationFrame(loop)})();
setMode(MODE);
</script>
<script>
// panel Dashboard zaczyna się zawsze pod nagłówkiem (na telefonie nagłówek łamie się na kilka linii)
(function(){const h=document.querySelector('header'),d=document.getElementById('dash');if(!h||!d)return;
 const fit=()=>{d.style.top=Math.ceil(h.getBoundingClientRect().bottom+8)+'px'};
 try{new ResizeObserver(fit).observe(h)}catch(e){}addEventListener('resize',fit);fit();setTimeout(fit,500)})();
</script>
