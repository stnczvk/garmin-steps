<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centrum social mediów</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0D1015; --surface:#161A21; --surface2:#202630; --line:#2A313C;
  --ink:#EEF1F5; --muted:#98A2B3; --accent:#C8F560; --accent-ink:#0D1015;
  --good:#4ADE9B; --warn:#FFB547; --bad:#FF6B5A;
  --yt:#FF5A4F; --ig:#E879F9; --tt:#5EEAD4;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:34px;flex:1;min-width:220px}
header h1 span{color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
button,.btn{font:600 14px var(--body);border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--surface2);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button.primary,.btn.primary{background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{background:transparent;color:var(--muted);padding:7px 12px}
.seg button.on{background:var(--surface2);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin:14px 0 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.acc-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.badge{font:700 12px var(--display);letter-spacing:.06em;padding:3px 8px;border-radius:6px;color:#0D1015}
.b-youtube{background:var(--yt)} .b-instagram{background:var(--ig)} .b-tiktok{background:var(--tt)}
.acc-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.grp{font-size:12px;color:var(--muted)}
.big{font:700 38px var(--display);line-height:1}
.delta{font-size:13px;font-weight:600;margin-left:6px}
.up{color:var(--good)} .down{color:var(--bad)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat .v{font:700 22px var(--display)}
.stat .l{font-size:12px;color:var(--muted)}
.err{margin-top:10px;font-size:13px;color:var(--warn)}
svg.spark{width:100%;height:42px;margin-top:10px;display:block}
h2{font-size:24px;margin:8px 0 10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
.posts{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.post{display:grid;grid-template-columns:64px 1fr auto;gap:12px;padding:10px 14px;border-top:1px solid var(--line);align-items:center;text-decoration:none}
.post:first-child{border-top:0}
.post:hover{background:var(--surface2)}
.thumb{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--surface2)}
.ptitle{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pmeta{font-size:12px;color:var(--muted);margin-top:2px}
.pnum{text-align:right;white-space:nowrap}
.pnum .v{font:700 22px var(--display)}
.pnum .l{font-size:12px;color:var(--muted)}
details{margin-top:28px}
summary{cursor:pointer;font:700 22px var(--display);list-style:none}
summary::-webkit-details-marker{display:none}
summary:before{content:"▸ ";color:var(--muted)} details[open] summary:before{content:"▾ "}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:15px var(--body);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
select{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px;word-break:break-all}
.note{background:var(--surface2);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px}
.note.bad{border-left:4px solid var(--bad)} .note.good{border-left:4px solid var(--good)}
.acc-line{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--muted)}
@media (max-width:600px){header h1{font-size:28px}.two{grid-template-columns:1fr}.post{grid-template-columns:52px 1fr auto}.thumb{width:52px;height:52px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Centrum <span>social mediów</span></h1>
    <span class="muted small" id="upd"></span>
    <button id="refresh" class="primary">Odśwież</button>
  </header>
  <div id="msg"></div>
  <div class="row">
    <div class="seg" id="groups">
      <button data-g="" class="on">Wszystko</button><button data-g="pozaskala">PozaSkala</button><button data-g="prywatne">Prywatne</button>
    </div>
  </div>
  <div class="grid" id="cards"></div>

  <div class="row" style="justify-content:space-between">
    <h2>Najlepsze posty</h2>
    <div class="seg" id="range"><button data-r="28" class="on">28 dni</button><button data-r="0">Wszystkie</button></div>
  </div>
  <div class="posts" id="posts"></div>

  <details id="settings">
    <summary>Konta i ustawienia</summary>
    <div class="card" style="margin-top:12px">
      <h3>Połączone konta</h3>
      <div id="accs" class="small"></div>
      <div class="row" style="margin-top:14px">
        <select id="grp"><option value="pozaskala">PozaSkala</option><option value="prywatne">Prywatne</option></select>
        <button id="c-yt">+ Kanał YouTube</button>
        <button id="c-ig">+ Konto Instagram</button>
      </div>
    </div>
    <div class="card" style="margin-top:12px">
      <h3>Klucze</h3>
      <div class="two">
        <div><label>Google Client ID</label><input id="GOOGLE_CLIENT_ID" autocomplete="off"></div>
        <div><label>Google Client Secret</label><input id="GOOGLE_CLIENT_SECRET" autocomplete="off"></div>
        <div><label>Instagram App ID</label><input id="IG_APP_ID" autocomplete="off"></div>
        <div><label>Instagram App Secret</label><input id="IG_APP_SECRET" autocomplete="off"></div>
        <div><label>Apify token</label><input id="APIFY_TOKEN" autocomplete="off"></div>
        <div><label>Profile TikTok (np. st4nczuk_, po przecinku)</label><input id="TIKTOK_PROFILES" autocomplete="off"></div>
      </div>
      <div class="row" style="margin-top:12px"><button class="primary" id="save">Zapisz klucze</button><span id="saved" class="muted small"></span></div>
      <div class="note small">Adresy przekierowania do wklejenia w Google Cloud i w aplikacji Meta:<br>
        Google: <code id="r-g"></code><br>Instagram: <code id="r-i"></code></div>
    </div>
  </details>
</div>
<script>
const $ = s => document.querySelector(s);
const P = {youtube: 'YOUTUBE', instagram: 'INSTAGRAM', tiktok: 'TIKTOK'};
let data = null, group = '', range = 28;
const fmt = n => n == null ? '–' : n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' mln' : n >= 1e4 ? (n / 1e3).toFixed(1).replace('.', ',') + ' tys.' : Number(n).toLocaleString('pl-PL');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

async function api(path, opt) {
  const r = await fetch(path, opt);
  if (r.status === 401) { $('#msg').innerHTML = '<div class="note bad">Najpierw zaloguj się w <a href="/">dzienniku</a>, potem wróć tutaj.</div>'; throw new Error('auth'); }
  return r.json();
}

function spark(daily) {
  if (!daily || daily.length < 2) return '';
  const v = daily.map(d => d.views), mx = Math.max(...v, 1), w = 240, h = 42;
  const pts = v.map((y, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - 3 - y / mx * (h - 6)).toFixed(1)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
}

function delta(a) {
  const h = a.history || [];
  if (h.length < 2) return '';
  const now = h[h.length - 1].followers;
  const ref = h.find(x => (new Date(h[h.length - 1].date) - new Date(x.date)) / 864e5 <= 7) || h[0];
  const d = now - ref.followers;
  if (!d) return '';
  return `<span class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : ''}${fmt(d)} / 7 dni</span>`;
}

function render() {
  const accs = Object.entries(data?.accounts || {}).filter(([, a]) => !group || a.group === group);
  $('#cards').innerHTML = accs.length ? accs.map(([k, a]) => `
    <div class="card">
      <div class="acc-top"><span class="badge b-${a.platform}">${P[a.platform]}</span><span class="acc-name">${esc(a.name)}</span><span class="grp">${esc(data.groups?.[a.group] || '')}</span></div>
      <div><span class="big">${fmt(a.followers)}</span>${delta(a)}</div>
      <div class="muted small">${a.followers_label || 'obserwujący'}</div>
      <div class="stats">
        <div class="stat"><div class="v">${fmt(a.views_28d)}</div><div class="l">wyświetlenia (28 dni)</div></div>
        ${a.platform === 'youtube' ? `<div class="stat"><div class="v">${fmt(a.minutes_28d != null ? Math.round(a.minutes_28d / 60) : null)}</div><div class="l">godziny oglądania (28 dni)</div></div>`
          : `<div class="stat"><div class="v">${fmt(a.media_count)}</div><div class="l">postów</div></div>`}
      </div>
      ${spark(a.daily)}
      ${a.error ? `<div class="err">⚠ ${esc(a.error)}</div>` : ''}
    </div>`).join('') : '<div class="card empty">Brak połączonych kont. Otwórz „Konta i ustawienia” na dole strony.</div>';

  const cut = new Date(Date.now() - range * 864e5).toISOString().slice(0, 10);
  const posts = accs.flatMap(([, a]) => (a.posts || []).map(p => ({...p, platform: a.platform, acc: a.name})))
    .filter(p => !range || p.date >= cut).sort((x, y) => (y.views || 0) - (x.views || 0)).slice(0, 30);
  $('#posts').innerHTML = posts.length ? posts.map(p => `
    <a class="post" href="${esc(p.url)}" target="_blank" rel="noopener">
      ${p.thumb ? `<img class="thumb" src="${esc(p.thumb)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">` : '<div class="thumb"></div>'}
      <div style="min-width:0"><div class="ptitle">${esc(p.title) || '<span class="muted">(bez opisu)</span>'}</div>
        <div class="pmeta"><span class="badge b-${p.platform}" style="font-size:10px;padding:1px 5px">${P[p.platform]}</span> ${esc(p.acc)} · ${esc(p.date)} · ♥ ${fmt(p.likes)} · 💬 ${fmt(p.comments)}${p.shares != null ? ' · ↗ ' + fmt(p.shares) : ''}${p.saved != null ? ' · 🔖 ' + fmt(p.saved) : ''}</div></div>
      <div class="pnum"><div class="v">${fmt(p.views)}</div><div class="l">wyświetleń</div></div>
    </a>`).join('') : '<div class="empty">Brak postów w tym okresie.</div>';

  const u = data?.updated ? new Date(data.updated * 1000) : null;
  $('#upd').textContent = data?.refreshing ? 'odświeżam…' : u ? 'aktualizacja: ' + u.toLocaleString('pl-PL', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
  $('#refresh').disabled = !!data?.refreshing;
}

async function load() {
  data = await api('/api/social/summary');
  render();
  if (data.refreshing) setTimeout(load, 4000);
}

async function loadSettings() {
  const c = await api('/api/social/config');
  for (const k of Object.keys(c.set)) $('#' + k).value = c[k] || '';
  const r = await api('/api/social/redirects');
  $('#r-g').textContent = r.google; $('#r-i').textContent = r.instagram;
  const accs = await api('/api/social/accounts');
  $('#accs').innerHTML = accs.length ? accs.map(a => `
    <div class="acc-line"><span class="badge b-${a.platform}">${P[a.platform]}</span><b style="flex:1">${esc(a.name)}</b>
      <select data-k="${esc(a.key)}" class="g"><option value="pozaskala" ${a.group === 'pozaskala' ? 'selected' : ''}>PozaSkala</option><option value="prywatne" ${a.group === 'prywatne' ? 'selected' : ''}>Prywatne</option></select>
      <button data-k="${esc(a.key)}" class="rm">Odłącz</button></div>`).join('') : '<div class="muted" style="padding:6px 0">Nic jeszcze nie połączono.</div>';
  document.querySelectorAll('select.g').forEach(s => s.onchange = async () => { await api('/api/social/accounts/' + encodeURIComponent(s.dataset.k), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({group: s.value})}); refreshNow(); });
  document.querySelectorAll('button.rm').forEach(b => b.onclick = async () => { if (!confirm('Odłączyć to konto?')) return; await api('/api/social/accounts/' + encodeURIComponent(b.dataset.k), {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({remove: true})}); loadSettings(); load(); });
}

async function refreshNow() { await api('/api/social/refresh', {method: 'POST'}); setTimeout(load, 800); }

$('#refresh').onclick = refreshNow;
$('#groups').onclick = e => { const b = e.target.closest('button'); if (!b) return; group = b.dataset.g; $('#groups').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); };
$('#range').onclick = e => { const b = e.target.closest('button'); if (!b) return; range = +b.dataset.r; $('#range').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); render(); };
$('#save').onclick = async () => {
  const body = {};
  for (const k of ['GOOGLE_CLIENT_ID', 'GOOGLE_CLIENT_SECRET', 'IG_APP_ID', 'IG_APP_SECRET', 'APIFY_TOKEN', 'TIKTOK_PROFILES']) body[k] = $('#' + k).value;
  await api('/api/social/config', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  $('#saved').textContent = 'Zapisano'; setTimeout(() => $('#saved').textContent = '', 2500); loadSettings();
};
$('#c-yt').onclick = () => location.href = '/api/social/google/connect?group=' + $('#grp').value;
$('#c-ig').onclick = () => location.href = '/api/social/instagram/connect?group=' + $('#grp').value;

const qs = new URLSearchParams(location.search);
if (qs.get('blad')) $('#msg').innerHTML = `<div class="note bad">${esc(qs.get('blad'))}</div>`;
if (qs.get('ok')) $('#msg').innerHTML = `<div class="note good">Połączono (${esc(qs.get('ok'))}). Statystyki pobierają się w tle.</div>`;
if (qs.get('blad') || qs.get('ok')) { history.replaceState(null, '', '/social.html'); $('#settings').open = true; }
load().then(loadSettings).catch(() => {});
</script>
</body>
</html>
